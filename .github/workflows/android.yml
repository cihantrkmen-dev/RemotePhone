          write_file("app/src/main/java/com/example/remotephone/HotspotLanBridge.kt", r"""
              package com.example.remotephone

              import android.content.Context
              import android.net.ConnectivityManager
              import android.net.LinkProperties
              import android.net.Network
              import android.net.NetworkCapabilities
              import android.net.wifi.WifiManager
              import kotlinx.coroutines.*
              import java.io.BufferedReader
              import java.io.InputStreamReader
              import java.io.PrintWriter
              import java.net.DatagramPacket
              import java.net.DatagramSocket
              import java.net.Inet4Address
              import java.net.InetAddress
              import java.net.InetSocketAddress
              import java.net.NetworkInterface
              import java.net.ServerSocket
              import java.net.Socket
              import java.util.concurrent.CopyOnWriteArraySet

              object HotspotLanBridge {
                  private const val TCP_PORT = 8989
                  private const val UDP_DISCOVERY_PORT = 8990
                  private const val SOCKET_TIMEOUT_MS = 16_000
                  private const val HEARTBEAT_INTERVAL_MS = 8_000L

                  interface Listener {
                      fun onEvent(event: String, data: String) {}
                      fun onConnectionChanged(connected: Boolean) {}
                  }

                  private val listeners = CopyOnWriteArraySet<Listener>()
                  private val scope = CoroutineScope(Dispatchers.IO + SupervisorJob())
                  private val mainScope = CoroutineScope(Dispatchers.Main + SupervisorJob())
                  private var serverSocket: ServerSocket? = null
                  private var udpSocket: DatagramSocket? = null
                  private var currentSocket: Socket? = null
                  private var writer: PrintWriter? = null
                  private var activeJob: Job? = null
                  private var discoveryJob: Job? = null

                  @Volatile
                  var isConnected: Boolean = false
                      private set

                  @Volatile
                  private var discoveredHostIp: String? = null

                  fun addListener(listener: Listener) {
                      listeners.add(listener)
                      listener.onConnectionChanged(isConnected)
                  }

                  fun removeListener(listener: Listener) {
                      listeners.remove(listener)
                  }

                  fun startHostServer() {
                      stop()
                      discoveryJob = scope.launch {
                          while (isActive) {
                              try {
                                  val dSocket = DatagramSocket(UDP_DISCOVERY_PORT).apply {
                                      broadcast = true
                                      reuseAddress = true
                                  }
                                  udpSocket = dSocket
                                  val buf = ByteArray(256)
                                  while (isActive && !dSocket.isClosed) {
                                      val pkt = DatagramPacket(buf, buf.size)
                                      dSocket.receive(pkt)
                                      val msg = String(pkt.data, 0, pkt.length).trim()
                                      if (msg == "DISCOVER_REMOTEPHONE_HOST") {
                                          val reply = "REMOTEPHONE_HOST_HERE".toByteArray()
                                          dSocket.send(DatagramPacket(reply, reply.size, pkt.address, pkt.port))
                                      }
                                  }
                              } catch (_: Exception) {
                                  delay(2000)
                              } finally {
                                  try { udpSocket?.close() } catch (_: Exception) {}
                              }
                          }
                      }

                      activeJob = scope.launch {
                          while (isActive) {
                              try {
                                  serverSocket = ServerSocket(TCP_PORT).apply { reuseAddress = true }
                                  while (isActive) {
                                      val client = serverSocket!!.accept()
                                      handleSocket(client)
                                  }
                              } catch (_: Exception) {
                                  delay(1500)
                              } finally {
                                  try { serverSocket?.close() } catch (_: Exception) {}
                              }
                          }
                      }
                  }

                  fun startClientAutoConnect(context: Context) {
                      stop()
                      val appCtx = context.applicationContext
                      activeJob = scope.launch {
                          var backoffDelay = 2000L
                          while (isActive) {
                              if (!isConnected) {
                                  val connectedSocket = tryConnectToHost(appCtx)
                                  if (connectedSocket != null) {
                                      backoffDelay = 2000L
                                      handleSocket(connectedSocket)
                                  } else {
                                      notifyConnection(false)
                                  }
                              }
                              delay(backoffDelay)
                              if (backoffDelay < 7_000L) backoffDelay += 1000L
                          }
                      }
                  }

                  fun triggerScreenWakeRefresh(context: Context) {
                      val appCtx = context.applicationContext
                      val prefs = appCtx.getSharedPreferences("RemotePhonePrefs", Context.MODE_PRIVATE)
                      val savedMode = prefs.getString("saved_mode", "NONE") ?: "NONE"
                      if (savedMode == "NONE") return

                      scope.launch {
                          if (!isConnected) {
                              if (savedMode == "CLIENT") {
                                  val connectedSocket = tryConnectToHost(appCtx)
                                  if (connectedSocket != null) {
                                      handleSocket(connectedSocket)
                                  }
                              }
                          } else {
                              try {
                                  writer?.println("PING|WAKE")
                                  if (writer?.checkError() == true) {
                                      currentSocket?.close()
                                  }
                              } catch (_: Exception) {
                                  try { currentSocket?.close() } catch (_: Exception) {}
                              }
                          }
                      }
                  }

                  fun findActiveWifiNetwork(context: Context): Network? {
                      val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      for (net in cm.allNetworks) {
                          val caps = cm.getNetworkCapabilities(net) ?: continue
                          if (caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)) {
                              return net
                          }
                      }
                      return cm.activeNetwork
                  }

                  private fun tryConnectToHost(context: Context): Socket? {
                      val wifiNetwork = findActiveWifiNetwork(context)
                      val candidates = collectAllCandidateHostIps(context, wifiNetwork)

                      discoverHostViaUdpBroadcast(wifiNetwork)?.let { foundIp ->
                          discoveredHostIp = foundIp
                          candidates.add(0, foundIp)
                      }

                      for (ip in candidates.distinct()) {
                          try {
                              val s = Socket()
                              try { wifiNetwork?.bindSocket(s) } catch (_: Exception) {}
                              s.connect(InetSocketAddress(ip, TCP_PORT), 1600)
                              discoveredHostIp = ip
                              return s
                          } catch (_: Exception) {}
                      }
                      return null
                  }

                  private fun collectAllCandidateHostIps(context: Context, wifiNetwork: Network?): MutableList<String> {
                      val list = mutableListOf<String>()
                      discoveredHostIp?.let { if (it.isNotBlank()) list.add(it) }

                      val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager

                      if (wifiNetwork != null) {
                          val linkProps: LinkProperties? = cm.getLinkProperties(wifiNetwork)
                          if (linkProps != null) {
                              for (route in linkProps.routes) {
                                  val gw = route.gateway?.hostAddress
                                  if (!gw.isNullOrEmpty() && gw != "0.0.0.0" && !gw.contains(":")) {
                                      list.add(gw)
                                  }
                              }
                              for (linkAddr in linkProps.linkAddresses) {
                                  val addr = linkAddr.address
                                  if (addr is Inet4Address && !addr.isLoopbackAddress) {
                                      val hostAddr = addr.hostAddress ?: ""
                                      val prefix = hostAddr.substringBeforeLast(".", "")
                                      if (prefix.isNotEmpty()) {
                                          list.add("$prefix.1")
                                      }
                                  }
                              }
                          }
                      }

                      try {
                          val wm = context.applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                          @Suppress("DEPRECATION")
                          val dhcp = wm.dhcpInfo
                          if (dhcp != null && dhcp.gateway != 0) {
                              val g = dhcp.gateway
                              val dhcpGw = "${g and 0xFF}.${(g shr 8) and 0xFF}.${(g shr 16) and 0xFF}.${(g shr 24) and 0xFF}"
                              if (dhcpGw != "0.0.0.0") list.add(dhcpGw)
                          }
                      } catch (_: Exception) {}

                      try {
                          val interfaces = NetworkInterface.getNetworkInterfaces()
                          while (interfaces.hasMoreElements()) {
                              val intf = interfaces.nextElement()
                              if (!intf.isUp || intf.isLoopback) continue
                              for (ia in intf.interfaceAddresses) {
                                  val addr = ia.address
                                  if (addr is Inet4Address) {
                                      val prefix = (addr.hostAddress ?: "").substringBeforeLast(".", "")
                                      if (prefix.isNotEmpty()) list.add("$prefix.1")
                                  }
                              }
                          }
                      } catch (_: Exception) {}

                      list.add("192.168.43.1")
                      list.add("192.168.137.1")
                      return list
                  }

                  private fun discoverHostViaUdpBroadcast(wifiNetwork: Network?): String? {
                      var tempSocket: DatagramSocket? = null
                      try {
                          tempSocket = DatagramSocket().apply {
                              broadcast = true
                              soTimeout = 650
                          }
                          try { wifiNetwork?.bindSocket(tempSocket) } catch (_: Exception) {}

                          val req = "DISCOVER_REMOTEPHONE_HOST".toByteArray()
                          val broadcastTargets = mutableSetOf("255.255.255.255")

                          val interfaces = NetworkInterface.getNetworkInterfaces()
                          while (interfaces.hasMoreElements()) {
                              val intf = interfaces.nextElement()
                              if (!intf.isUp || intf.isLoopback) continue
                              for (ia in intf.interfaceAddresses) {
                                  val bcast = ia.broadcast
                                  if (bcast is Inet4Address) {
                                      bcast.hostAddress?.let { broadcastTargets.add(it) }
                                  }
                              }
                          }

                          for (target in broadcastTargets) {
                              try {
                                  tempSocket.send(
                                      DatagramPacket(req, req.size, InetAddress.getByName(target), UDP_DISCOVERY_PORT)
                                  )
                              } catch (_: Exception) {}
                          }

                          val buf = ByteArray(256)
                          val respPkt = DatagramPacket(buf, buf.size)
                          tempSocket.receive(respPkt)
                          val reply = String(respPkt.data, 0, respPkt.length).trim()
                          if (reply == "REMOTEPHONE_HOST_HERE") {
                              return respPkt.address?.hostAddress
                          }
                      } catch (_: Exception) {
                      } finally {
                          try { tempSocket?.close() } catch (_: Exception) {}
                      }
                      return null
                  }

                  fun stop() {
                      activeJob?.cancel()
                      discoveryJob?.cancel()
                      writer = null
                      try { udpSocket?.close() } catch (_: Exception) {}
                      try { currentSocket?.close() } catch (_: Exception) {}
                      try { serverSocket?.close() } catch (_: Exception) {}
                      notifyConnection(false)
                  }

                  private suspend fun handleSocket(socket: Socket) {
                      try { currentSocket?.close() } catch (_: Exception) {}
                      currentSocket = socket
                      socket.keepAlive = true
                      socket.tcpNoDelay = true
                      socket.soTimeout = SOCKET_TIMEOUT_MS

                      writer = PrintWriter(socket.getOutputStream(), true)
                      val reader = BufferedReader(InputStreamReader(socket.inputStream))
                      notifyConnection(true)

                      val heartbeatJob = scope.launch {
                          while (isActive && !socket.isClosed) {
                              try {
                                  writer?.println("PING|")
                                  if (writer?.checkError() == true) {
                                      socket.close()
                                      break
                                  }
                              } catch (_: Exception) {
                                  socket.close()
                                  break
                              }
                              delay(HEARTBEAT_INTERVAL_MS)
                          }
                      }

                      try {
                          while (!socket.isClosed) {
                              val line = reader.readLine() ?: break
                              val parts = line.split("|", limit = 2)
                              val event = parts[0]
                              val data = parts.getOrElse(1) { "" }

                              when (event) {
                                  "PING" -> writer?.println("PONG|$data")
                                  "PONG" -> {}
                                  else -> notifyEvent(event, data)
                              }
                          }
                      } catch (_: Exception) {
                      } finally {
                          heartbeatJob.cancel()
                          writer = null
                          try { socket.close() } catch (_: Exception) {}
                          notifyConnection(false)
                      }
                  }

                  fun send(event: String, data: String = "") {
                      scope.launch {
                          try {
                              val w = writer
                              if (w == null) {
                                  notifyConnection(false)
                                  return@launch
                              }
                              w.println("$event|$data")
                              if (w.checkError()) {
                                  try { currentSocket?.close() } catch (_: Exception) {}
                                  notifyConnection(false)
                              }
                          } catch (_: Exception) {
                              notifyConnection(false)
                          }
                      }
                  }

                  private fun notifyEvent(event: String, data: String) {
                      mainScope.launch {
                          for (listener in listeners) listener.onEvent(event, data)
                      }
                  }

                  private fun notifyConnection(connected: Boolean) {
                      isConnected = connected
                      mainScope.launch {
                          for (listener in listeners) listener.onConnectionChanged(connected)
                      }
                  }
              }
          """)

          write_file("app/src/main/java/com/example/remotephone/BridgeKeepAliveService.kt", r"""
              package com.example.remotephone

              import android.annotation.SuppressLint
              import android.app.Notification
              import android.app.NotificationChannel
              import android.app.NotificationManager
              import android.app.PendingIntent
              import android.app.Service
              import android.content.BroadcastReceiver
              import android.content.Context
              import android.content.Intent
              import android.content.IntentFilter
              import android.content.pm.ServiceInfo
              import android.media.Ringtone
              import android.media.RingtoneManager
              import android.net.ConnectivityManager
              import android.net.Network
              import android.net.NetworkCapabilities
              import android.net.NetworkRequest
              import android.net.wifi.WifiManager
              import android.os.BatteryManager
              import android.os.Build
              import android.os.IBinder
              import android.os.PowerManager
              import android.os.VibrationEffect
              import android.os.Vibrator
              import android.telephony.SmsManager
              import android.util.Base64
              import android.widget.Toast
              import androidx.core.app.NotificationCompat
              import androidx.core.app.ServiceCompat
              import java.text.SimpleDateFormat
              import java.util.Date
              import java.util.Locale
              import java.util.concurrent.CopyOnWriteArrayList

              class BridgeKeepAliveService : Service(), HotspotLanBridge.Listener, BluetoothMonitor.Listener {

                  companion object {
                      private const val CHANNEL_ID = "RemotePhoneKeepAliveChannel"
                      private const val CALL_CHANNEL_ID = "IncomingRemoteCallChannel"
                      private const val MISSED_CALL_CHANNEL_ID = "MissedRemoteCallChannel"
                      private const val SMS_CHANNEL_ID = "IncomingRemoteSmsChannel"
                      private const val MISSED_CALL_GROUP = "GROUP_MISSED_REMOTE_CALLS"
                      private const val NOTIFICATION_ID = 1001
                      const val CALL_NOTIFICATION_ID = 2002

                      var instance: BridgeKeepAliveService? = null
                      val pendingOfflineMissedCalls = CopyOnWriteArrayList<String>()
                      val pendingOfflineSms = CopyOnWriteArrayList<String>()

                      fun stopIncomingRinging() {
                          instance?.stopRingerAndVibration()
                      }
                  }

                  private var wakeLock: PowerManager.WakeLock? = null
                  private var wifiLock: WifiManager.WifiLock? = null
                  private var multicastLock: WifiManager.MulticastLock? = null
                  private var networkCallback: ConnectivityManager.NetworkCallback? = null
                  private var activeRingtone: Ringtone? = null
                  private var vibrator: Vibrator? = null

                  private val screenWakeReceiver = object : BroadcastReceiver() {
                      override fun onReceive(context: Context?, intent: Intent?) {
                          when (intent?.action) {
                              Intent.ACTION_SCREEN_ON,
                              Intent.ACTION_USER_PRESENT,
                              WifiManager.NETWORK_STATE_CHANGED_ACTION -> {
                                  HotspotLanBridge.triggerScreenWakeRefresh(this@BridgeKeepAliveService)
                              }
                          }
                      }
                  }

                  override fun onCreate() {
                      super.onCreate()
                      instance = this
                      vibrator = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                      BluetoothMonitor.init(this)
                      createNotificationChannels()
                      acquireHardwareLocks()
                      HotspotLanBridge.addListener(this)
                      BluetoothMonitor.addListener(this)

                      val filter = IntentFilter().apply {
                          addAction(Intent.ACTION_SCREEN_ON)
                          addAction(Intent.ACTION_USER_PRESENT)
                          addAction(WifiManager.NETWORK_STATE_CHANGED_ACTION)
                      }
                      registerReceiver(screenWakeReceiver, filter)
                      registerInternetlessWifiWatcher()
                  }

                  override fun onHeadsetStateChanged(status: HeadsetStatus) {
                      val prefs = getSharedPreferences("RemotePhonePrefs", Context.MODE_PRIVATE)
                      if (prefs.getString("saved_mode", "") == "HOST") {
                          if (HotspotLanBridge.isConnected) {
                              sendHostTelemetry()
                          }
                          HostInCallService.instance?.onBluetoothHeadsetReconnected()
                      }
                  }

                  private fun registerInternetlessWifiWatcher() {
                      try {
                          val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                          val req = NetworkRequest.Builder()
                              .addTransportType(NetworkCapabilities.TRANSPORT_WIFI)
                              .removeCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                              .build()

                          val cb = object : ConnectivityManager.NetworkCallback() {
                              override fun onAvailable(network: Network) {
                                  HotspotLanBridge.triggerScreenWakeRefresh(this@BridgeKeepAliveService)
                              }
                              override fun onLost(network: Network) {
                                  HotspotLanBridge.triggerScreenWakeRefresh(this@BridgeKeepAliveService)
                              }
                          }
                          networkCallback = cb
                          cm.registerNetworkCallback(req, cb)
                      } catch (_: Exception) {}
                  }

                  override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                      val prefs = getSharedPreferences("RemotePhonePrefs", Context.MODE_PRIVATE)
                      val mode = intent?.getStringExtra("MODE") ?: prefs.getString("saved_mode", "NONE") ?: "NONE"

                      if (mode == "NONE") {
                          HotspotLanBridge.stop()
                          stopForeground(STOP_FOREGROUND_REMOVE)
                          stopSelf()
                          return START_NOT_STICKY
                      }

                      acquireHardwareLocks()

                      val roleText = when (mode) {
                          "HOST" -> "1. Telefon (Note 10 Lite Ana Hat & SMS) Aktif"
                          "CLIENT" -> "2. Telefon (S25 Ultra Uzak Kontrolcü & SMS) Aktif"
                          else -> "Servis Hazır"
                      }

                      val notification: Notification = NotificationCompat.Builder(this, CHANNEL_ID)
                          .setContentTitle("Telefon & SMS Köprüsü")
                          .setContentText(roleText)
                          .setSmallIcon(R.drawable.ic_launcher)
                          .setOngoing(true)
                          .setPriority(NotificationCompat.PRIORITY_LOW)
                          .build()

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                          ServiceCompat.startForeground(
                              this,
                              NOTIFICATION_ID,
                              notification,
                              ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                          )
                      } else {
                          startForeground(NOTIFICATION_ID, notification)
                      }

                      if (mode == "HOST") {
                          HotspotLanBridge.startHostServer()
                      } else if (mode == "CLIENT") {
                          HotspotLanBridge.startClientAutoConnect(this)
                      }

                      return START_STICKY
                  }

                  override fun onConnectionChanged(connected: Boolean) {
                      if (connected) {
                          val prefs = getSharedPreferences("RemotePhonePrefs", Context.MODE_PRIVATE)
                          val mode = prefs.getString("saved_mode", "")
                          if (mode == "CLIENT") {
                              HotspotLanBridge.send("REQ_CONTACTS")
                          } else if (mode == "HOST") {
                              sendHostTelemetry()
                              flushPendingOfflineEvents()
                          }
                      }
                  }

                  private fun flushPendingOfflineEvents() {
                      if (!HotspotLanBridge.isConnected) return
                      if (pendingOfflineMissedCalls.isNotEmpty()) {
                          val copy = pendingOfflineMissedCalls.toList()
                          pendingOfflineMissedCalls.clear()
                          for (missedPayload in copy) {
                              HotspotLanBridge.send("MISSED", missedPayload)
                          }
                      }
                      if (pendingOfflineSms.isNotEmpty()) {
                          val smsCopy = pendingOfflineSms.toList()
                          pendingOfflineSms.clear()
                          for (smsPayload in smsCopy) {
                              HotspotLanBridge.send("SMS_IN", smsPayload)
                          }
                      }
                  }

                  @SuppressLint("MissingPermission")
                  fun sendHostTelemetry() {
                      try {
                          val bm = getSystemService(Context.BATTERY_SERVICE) as? BatteryManager
                          val pct = bm?.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY) ?: 100
                          val hs = BluetoothMonitor.getLocalHeadsetStatus(this)
                          val readyFlag = if (hs.isReady) "1" else "0"
                          HotspotLanBridge.send(
                              "TELEMETRY",
                              "$readyFlag~Note 10 Lite Pil: %$pct | ${hs.summaryText}"
                          )
                      } catch (_: Exception) {}
                  }

                  fun startRingerAndVibration() {
                      stopRingerAndVibration()
                      try {
                          val uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                          activeRingtone = RingtoneManager.getRingtone(applicationContext, uri)?.apply { play() }
                      } catch (_: Exception) {}
                      try {
                          val pattern = longArrayOf(0, 1000, 1000)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              vibrator?.vibrate(VibrationEffect.createWaveform(pattern, 0))
                          } else {
                              @Suppress("DEPRECATION")
                              vibrator?.vibrate(pattern, 0)
                          }
                      } catch (_: Exception) {}
                  }

                  fun stopRingerAndVibration() {
                      try { activeRingtone?.stop() } catch (_: Exception) {}
                      activeRingtone = null
                      try { vibrator?.cancel() } catch (_: Exception) {}
                  }

                  @SuppressLint("MissingPermission")
                  override fun onEvent(event: String, data: String) {
                      val prefs = getSharedPreferences("RemotePhonePrefs", Context.MODE_PRIVATE)
                      val mode = prefs.getString("saved_mode", "")

                      when (event) {
                          "TELEMETRY" -> {
                              val parts = data.split("~", limit = 2)
                              if (parts.size == 2) {
                                  BluetoothMonitor.hostHeadsetReady = (parts[0] == "1")
                                  val summaryPart = parts[1].substringAfter("| ", "")
                                  if (summaryPart.isNotEmpty()) {
                                      BluetoothMonitor.hostHeadsetSummary = summaryPart
                                  }
                              }
                          }
                          "INCOMING" -> {
                              if (mode == "CLIENT") {
                                  HotspotLanBridge.send("INCOMING_ACK")
                                  startRingerAndVibration()
                                  showIncomingCallNotification(data, isLocalHostFallback = false)
                              }
                          }
                          "CONNECTED" -> {
                              stopRingerAndVibration()
                          }
                          "ENDED" -> {
                              stopRingerAndVibration()
                              val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                              nm.cancel(CALL_NOTIFICATION_ID)
                          }
                          "MISSED" -> {
                              stopRingerAndVibration()
                              val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                              nm.cancel(CALL_NOTIFICATION_ID)
                              if (mode == "CLIENT") {
                                  showMissedCallNotificationOnClient(data)
                              }
                          }
                          "SMS_IN" -> {
                              if (mode == "CLIENT") {
                                  handleIncomingSmsOnClient(data)
                              }
                          }
                          "SEND_SMS" -> {
                              if (mode == "HOST") {
                                  handleSendSmsOnHost(data)
                              }
                          }
                          "SMS_STATUS" -> {
                              if (mode == "CLIENT") {
                                  Toast.makeText(this, data, Toast.LENGTH_LONG).show()
                              }
                          }
                          "DIAL" -> {
                              if (mode == "HOST" && HostInCallService.instance == null && data.isNotEmpty()) {
                                  HostInCallService.placeSystemCall(this, data)
                              }
                          }
                          "REQ_CONTACTS" -> {
                              if (mode == "HOST") {
                                  val contactsPayload = ContactHelper.serializeContacts(this)
                                  if (contactsPayload.isNotEmpty()) {
                                      HotspotLanBridge.send("RES_CONTACTS", contactsPayload)
                                  }
                                  val logsPayload = ContactHelper.serializeCallLogs(this)
                                  if (logsPayload.isNotEmpty()) {
                                      HotspotLanBridge.send("RES_CALLLOGS", logsPayload)
                                  }
                                  sendHostTelemetry()
                                  flushPendingOfflineEvents()
                              }
                          }
                          "RES_CONTACTS" -> {
                              ContactHelper.updateSyncedContacts(data)
                          }
                          "RES_CALLLOGS" -> {
                              ContactHelper.updateSyncedCallLogs(data)
                          }
                      }
                  }

                  private fun handleSendSmsOnHost(payload: String) {
                      val parts = payload.split("~", limit = 2)
                      if (parts.size < 2) return
                      val targetNumber = parts[0].trim()
                      val bodyText = try {
                          String(Base64.decode(parts[1], Base64.NO_WRAP), Charsets.UTF_8)
                      } catch (_: Exception) {
                          ""
                      }
                      if (targetNumber.isEmpty() || bodyText.isEmpty()) return

                      try {
                          val smsManager: SmsManager = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                              getSystemService(SmsManager::class.java)
                          } else {
                              @Suppress("DEPRECATION")
                              SmsManager.getDefault()
                          }
                          val partsList = smsManager.divideMessage(bodyText)
                          if (partsList.size > 1) {
                              smsManager.sendMultipartTextMessage(targetNumber, null, partsList, null, null)
                          } else {
                              smsManager.sendTextMessage(targetNumber, null, bodyText, null, null)
                          }
                          val timeStr = SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date())
                          val resolvedName = ContactHelper.getContactName(this, targetNumber)
                          ContactHelper.addRecentSms(targetNumber, resolvedName, "↗ Siz: $bodyText", timeStr)
                          HotspotLanBridge.send("SMS_STATUS", "✅ SMS Gönderildi ($targetNumber)")
                      } catch (e: Exception) {
                          HotspotLanBridge.send("SMS_STATUS", "❌ SMS Gönderilemedi: ${e.localizedMessage ?: "Hata"}")
                      }
                  }

                  private fun handleIncomingSmsOnClient(payload: String) {
                      val parts = payload.split("~", limit = 4)
                      if (parts.size < 4) return
                      val senderNum = parts[0].ifBlank { "Bilinmeyen" }
                      val hostName = parts[1].takeIf { it.isNotBlank() }
                      val timeStr = parts[2]
                      val bodyText = try {
                          String(Base64.decode(parts[3], Base64.NO_WRAP), Charsets.UTF_8)
                      } catch (_: Exception) {
                          parts[3]
                      }

                      val localName = ContactHelper.getContactName(this, senderNum)
                      val finalName = localName ?: hostName
                      ContactHelper.addRecentSms(senderNum, finalName, bodyText, timeStr)

                      val title = if (!finalName.isNullOrBlank()) {
                          "💬 SMS: $finalName ($senderNum)"
                      } else {
                          "💬 SMS: $senderNum"
                      }

                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      val uniqueId = (System.currentTimeMillis() and 0xFFFFFFF).toInt()

                      val replyIntent = Intent(this, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                          putExtra("OPEN_SMS_TARGET", senderNum)
                      }
                      val replyPendingIntent = PendingIntent.getActivity(
                          this,
                          uniqueId,
                          replyIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )

                      val builder = NotificationCompat.Builder(this, SMS_CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.sym_action_email)
                          .setContentTitle(title)
                          .setContentText(bodyText)
                          .setStyle(NotificationCompat.BigTextStyle().bigText("$bodyText\n\nSaat: $timeStr"))
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setCategory(NotificationCompat.CATEGORY_MESSAGE)
                          .setContentIntent(replyPendingIntent)
                          .setAutoCancel(true)
                          .addAction(android.R.drawable.sym_action_email, "💬 Yanıtla", replyPendingIntent)

                      val otpCode = Regex("\\b(\\d{4,8})\\b").find(bodyText)?.value
                      if (!otpCode.isNullOrEmpty()) {
                          val copyIntent = Intent(this, OtpCopyReceiver::class.java).apply {
                              putExtra("OTP_CODE", otpCode)
                          }
                          val copyPendingIntent = PendingIntent.getBroadcast(
                              this,
                              uniqueId + 1,
                              copyIntent,
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                          )
                          builder.addAction(
                              android.R.drawable.ic_menu_save,
                              "📋 Kodu Kopyala ($otpCode)",
                              copyPendingIntent
                          )
                      }

                      nm.notify(uniqueId, builder.build())
                  }

                  fun showIncomingCallNotification(callerPayload: String, isLocalHostFallback: Boolean) {
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      val (rawNumber, resolvedName) = ContactHelper.resolveCallerInfo(this, callerPayload)
                      val displayTitle = resolvedName ?: rawNumber
                      val headsetReady = BluetoothMonitor.isAnyHeadsetReady(this)
                      val warningSuffix = if (!headsetReady) " • ⚠️ KULAKLIK BAĞLI DEĞİL!" else ""
                      val displaySubText = if (resolvedName != null) {
                          "$rawNumber • Gelen Arama$warningSuffix"
                      } else {
                          "Gelen Arama$warningSuffix"
                      }

                      val fullScreenIntent = Intent(this, RemoteCallActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                          putExtra("CALLER_NUMBER", callerPayload)
                          putExtra("IS_OUTGOING", false)
                          putExtra("IS_LOCAL_FALLBACK", isLocalHostFallback)
                      }
                      val fullScreenPendingIntent = PendingIntent.getActivity(
                          this, 0, fullScreenIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )

                      val notification = NotificationCompat.Builder(this, CALL_CHANNEL_ID)
                          .setSmallIcon(R.drawable.ic_launcher)
                          .setContentTitle(displayTitle)
                          .setContentText(displaySubText)
                          .setPriority(NotificationCompat.PRIORITY_MAX)
                          .setCategory(NotificationCompat.CATEGORY_CALL)
                          .setFullScreenIntent(fullScreenPendingIntent, true)
                          .setOngoing(true)
                          .setAutoCancel(true)
                          .build()

                      nm.notify(CALL_NOTIFICATION_ID, notification)
                      try {
                          startActivity(fullScreenIntent)
                      } catch (_: Exception) {}
                  }

                  private fun showMissedCallNotificationOnClient(missedPayload: String) {
                      val parts = missedPayload.split("~", limit = 3)
                      val rawNumber = parts.getOrNull(0)?.ifBlank { "Bilinmeyen Numara" } ?: "Bilinmeyen Numara"
                      val hostName = parts.getOrNull(1)?.takeIf { it.isNotBlank() }
                      val timeStr = parts.getOrNull(2)?.takeIf { it.isNotBlank() } ?: ""

                      val localName = ContactHelper.getContactName(this, rawNumber)
                      val finalName = localName ?: hostName
                      val title = if (!finalName.isNullOrBlank()) "Cevapsız Arama: $finalName" else "Cevapsız Arama: $rawNumber"
                      val body = if (!finalName.isNullOrBlank()) {
                          "$rawNumber • Saat: $timeStr"
                      } else {
                          "Numara: $rawNumber • Saat: $timeStr"
                      }

                      ContactHelper.prependLocalMissedCallLog(rawNumber, finalName, timeStr)

                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      val uniqueNotifId = (System.currentTimeMillis() and 0xFFFFFFF).toInt()

                      val openDialerIntent = Intent(this, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                          putExtra("PREFILL_NUMBER", rawNumber)
                      }
                      val contentPendingIntent = PendingIntent.getActivity(
                          this,
                          uniqueNotifId,
                          openDialerIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )

                      val callBackIntent = Intent(this, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                          putExtra("PREFILL_NUMBER", rawNumber)
                          putExtra("AUTO_CALL_FROM_NOTIFICATION", true)
                      }
                      val callBackPendingIntent = PendingIntent.getActivity(
                          this,
                          uniqueNotifId + 1,
                          callBackIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )

                      val missedNotification = NotificationCompat.Builder(this, MISSED_CALL_CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.sym_call_missed)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setStyle(NotificationCompat.BigTextStyle().bigText("$body\nNumarayı geri aramak için dokunun."))
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setCategory(NotificationCompat.CATEGORY_MISSED_CALL)
                          .setContentIntent(contentPendingIntent)
                          .setAutoCancel(true)
                          .setGroup(MISSED_CALL_GROUP)
                          .addAction(android.R.drawable.sym_action_call, "Geri Ara", callBackPendingIntent)
                          .build()

                      nm.notify(uniqueNotifId, missedNotification)
                  }

                  private fun acquireHardwareLocks() {
                      if (wakeLock?.isHeld != true) {
                          val powerManager = getSystemService(Context.POWER_SERVICE) as PowerManager
                          wakeLock = powerManager.newWakeLock(
                              PowerManager.PARTIAL_WAKE_LOCK,
                              "RemotePhone::BridgeWakeLock"
                          ).apply {
                              setReferenceCounted(false)
                              acquire()
                          }
                      }

                      val wifiManager = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                      if (wifiLock?.isHeld != true) {
                          val lockMode = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              WifiManager.WIFI_MODE_FULL_LOW_LATENCY
                          } else {
                              @Suppress("DEPRECATION")
                              WifiManager.WIFI_MODE_FULL_HIGH_PERF
                          }
                          wifiLock = wifiManager.createWifiLock(lockMode, "RemotePhone::BridgeWifiLock").apply {
                              setReferenceCounted(false)
                              acquire()
                          }
                      }

                      if (multicastLock?.isHeld != true) {
                          try {
                              multicastLock = wifiManager.createMulticastLock("RemotePhone::MulticastLock").apply {
                                  setReferenceCounted(false)
                                  acquire()
                              }
                          } catch (_: Exception) {}
                      }
                  }

                  override fun onDestroy() {
                      stopRingerAndVibration()
                      val prefs = getSharedPreferences("RemotePhonePrefs", Context.MODE_PRIVATE)
                      if (prefs.getString("saved_mode", "NONE") == "NONE") {
                          HotspotLanBridge.stop()
                      }
                      HotspotLanBridge.removeListener(this)
                      BluetoothMonitor.removeListener(this)
                      try { unregisterReceiver(screenWakeReceiver) } catch (_: Exception) {}
                      try {
                          val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                          networkCallback?.let { cm.unregisterNetworkCallback(it) }
                      } catch (_: Exception) {}
                      try {
                          if (wakeLock?.isHeld == true) wakeLock?.release()
                          if (wifiLock?.isHeld == true) wifiLock?.release()
                          if (multicastLock?.isHeld == true) multicastLock?.release()
                      } catch (_: Exception) {}
                      instance = null
                      super.onDestroy()
                  }

                  override fun onBind(intent: Intent?): IBinder? = null

                  private fun createNotificationChannels() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val nm = getSystemService(NotificationManager::class.java)
                          nm.createNotificationChannel(
                              NotificationChannel(
                                  CHANNEL_ID,
                                  "Arka Plan Bağlantı Servisi",
                                  NotificationManager.IMPORTANCE_LOW
                              )
                          )
                          nm.createNotificationChannel(
                              NotificationChannel(
                                  CALL_CHANNEL_ID,
                                  "Gelen Çağrı Uyarıları",
                                  NotificationManager.IMPORTANCE_HIGH
                              ).apply {
                                  lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                              }
                          )
                          nm.createNotificationChannel(
                              NotificationChannel(
                                  MISSED_CALL_CHANNEL_ID,
                                  "Cevapsız Çağrı Bildirimleri",
                                  NotificationManager.IMPORTANCE_HIGH
                              ).apply {
                                  description = "Cevaplanmayan çağrıları bildirim kutusunda gösterir"
                                  lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                              }
                          )
                          nm.createNotificationChannel(
                              NotificationChannel(
                                  SMS_CHANNEL_ID,
                                  "Gelen SMS ve Doğrulama Bildirimleri",
                                  NotificationManager.IMPORTANCE_HIGH
                              ).apply {
                                  description = "Note 10 Lite hattına gelen SMS ve onay kodlarını gösterir"
                                  lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                              }
                          )
                      }
                  }
              }
