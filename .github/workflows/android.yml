          cat << 'EOF' | sed 's/^          //' > app/src/main/res/layout/activity_remote_call.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#1A1C1E"
              android:gravity="center_horizontal"
              android:orientation="vertical"
              android:padding="28dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:letterSpacing="0.1"
                  android:text="TELEFON GÖRÜŞMESİ"
                  android:textColor="#8AB4F8"
                  android:textSize="12sp"
                  android:textStyle="bold" />

              <com.google.android.material.card.MaterialCardView
                  android:layout_width="104dp"
                  android:layout_height="104dp"
                  android:layout_marginTop="28dp"
                  app:cardBackgroundColor="#2D3135"
                  app:cardCornerRadius="52dp"
                  app:cardElevation="0dp">

                  <ImageView
                      android:layout_width="52dp"
                      android:layout_height="52dp"
                      android:layout_gravity="center"
                      android:src="@android:drawable/ic_menu_myplaces"
                      app:tint="#E3E3E3" />
              </com.google.android.material.card.MaterialCardView>

              <TextView
                  android:id="@+id/tvCallerNumber"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="24dp"
                  android:gravity="center"
                  android:text="0555 000 00 00"
                  android:textColor="#E3E3E3"
                  android:textSize="32sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/tvCallStatus"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:gravity="center"
                  android:text="Gelen arama..."
                  android:textColor="#9AA0A6"
                  android:textSize="17sp" />

              <Chronometer
                  android:id="@+id/chronometerCallTimer"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="6dp"
                  android:textColor="#81C995"
                  android:textSize="18sp"
                  android:visibility="gone" />

              <Space
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1" />

              <LinearLayout
                  android:id="@+id/layoutInCallControls"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginBottom="36dp"
                  android:gravity="center"
                  android:orientation="horizontal"
                  android:visibility="gone">

                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btnMute"
                      style="@style/Widget.Material3.Button.TonalButton"
                      android:layout_width="110dp"
                      android:layout_height="72dp"
                      android:layout_marginEnd="16dp"
                      android:text="Sessiz"
                      android:textColor="#E3E3E3"
                      app:backgroundTint="#2D3135"
                      app:cornerRadius="36dp" />

                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btnSpeaker"
                      style="@style/Widget.Material3.Button.TonalButton"
                      android:layout_width="110dp"
                      android:layout_height="72dp"
                      android:layout_marginStart="16dp"
                      android:text="Hoparlör"
                      android:textColor="#E3E3E3"
                      app:backgroundTint="#2D3135"
                      app:cornerRadius="36dp" />
              </LinearLayout>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginBottom="20dp"
                  android:gravity="center"
                  android:orientation="horizontal">

                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btnReject"
                      android:layout_width="84dp"
                      android:layout_height="84dp"
                      android:insetLeft="0dp"
                      android:insetTop="0dp"
                      android:insetRight="0dp"
                      android:insetBottom="0dp"
                      android:text="Kapat"
                      android:textColor="#FFFFFF"
                      android:textSize="13sp"
                      app:backgroundTint="#D93025"
                      app:cornerRadius="42dp" />

                  <Space
                      android:id="@+id/spaceBetweenCallButtons"
                      android:layout_width="72dp"
                      android:layout_height="wrap_content" />

                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btnAnswer"
                      android:layout_width="84dp"
                      android:layout_height="84dp"
                      android:insetLeft="0dp"
                      android:insetTop="0dp"
                      android:insetRight="0dp"
                      android:insetBottom="0dp"
                      android:text="Yanıtla"
                      android:textColor="#FFFFFF"
                      android:textSize="13sp"
                      app:backgroundTint="#1E8E3E"
                      app:cornerRadius="42dp" />
              </LinearLayout>

          </LinearLayout>
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemotePhone-v2.2.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
