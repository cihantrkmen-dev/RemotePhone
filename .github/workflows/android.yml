          package com.example.remotephone

          import android.app.NotificationManager
          import android.content.Context
          import android.graphics.Color
          import android.media.Ringtone
          import android.media.RingtoneManager
          import android.os.Bundle
          import android.os.PowerManager
          import android.os.SystemClock
          import android.view.View
          import android.widget.Chronometer
          import android.widget.LinearLayout
          import android.widget.Space
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.material.button.MaterialButton

          class RemoteCallActivity : AppCompatActivity(), HotspotLanBridge.Listener {

              private var ringtone: Ringtone? = null
              private var proximityWakeLock: PowerManager.WakeLock? = null
              private var isMuted = false
              private var isSpeakerOn = false
              private var isLocalFallback = false
              private var rawPhoneNumber: String = ""
              private var resolvedContactName: String? = null

              private lateinit var tvCallerNumber: TextView
              private lateinit var tvCallStatus: TextView
              private lateinit var chronometer: Chronometer
              private lateinit var layoutInCallControls: LinearLayout
              private lateinit var btnAnswer: MaterialButton
              private lateinit var spaceBetween: Space

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_remote_call)

                  val isOutgoing = intent.getBooleanExtra("IS_OUTGOING", false)
                  isLocalFallback = intent.getBooleanExtra("IS_LOCAL_FALLBACK", false)
                  val callerPayload = intent.getStringExtra("CALLER_NUMBER") ?: "Bilinmeyen Numara"

                  val (number, name) = ContactHelper.resolveCallerInfo(this, callerPayload)
                  rawPhoneNumber = number
                  resolvedContactName = name

                  tvCallerNumber = findViewById(R.id.tvCallerNumber)
                  tvCallStatus = findViewById(R.id.tvCallStatus)
                  chronometer = findViewById(R.id.chronometerCallTimer)
                  layoutInCallControls = findViewById(R.id.layoutInCallControls)
                  btnAnswer = findViewById(R.id.btnAnswer)
                  val btnReject = findViewById<MaterialButton>(R.id.btnReject)
                  spaceBetween = findViewById(R.id.spaceBetweenCallButtons)
                  val btnMute = findViewById<MaterialButton>(R.id.btnMute)
                  val btnSpeaker = findViewById<MaterialButton>(R.id.btnSpeaker)

                  if (!resolvedContactName.isNullOrEmpty()) {
                      tvCallerNumber.text = resolvedContactName
                  } else {
                      tvCallerNumber.text = rawPhoneNumber
                  }

                  acquireProximitySensorLock()
                  HotspotLanBridge.addListener(this)

                  if (isOutgoing) {
                      updateStatusText("Aranıyor...")
                      btnAnswer.visibility = View.GONE
                      spaceBetween.visibility = View.GONE
                  } else {
                      updateStatusText("Gelen arama...")
                      val ringtoneUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                      ringtone = RingtoneManager.getRingtone(applicationContext, ringtoneUri)?.apply { play() }
                  }

                  SipAudioEngine.onCallConnected = {
                      runOnUiThread { switchToActiveCallUi() }
                  }

                  SipAudioEngine.onCallTerminated = {
                      runOnUiThread { cleanupAndFinish() }
                  }

                  btnMute.setOnClickListener {
                      isMuted = !isMuted
                      if (isLocalFallback) {
                          HostInCallService.instance?.setLocalMute(isMuted)
                      } else {
                          SipAudioEngine.setMuted(isMuted)
                      }
                      btnMute.setBackgroundColor(if (isMuted) Color.parseColor("#8AB4F8") else Color.parseColor("#2D3135"))
                      btnMute.setTextColor(if (isMuted) Color.parseColor("#1A1C1E") else Color.parseColor("#E3E3E3"))
                  }

                  btnSpeaker.setOnClickListener {
                      isSpeakerOn = !isSpeakerOn
                      if (isLocalFallback) {
                          HostInCallService.instance?.setLocalSpeaker(isSpeakerOn)
                      } else {
                          SipAudioEngine.setSpeakerphone(isSpeakerOn)
                      }
                      btnSpeaker.setBackgroundColor(if (isSpeakerOn) Color.parseColor("#8AB4F8") else Color.parseColor("#2D3135"))
                      btnSpeaker.setTextColor(if (isSpeakerOn) Color.parseColor("#1A1C1E") else Color.parseColor("#E3E3E3"))
                  }

                  btnAnswer.setOnClickListener {
                      ringtone?.stop()
                      btnAnswer.isEnabled = false
                      if (isLocalFallback) {
                          HostInCallService.instance?.answerLocalCall()
                          switchToActiveCallUi()
                      } else {
                          updateStatusText("Bağlanıyor...")
                          SipAudioEngine.prepareForIncomingAudio()
                          HotspotLanBridge.send("ANSWER")
                      }
                  }

                  btnReject.setOnClickListener {
                      if (isLocalFallback) {
                          HostInCallService.instance?.hangupAllCalls()
                      } else {
                          SipAudioEngine.terminateAudioCall()
                          HotspotLanBridge.send("REJECT")
                      }
                      cleanupAndFinish()
                  }
              }

              private fun updateStatusText(status: String) {
                  tvCallStatus.text = if (!resolvedContactName.isNullOrEmpty()) {
                      "$rawPhoneNumber • $status"
                  } else {
                      status
                  }
              }

              override fun onEvent(event: String, data: String) {
                  when (event) {
                      "OUTGOING_RINGING_SIP" -> updateStatusText("Karşı taraf açtı, bağlanıyor...")
                      "OUTGOING_CONNECTED" -> switchToActiveCallUi()
                      "ENDED" -> cleanupAndFinish()
                  }
              }

              private fun switchToActiveCallUi() {
                  updateStatusText("Görüşme Aktif")
                  btnAnswer.visibility = View.GONE
                  spaceBetween.visibility = View.GONE
                  layoutInCallControls.visibility = View.VISIBLE
                  if (chronometer.visibility != View.VISIBLE) {
                      chronometer.visibility = View.VISIBLE
                      chronometer.base = SystemClock.elapsedRealtime()
                      chronometer.start()
                  }
              }

              private fun acquireProximitySensorLock() {
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  if (pm.isWakeLockLevelSupported(PowerManager.PROXIMITY_SCREEN_OFF_WAKE_LOCK)) {
                      proximityWakeLock = pm.newWakeLock(
                          PowerManager.PROXIMITY_SCREEN_OFF_WAKE_LOCK,
                          "RemotePhone::ProximityWakeLock"
                      ).apply { acquire(60 * 60 * 1000L) }
                  }
              }

              private fun cleanupAndFinish() {
                  ringtone?.stop()
                  chronometer.stop()
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.cancel(BridgeKeepAliveService.CALL_NOTIFICATION_ID)
                  finish()
              }

              override fun onDestroy() {
                  HotspotLanBridge.removeListener(this)
                  ringtone?.stop()
                  try {
                      if (proximityWakeLock?.isHeld == true) proximityWakeLock?.release()
                  } catch (_: Exception) {}
                  super.onDestroy()
              }
          }
