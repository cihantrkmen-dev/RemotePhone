                          app:strokeColor="#3A404D"
                          app:strokeWidth="1dp" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginBottom="20dp"
                      android:gravity="center"
                      android:orientation="horizontal">

                      <com.google.android.material.button.MaterialButton
                          android:id="@+id/btnReject"
                          android:layout_width="88dp"
                          android:layout_height="88dp"
                          android:insetLeft="0dp"
                          android:insetTop="0dp"
                          android:insetRight="0dp"
                          android:insetBottom="0dp"
                          android:text="Kapat"
                          android:textColor="#FFFFFF"
                          android:textSize="15sp"
                          android:textStyle="bold"
                          app:backgroundTint="#DA3633"
                          app:cornerRadius="44dp" />

                      <Space
                          android:id="@+id/spaceBetweenCallButtons"
                          android:layout_width="72dp"
                          android:layout_height="wrap_content" />

                      <com.google.android.material.button.MaterialButton
                          android:id="@+id/btnAnswer"
                          android:layout_width="88dp"
                          android:layout_height="88dp"
                          android:insetLeft="0dp"
                          android:insetTop="0dp"
                          android:insetRight="0dp"
                          android:insetBottom="0dp"
                          android:text="Yanıtla"
                          android:textColor="#FFFFFF"
                          android:textSize="15sp"
                          android:textStyle="bold"
                          app:backgroundTint="#2EA043"
                          app:cornerRadius="44dp" />
                  </LinearLayout>

              </LinearLayout>
          """)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemotePhone-v4.4.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
