                      spaceBetween = findViewById(R.id.spaceBetweenCallButtons)
                      val btnMute = findViewById<MaterialButton>(R.id.btnMute)
                      val btnKeypad = findViewById<MaterialButton>(R.id.btnKeypad)
                      val btnSpeaker = findViewById<MaterialButton>(R.id.btnSpeaker)

                      tvCallerNumber.text = if (!resolvedContactName.isNullOrEmpty()) {
                          resolvedContactName
                      } else {
                          rawPhoneNumber
                      }

                      acquireProximitySensorLock()
                      HotspotLanBridge.addListener(this)
                      BluetoothMonitor.addListener(this)

                      if (isOutgoingCall) {
                          requestAutoPauseMedia()
                          val hsSummary = BluetoothMonitor.getCombinedHeadsetSummary(this)
                          updateStatusText("Aranıyor ($hsSummary)...")
                          btnAnswer.visibility = View.GONE
                          spaceBetween.visibility = View.GONE
                          layoutInCallControls.visibility = View.VISIBLE
                      } else {
                          updateStatusText("Gelen arama...")
                      }

                      evaluateHeadsetAndConnectionWarnings()

                      btnMute.setOnClickListener {
                          isMuted = !isMuted
                          if (isLocalFallback) {
                              HostInCallService.instance?.setLocalMute(isMuted)
                          } else {
                              HotspotLanBridge.send("MUTE", isMuted.toString())
                          }
                          btnMute.setBackgroundColor(if (isMuted) Color.parseColor("#8AB4F8") else Color.parseColor("#282C34"))
                          btnMute.setTextColor(if (isMuted) Color.parseColor("#0F1115") else Color.parseColor("#FFFFFF"))
                      }

                      btnKeypad.setOnClickListener {
                          showInCallDtmfDialog()
                      }

                      btnSpeaker.setOnClickListener {
                          isSpeakerOn = !isSpeakerOn
                          if (isLocalFallback) {
                              HostInCallService.instance?.setLocalSpeaker(isSpeakerOn)
                          } else {
                              HotspotLanBridge.send("SPEAKER", isSpeakerOn.toString())
                          }
                          btnSpeaker.setBackgroundColor(if (isSpeakerOn) Color.parseColor("#8AB4F8") else Color.parseColor("#282C34"))
                          btnSpeaker.setTextColor(if (isSpeakerOn) Color.parseColor("#0F1115") else Color.parseColor("#FFFFFF"))
                          evaluateHeadsetAndConnectionWarnings()
                      }

                      btnAnswer.setOnClickListener {
                          BridgeKeepAliveService.stopIncomingRinging()
                          btnAnswer.isEnabled = false
                          requestAutoPauseMedia()

                          if (isLocalFallback) {
                              HostInCallService.instance?.answerLocalCall()
                              switchToActiveCallUi()
                          } else {
                              updateStatusText("Bağlanıyor...")
                              HotspotLanBridge.send("ANSWER")
                              switchToActiveCallUi()
                          }
                      }

                      btnReject.setOnClickListener {
                          BridgeKeepAliveService.stopIncomingRinging()
                          btnReject.isEnabled = false
                          btnAnswer.isEnabled = false

                          if (isLocalFallback) {
                              HostInCallService.instance?.hangupAllCalls()
                          } else {
                              HotspotLanBridge.send("HANGUP")
                          }
                          cleanupAndFinish()
                      }
                  }

                  override fun onHeadsetStateChanged(status: HeadsetStatus) {
                      runOnUiThread { evaluateHeadsetAndConnectionWarnings() }
                  }

                  private fun showInCallDtmfDialog() {
                      val container = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(32, 24, 32, 16)
                      }
                      val tvTyped = TextView(this).apply {
                          textSize = 24f
                          setTextColor(Color.WHITE)
                          gravity = Gravity.CENTER
                          setPadding(0, 0, 0, 20)
                      }
                      container.addView(tvTyped)

                      val grid = GridLayout(this).apply {
                          columnCount = 3
                          rowCount = 4
                      }
                      val digits = listOf("1", "2", "3", "4", "5", "6", "7", "8", "9", "*", "0", "#")
                      for (d in digits) {
                          val btn = Button(this).apply {
                              text = d
                              textSize = 20f
                              layoutParams = GridLayout.LayoutParams().apply {
                                  width = 0
                                  height = 140
                                  columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f)
                                  setMargins(8, 8, 8, 8)
                              }
                              setOnClickListener {
                                  tvTyped.append(d)
                                  if (isLocalFallback) {
                                      HostInCallService.instance?.playLocalDtmf(d[0])
                                  } else {
                                      HotspotLanBridge.send("DTMF", d)
                                  }
                              }
                          }
                          grid.addView(btn)
                      }
                      container.addView(grid)

                      AlertDialog.Builder(this)
                          .setTitle("Tuş Takımı (DTMF)")
                          .setView(container)
                          .setNegativeButton("Kapat", null)
                          .show()
                  }

                  private fun evaluateHeadsetAndConnectionWarnings() {
                      if (!isLocalFallback && !HotspotLanBridge.isConnected) {
                          tvWarningBanner.visibility = View.VISIBLE
                          tvWarningBanner.setBackgroundColor(Color.parseColor("#5C1E1E"))
                          tvWarningBanner.setTextColor(Color.parseColor("#FFB4AB"))
                          tvWarningBanner.text = "⚠️ Note 10 Lite ile Bağlantı Koptu! Yeniden bağlanmaya çalışılıyor..."
                          playWarningAlertTone()
                          return
                      }

                      val headsetReady = BluetoothMonitor.isAnyHeadsetReady(this)
                      if (!headsetReady && !isSpeakerOn) {
                          tvWarningBanner.visibility = View.VISIBLE
                          tvWarningBanner.setBackgroundColor(Color.parseColor("#4D3800"))
                          tvWarningBanner.setTextColor(Color.parseColor("#FFDF9E"))
                          tvWarningBanner.text = if (!isOutgoingCall && btnAnswer.visibility == View.VISIBLE) {
                              "⚠️ Bluetooth Kulaklık Bağlı Değil!\nYanıtlarsanız ses Note 10 Lite üzerinde açılır. Lütfen kulaklığınızı açın veya Hoparlör tuşunu kullanın."
                          } else {
                              "⚠️ Bluetooth Kulaklık Hazır Değil!\nSes şu an Note 10 Lite üzerinde. Kulaklığınızı açtığınız anda ses otomatik aktarılacaktır."
                          }
                          playWarningAlertTone()
                      } else {
                          tvWarningBanner.visibility = View.GONE
                      }
                  }

                  private fun playWarningAlertTone() {
                      try {
                          val tg = ToneGenerator(AudioManager.STREAM_NOTIFICATION, 85)
                          tg.startTone(ToneGenerator.TONE_PROP_ACK, 220)
                      } catch (_: Exception) {}
                      try {
                          val vib = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              vib?.vibrate(VibrationEffect.createOneShot(180, VibrationEffect.DEFAULT_AMPLITUDE))
                          }
                      } catch (_: Exception) {}
                  }

                  private fun requestAutoPauseMedia() {
                      try {
                          val am = getSystemService(Context.AUDIO_SERVICE) as? AudioManager ?: return
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              val req = AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN_TRANSIENT)
                                  .build()
                              audioFocusRequest = req
                              am.requestAudioFocus(req)
                          } else {
                              @Suppress("DEPRECATION")
                              am.requestAudioFocus(null, AudioManager.STREAM_MUSIC, AudioManager.AUDIOFOCUS_GAIN_TRANSIENT)
                          }
                      } catch (_: Exception) {}
                  }

                  private fun releaseAutoPauseMedia() {
                      try {
                          val am = getSystemService(Context.AUDIO_SERVICE) as? AudioManager ?: return
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              audioFocusRequest?.let { am.abandonAudioFocusRequest(it) }
                          }
                      } catch (_: Exception) {}
                  }

                  private fun updateStatusText(status: String) {
                      tvCallStatus.text = if (!resolvedContactName.isNullOrEmpty()) {
                          "$rawPhoneNumber • $status"
                      } else {
                          status
                      }
                  }

                  override fun onConnectionChanged(connected: Boolean) {
                      evaluateHeadsetAndConnectionWarnings()
                  }

                  override fun onEvent(event: String, data: String) {
                      when (event) {
                          "CONNECTED" -> switchToActiveCallUi()
                          "BT_ROUTED" -> {
                              tvWarningBanner.visibility = View.GONE
                              updateStatusText("Görüşme Aktif ($data)")
                          }
                          "BT_MISSING" -> {
                              evaluateHeadsetAndConnectionWarnings()
                              updateStatusText("Görüşme Aktif (Ahize / Kulaklık Yok)")
                          }
                          "TELEMETRY" -> {
                              evaluateHeadsetAndConnectionWarnings()
                          }
                          "ENDED", "MISSED" -> cleanupAndFinish()
                      }
                  }

                  private fun switchToActiveCallUi() {
                      BridgeKeepAliveService.stopIncomingRinging()
                      val hsSummary = BluetoothMonitor.getCombinedHeadsetSummary(this)
                      updateStatusText("Görüşme Aktif ($hsSummary)")
                      btnAnswer.visibility = View.GONE
                      spaceBetween.visibility = View.GONE
                      layoutInCallControls.visibility = View.VISIBLE
                      evaluateHeadsetAndConnectionWarnings()
                      if (chronometer.visibility != View.VISIBLE) {
                          chronometer.visibility = View.VISIBLE
                          chronometer.base = SystemClock.elapsedRealtime()
                          chronometer.start()
                      }
                  }

                  private fun acquireProximitySensorLock() {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (pm.isWakeLockLevelSupported(PowerManager.PROXIMITY_SCREEN_OFF_WAKE_LOCK)) {
                          proximityWakeLock = pm.newWakeLock(
                              PowerManager.PROXIMITY_SCREEN_OFF_WAKE_LOCK,
                              "RemotePhone::ProximityWakeLock"
                          ).apply { acquire(60 * 60 * 1000L) }
                      }
                  }

                  private fun cleanupAndFinish() {
                      BridgeKeepAliveService.stopIncomingRinging()
                      chronometer.stop()
                      releaseAutoPauseMedia()
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.cancel(BridgeKeepAliveService.CALL_NOTIFICATION_ID)
                      finish()
                  }

                  override fun onDestroy() {
                      HotspotLanBridge.removeListener(this)
                      BluetoothMonitor.removeListener(this)
                      releaseAutoPauseMedia()
                      try {
                          if (proximityWakeLock?.isHeld == true) proximityWakeLock?.release()
                      } catch (_: Exception) {}
                      super.onDestroy()
                  }
              }
          """)

          write_file("app/src/main/java/com/example/remotephone/MainActivity.kt", r"""
