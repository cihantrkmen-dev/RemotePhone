              package com.example.remotephone

              import android.annotation.SuppressLint
              import android.content.Context
              import android.content.Intent
              import android.net.Uri
              import android.os.Bundle
              import android.telecom.Call
              import android.telecom.CallAudioState
              import android.telecom.InCallService
              import android.telecom.TelecomManager
              import android.telecom.VideoProfile

              class HostInCallService : InCallService(), HotspotLanBridge.Listener {

                  companion object {
                      var instance: HostInCallService? = null
                      var sipBridgeDidNumber: String = ""
                  }

                  private var isOutgoingBridgeMode = false
                  private var targetExternalCall: Call? = null
                  private var sipBridgeCall: Call? = null

                  override fun onCreate() {
                      super.onCreate()
                      instance = this
                      val prefs = getSharedPreferences("RemotePhonePrefs", Context.MODE_PRIVATE)
                      if (sipBridgeDidNumber.isEmpty()) {
                          sipBridgeDidNumber = prefs.getString("sip_number", "") ?: ""
                      }
                      HotspotLanBridge.addListener(this)
                  }

                  override fun onDestroy() {
                      HotspotLanBridge.removeListener(this)
                      instance = null
                      super.onDestroy()
                  }

                  @SuppressLint("MissingPermission")
                  override fun onEvent(event: String, data: String) {
                      when (event) {
                          "ANSWER" -> {
                              calls.firstOrNull { it.state == Call.STATE_RINGING }?.reject(false, null)
                          }
                          "REJECT" -> {
                              if (isOutgoingBridgeMode) {
                                  hangupAllCalls()
                              } else {
                                  try {
                                      val tm = getSystemService(Context.TELECOM_SERVICE) as TelecomManager
                                      tm.silenceRinger()
                                  } catch (_: Exception) {}
                              }
                          }
                          "DIAL" -> {
                              if (data.isNotEmpty() && sipBridgeDidNumber.isNotEmpty()) {
                                  startOutgoingConferenceBridge(data)
                              }
                          }
                      }
                  }

                  @SuppressLint("MissingPermission")
                  private fun startOutgoingConferenceBridge(targetNumber: String) {
                      isOutgoingBridgeMode = true
                      targetExternalCall = null
                      sipBridgeCall = null

                      val tm = getSystemService(Context.TELECOM_SERVICE) as TelecomManager
                      tm.placeCall(Uri.parse("tel:" + Uri.encode(targetNumber)), Bundle())
                  }

                  @SuppressLint("MissingPermission")
                  private fun dialSipBridgeNumber() {
                      val tm = getSystemService(Context.TELECOM_SERVICE) as TelecomManager
                      tm.placeCall(Uri.parse("tel:" + Uri.encode(sipBridgeDidNumber)), Bundle())
                  }

                  override fun onCallAdded(call: Call) {
                      super.onCallAdded(call)
                      val number = call.details?.handle?.schemeSpecificPart ?: "Bilinmeyen Numara"

                      if (isOutgoingBridgeMode) {
                          if (targetExternalCall == null) {
                              targetExternalCall = call
                          } else if (sipBridgeCall == null) {
                              sipBridgeCall = call
                          }
                      }

                      call.registerCallback(object : Call.Callback() {
                          override fun onStateChanged(call: Call, state: Int) {
                              when (state) {
                                  Call.STATE_ACTIVE -> {
                                      if (isOutgoingBridgeMode) {
                                          if (call == targetExternalCall && sipBridgeCall == null) {
                                              HotspotLanBridge.send("OUTGOING_RINGING_SIP")
                                              dialSipBridgeNumber()
                                          } else if (call == sipBridgeCall && targetExternalCall != null) {
                                              val bridge = sipBridgeCall
                                              if (bridge != null) {
                                                  targetExternalCall?.conference(bridge)
                                              }
                                              setMuted(true)
                                              HotspotLanBridge.send("OUTGOING_CONNECTED")
                                          }
                                      }
                                  }
                                  Call.STATE_DISCONNECTED -> {
                                      if (isOutgoingBridgeMode) {
                                          hangupAllCalls()
                                      } else {
                                          HotspotLanBridge.send("ENDED")
                                      }
                                  }
                              }
                          }
                      })

                      if (!isOutgoingBridgeMode && call.state == Call.STATE_RINGING) {
                          val hostContactName = ContactHelper.getContactName(this, number) ?: ""
                          val callerPayload = "$number~$hostContactName"

                          if (HotspotLanBridge.isConnected) {
                              HotspotLanBridge.send("INCOMING", callerPayload)
                          } else {
                              val intent = Intent(this, RemoteCallActivity::class.java).apply {
                                  flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                                  putExtra("CALLER_NUMBER", callerPayload)
                                  putExtra("IS_OUTGOING", false)
                                  putExtra("IS_LOCAL_FALLBACK", true)
                              }
                              startActivity(intent)
                          }
                      }
                  }

                  fun answerLocalCall() {
                      calls.firstOrNull { it.state == Call.STATE_RINGING }
                          ?.answer(VideoProfile.STATE_AUDIO_ONLY)
                  }

                  fun setLocalSpeaker(enabled: Boolean) {
                      setAudioRoute(if (enabled) CallAudioState.ROUTE_SPEAKER else CallAudioState.ROUTE_EARPIECE)
                  }

                  fun setLocalMute(muted: Boolean) {
                      setMuted(muted)
                  }

                  fun hangupAllCalls() {
                      isOutgoingBridgeMode = false
                      setMuted(false)
                      calls.forEach {
                          if (it.state == Call.STATE_RINGING) it.reject(false, null) else it.disconnect()
                      }
                      targetExternalCall = null
                      sipBridgeCall = null
                      HotspotLanBridge.send("ENDED")
                  }

                  @SuppressLint("MissingPermission")
                  fun configureForwarding(context: Context, sipNumber: String, enable: Boolean) {
                      sipBridgeDidNumber = sipNumber
                      val tm = context.getSystemService(Context.TELECOM_SERVICE) as TelecomManager
                      val ussd = if (enable) "*67*$sipNumber#" else "#67#"
                      tm.placeCall(Uri.parse("tel:" + Uri.encode(ussd)), Bundle())
                  }
              }
          """)

