          """)

          write_file("app/src/main/java/com/example/remotephone/ContactHelper.kt", r"""
              package com.example.remotephone

              import android.Manifest
              import android.content.Context
              import android.content.pm.PackageManager
              import android.net.Uri
              import android.provider.CallLog
              import android.provider.ContactsContract
              import androidx.core.content.ContextCompat
              import java.text.SimpleDateFormat
              import java.util.Date
              import java.util.Locale

              data class ContactItem(val name: String, val number: String)
              data class CallLogItem(val name: String, val number: String, val type: String, val timeText: String)

              object ContactHelper {
                  @Volatile
                  var syncedHostContacts: List<ContactItem> = emptyList()

                  @Volatile
                  var syncedHostCallLogs: List<CallLogItem> = emptyList()

                  fun getContactName(context: Context, phoneNumber: String): String? {
                      val cleanNumber = phoneNumber.trim()
                      if (cleanNumber.isEmpty()) return null
                      if (ContextCompat.checkSelfPermission(context, Manifest.permission.READ_CONTACTS)
                          == PackageManager.PERMISSION_GRANTED
                      ) {
                          try {
                              val uri = Uri.withAppendedPath(
                                  ContactsContract.PhoneLookup.CONTENT_FILTER_URI,
                                  Uri.encode(cleanNumber)
                              )
                              val projection = arrayOf(ContactsContract.PhoneLookup.DISPLAY_NAME)
                              context.contentResolver.query(uri, projection, null, null, null)?.use { cursor ->
                                  if (cursor.moveToFirst()) return cursor.getString(0)
                              }
                          } catch (_: Exception) {}
                      }
                      val normalizedTarget = cleanNumber.filter { it.isDigit() }.takeLast(10)
                      if (normalizedTarget.length >= 7) {
                          syncedHostContacts.firstOrNull {
                              it.number.filter { c -> c.isDigit() }.takeLast(10) == normalizedTarget
                          }?.let { return it.name }
                      }
                      return null
                  }

                  fun getAllContacts(context: Context): List<ContactItem> {
                      val map = linkedMapOf<String, ContactItem>()
                      if (ContextCompat.checkSelfPermission(context, Manifest.permission.READ_CONTACTS)
                          == PackageManager.PERMISSION_GRANTED
                      ) {
                          try {
                              val projection = arrayOf(
                                  ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                                  ContactsContract.CommonDataKinds.Phone.NUMBER
                              )
                              context.contentResolver.query(
                                  ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                                  projection,
                                  null,
                                  null,
                                  ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " ASC"
                              )?.use { cursor ->
                                  val nameIdx = cursor.getColumnIndex(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME)
                                  val numIdx = cursor.getColumnIndex(ContactsContract.CommonDataKinds.Phone.NUMBER)
                                  while (cursor.moveToNext()) {
                                      val name = if (nameIdx >= 0) cursor.getString(nameIdx) ?: "" else ""
                                      val rawNum = if (numIdx >= 0) cursor.getString(numIdx) ?: "" else ""
                                      val cleanNum = rawNum.replace(" ", "").replace("-", "")
                                      if (name.isNotBlank() && cleanNum.isNotBlank()) {
                                          val key = cleanNum.filter { it.isDigit() }.takeLast(10).ifEmpty { cleanNum }
                                          if (!map.containsKey(key)) {
                                              map[key] = ContactItem(name.trim(), cleanNum)
                                          }
                                      }
                                  }
                              }
                          } catch (_: Exception) {}
                      }
                      for (item in syncedHostContacts) {
                          val key = item.number.filter { it.isDigit() }.takeLast(10).ifEmpty { item.number }
                          if (!map.containsKey(key)) {
                              map[key] = item
                          }
                      }
                      return map.values.sortedBy { it.name.lowercase() }
                  }

                  fun getRecentCalls(context: Context): List<CallLogItem> {
                      val list = mutableListOf<CallLogItem>()
                      if (ContextCompat.checkSelfPermission(context, Manifest.permission.READ_CALL_LOG)
                          == PackageManager.PERMISSION_GRANTED
                      ) {
                          try {
                              val sdf = SimpleDateFormat("dd/MM HH:mm", Locale.getDefault())
                              val projection = arrayOf(
                                  CallLog.Calls.CACHED_NAME,
                                  CallLog.Calls.NUMBER,
                                  CallLog.Calls.TYPE,
                                  CallLog.Calls.DATE
                              )
                              context.contentResolver.query(
                                  CallLog.Calls.CONTENT_URI,
                                  projection,
                                  null,
                                  null,
                                  CallLog.Calls.DATE + " DESC"
                              )?.use { cursor ->
                                  val nameIdx = cursor.getColumnIndex(CallLog.Calls.CACHED_NAME)
                                  val numIdx = cursor.getColumnIndex(CallLog.Calls.NUMBER)
                                  val typeIdx = cursor.getColumnIndex(CallLog.Calls.TYPE)
                                  val dateIdx = cursor.getColumnIndex(CallLog.Calls.DATE)
                                  var count = 0
                                  while (cursor.moveToNext() && count < 40) {
                                      val number = if (numIdx >= 0) cursor.getString(numIdx) ?: "" else ""
                                      if (number.isBlank()) continue
                                      val resolvedName = if (nameIdx >= 0) cursor.getString(nameIdx) else null
                                      val name = if (!resolvedName.isNullOrBlank()) resolvedName else (getContactName(context, number) ?: number)
                                      val typeInt = if (typeIdx >= 0) cursor.getInt(typeIdx) else CallLog.Calls.MISSED_TYPE
                                      val type = when (typeInt) {
                                          CallLog.Calls.INCOMING_TYPE -> "↙ Gelen"
                                          CallLog.Calls.OUTGOING_TYPE -> "↗ Giden"
                                          CallLog.Calls.MISSED_TYPE -> "✖ Cevapsız"
                                          CallLog.Calls.REJECTED_TYPE -> "✖ Reddedilen"
                                          else -> "• Arama"
                                      }
                                      val dateMs = if (dateIdx >= 0) cursor.getLong(dateIdx) else System.currentTimeMillis()
                                      list.add(CallLogItem(name, number, type, sdf.format(Date(dateMs))))
                                      count++
                                  }
                              }
                          } catch (_: Exception) {}
                      }
                      if (list.isEmpty() && syncedHostCallLogs.isNotEmpty()) {
                          return syncedHostCallLogs
                      }
                      return list
                  }

                  fun serializeContacts(context: Context): String {
                      return getAllContacts(context).take(500).joinToString(";") { item ->
                          val safeName = item.name.replace(";", " ").replace("~", " ").replace("|", " ")
                          val safeNum = item.number.replace(";", "").replace("~", "").replace("|", "")
                          "$safeName~$safeNum"
                      }
                  }

                  fun updateSyncedContacts(serialized: String) {
                      if (serialized.isBlank()) return
                      val list = mutableListOf<ContactItem>()
                      for (entry in serialized.split(";")) {
                          val parts = entry.split("~", limit = 2)
                          if (parts.size == 2 && parts[0].isNotBlank() && parts[1].isNotBlank()) {
                              list.add(ContactItem(parts[0], parts[1]))
                          }
                      }
                      if (list.isNotEmpty()) {
                          syncedHostContacts = list
                      }
                  }

                  fun serializeCallLogs(context: Context): String {
                      return getRecentCalls(context).take(35).joinToString(";") { item ->
                          val safeName = item.name.replace(";", " ").replace("~", " ").replace("|", " ")
                          val safeNum = item.number.replace(";", "").replace("~", "").replace("|", "")
                          val safeType = item.type.replace(";", "").replace("~", "").replace("|", "")
                          val safeTime = item.timeText.replace(";", "").replace("~", "").replace("|", "")
                          "$safeName~$safeNum~$safeType~$safeTime"
                      }
                  }

                  fun updateSyncedCallLogs(serialized: String) {
                      if (serialized.isBlank()) return
                      val list = mutableListOf<CallLogItem>()
                      for (entry in serialized.split(";")) {
                          val parts = entry.split("~", limit = 4)
                          if (parts.size == 4) {
                              list.add(CallLogItem(parts[0], parts[1], parts[2], parts[3]))
                          }
                      }
                      if (list.isNotEmpty()) {
                          syncedHostCallLogs = list
                      }
                  }

                  fun resolveCallerInfo(context: Context, payload: String): Pair<String, String?> {
                      val parts = payload.split("~", limit = 2)
                      val rawNumber = parts[0].ifBlank { "Bilinmeyen Numara" }
                      val hostName = parts.getOrNull(1)?.takeIf { it.isNotBlank() }
                      val localName = getContactName(context, rawNumber)
                      return Pair(rawNumber, localName ?: hostName)
                  }
              }
          """)

          # HotspotLanBridge.kt: Hem Hotspot Gateway hem de Ortak Wi-Fi Ağı İçin UDP Otomatik IP Keşfi (Port 8990) + TCP Köprüsü (Port 8989)
          write_file("app/src/main/java/com/example/remotephone/HotspotLanBridge.kt", r"""
              package com.example.remotephone

              import android.content.Context
              import android.net.ConnectivityManager
              import android.net.LinkProperties
              import kotlinx.coroutines.*
              import java.io.BufferedReader
              import java.io.InputStreamReader
              import java.io.PrintWriter
              import java.net.DatagramPacket
              import java.net.DatagramSocket
              import java.net.Inet4Address
              import java.net.InetAddress
              import java.net.InetSocketAddress
              import java.net.NetworkInterface
              import java.net.ServerSocket
              import java.net.Socket
              import java.util.concurrent.CopyOnWriteArraySet

              object HotspotLanBridge {
                  private const val TCP_PORT = 8989
                  private const val UDP_DISCOVERY_PORT = 8990
                  private const val SOCKET_TIMEOUT_MS = 18_000
                  private const val HEARTBEAT_INTERVAL_MS = 8_000L

                  interface Listener {
                      fun onEvent(event: String, data: String) {}
                      fun onConnectionChanged(connected: Boolean) {}
                  }

                  private val listeners = CopyOnWriteArraySet<Listener>()
                  private val scope = CoroutineScope(Dispatchers.IO + SupervisorJob())
                  private val mainScope = CoroutineScope(Dispatchers.Main + SupervisorJob())
                  private var serverSocket: ServerSocket? = null
                  private var udpSocket: DatagramSocket? = null
                  private var currentSocket: Socket? = null
                  private var writer: PrintWriter? = null
                  private var activeJob: Job? = null
                  private var discoveryJob: Job? = null

                  @Volatile
                  var isConnected: Boolean = false
                      private set

                  @Volatile
                  private var discoveredHostIp: String? = null

                  fun addListener(listener: Listener) {
                      listeners.add(listener)
                      listener.onConnectionChanged(isConnected)
                  }

                  fun removeListener(listener: Listener) {
                      listeners.remove(listener)
                  }

                  fun startHostServer() {
                      stop()
                      // 1. Ortak Wi-Fi ağında S25 Ultra'nın Note 10 Lite IP'sini anında bulması için UDP Keşif Yanıtlayıcısı
                      discoveryJob = scope.launch {
                          while (isActive) {
                              try {
                                  val dSocket = DatagramSocket(UDP_DISCOVERY_PORT).apply {
                                      broadcast = true
                                      reuseAddress = true
                                  }
                                  udpSocket = dSocket
                                  val buf = ByteArray(256)
                                  while (isActive && !dSocket.isClosed) {
                                      val pkt = DatagramPacket(buf, buf.size)
                                      dSocket.receive(pkt)
                                      val msg = String(pkt.data, 0, pkt.length).trim()
                                      if (msg == "DISCOVER_REMOTEPHONE_HOST") {
                                          val reply = "REMOTEPHONE_HOST_HERE".toByteArray()
                                          dSocket.send(DatagramPacket(reply, reply.size, pkt.address, pkt.port))
                                      }
                                  }
                              } catch (_: Exception) {
                                  delay(2000)
                              } finally {
                                  try { udpSocket?.close() } catch (_: Exception) {}
                              }
                          }
                      }

                      // 2. Ana TCP Kontrol Sunucusu
                      activeJob = scope.launch {
                          while (isActive) {
                              try {
                                  serverSocket = ServerSocket(TCP_PORT).apply { reuseAddress = true }
                                  while (isActive) {
                                      val client = serverSocket!!.accept()
                                      handleSocket(client)
                                  }
                              } catch (_: Exception) {
                                  delay(1500)
                              } finally {
                                  try { serverSocket?.close() } catch (_: Exception) {}
                              }
                          }
                      }
                  }

                  fun startClientAutoConnect(context: Context) {
                      stop()
                      val appCtx = context.applicationContext
                      activeJob = scope.launch {
                          var backoffDelay = 2000L
                          while (isActive) {
                              if (!isConnected) {
                                  val connectedSocket = tryConnectToHost(appCtx)
                                  if (connectedSocket != null) {
                                      backoffDelay = 2000L
                                      handleSocket(connectedSocket)
                                  } else {
                                      notifyConnection(false)
                                  }
                              }
                              delay(backoffDelay)
                              if (backoffDelay < 8_000L) backoffDelay += 1000L
                          }
                      }
                  }

                  // S25 Ultra ekranı açıldığında veya ağ değiştiğinde bağlantıyı milisaniyeler içinde tazeleyen tetikleyici
                  fun triggerScreenWakeRefresh(context: Context) {
                      val appCtx = context.applicationContext
                      scope.launch {
                          if (!isConnected) {
                              val connectedSocket = tryConnectToHost(appCtx)
                              if (connectedSocket != null) {
                                  handleSocket(connectedSocket)
                              }
                          } else {
                              try {
                                  writer?.println("PING|WAKE")
                                  if (writer?.checkError() == true) {
                                      currentSocket?.close()
                                  }
                              } catch (_: Exception) {
                                  try { currentSocket?.close() } catch (_: Exception) {}
                              }
                          }
                      }
                  }

                  // Hem Hotspot Gateway IP'sini hem de Ortak Wi-Fi Ağındaki Note 10 Lite IP'sini bularak bağlanır
                  private fun tryConnectToHost(context: Context): Socket? {
                      val candidates = linkedSetOf<String>()
                      discoveredHostIp?.let { candidates.add(it) }
                      getActiveGatewayIp(context)?.let { candidates.add(it) }
                      candidates.add("192.168.43.1")

                      // Ortak Wi-Fi ağı için hızlı UDP Broadcast taraması (Note 10 Lite'ın yerel IP'sini bulur)
                      discoverHostViaUdpBroadcast()?.let { foundIp ->
                          discoveredHostIp = foundIp
                          candidates.add(foundIp)
                      }

                      for (ip in candidates) {
                          try {
                              val s = Socket()
                              s.connect(InetSocketAddress(ip, TCP_PORT), 1800)
                              discoveredHostIp = ip
                              return s
                          } catch (_: Exception) {}
                      }
                      return null
                  }

                  private fun discoverHostViaUdpBroadcast(): String? {
                      var tempSocket: DatagramSocket? = null
                      try {
                          tempSocket = DatagramSocket().apply {
                              broadcast = true
                              soTimeout = 700
                          }
                          val req = "DISCOVER_REMOTEPHONE_HOST".toByteArray()
                          val broadcastTargets = mutableSetOf("255.255.255.255")

                          val interfaces = NetworkInterface.getNetworkInterfaces()
                          while (interfaces.hasMoreElements()) {
                              val intf = interfaces.nextElement()
                              if (!intf.isUp || intf.isLoopback) continue
                              for (ia in intf.interfaceAddresses) {
                                  val bcast = ia.broadcast
                                  if (bcast is Inet4Address) {
                                      bcast.hostAddress?.let { broadcastTargets.add(it) }
                                  }
                              }
                          }

                          for (target in broadcastTargets) {
                              try {
                                  tempSocket.send(
                                      DatagramPacket(req, req.size, InetAddress.getByName(target), UDP_DISCOVERY_PORT)
                                  )
                              } catch (_: Exception) {}
                          }

                          val buf = ByteArray(256)
                          val respPkt = DatagramPacket(buf, buf.size)
                          tempSocket.receive(respPkt)
                          val reply = String(respPkt.data, 0, respPkt.length).trim()
                          if (reply == "REMOTEPHONE_HOST_HERE") {
                              return respPkt.address?.hostAddress
                          }
                      } catch (_: Exception) {
                      } finally {
                          try { tempSocket?.close() } catch (_: Exception) {}
                      }
                      return null
                  }

                  fun stop() {
                      activeJob?.cancel()
                      discoveryJob?.cancel()
                      try { udpSocket?.close() } catch (_: Exception) {}
                      try { currentSocket?.close() } catch (_: Exception) {}
                      try { serverSocket?.close() } catch (_: Exception) {}
                      notifyConnection(false)
                  }

                  private suspend fun handleSocket(socket: Socket) {
                      try { currentSocket?.close() } catch (_: Exception) {}
                      currentSocket = socket
                      socket.keepAlive = true
                      socket.tcpNoDelay = true
                      socket.soTimeout = SOCKET_TIMEOUT_MS

                      writer = PrintWriter(socket.getOutputStream(), true)
                      val reader = BufferedReader(InputStreamReader(socket.inputStream))
                      notifyConnection(true)

                      val heartbeatJob = scope.launch {
                          while (isActive && !socket.isClosed) {
                              try {
                                  writer?.println("PING|")
                                  if (writer?.checkError() == true) {
                                      socket.close()
                                      break
                                  }
                              } catch (_: Exception) {
                                  socket.close()
                                  break
                              }
                              delay(HEARTBEAT_INTERVAL_MS)
                          }
                      }

                      try {
                          while (!socket.isClosed) {
                              val line = reader.readLine() ?: break
                              val parts = line.split("|", limit = 2)
                              val event = parts[0]
                              val data = parts.getOrElse(1) { "" }

                              when (event) {
                                  "PING" -> writer?.println("PONG|$data")
                                  "PONG" -> {}
                                  else -> notifyEvent(event, data)
                              }
                          }
                      } catch (_: Exception) {
                      } finally {
                          heartbeatJob.cancel()
                          writer = null
                          try { socket.close() } catch (_: Exception) {}
                          notifyConnection(false)
                      }
                  }

                  fun send(event: String, data: String = "") {
                      scope.launch {
                          try {
                              writer?.println("$event|$data")
                          } catch (_: Exception) {}
                      }
                  }

                  private fun notifyEvent(event: String, data: String) {
                      mainScope.launch {
                          for (listener in listeners) listener.onEvent(event, data)
                      }
                  }

                  private fun notifyConnection(connected: Boolean) {
                      isConnected = connected
                      mainScope.launch {
                          for (listener in listeners) listener.onConnectionChanged(connected)
                      }
                  }

                  private fun getActiveGatewayIp(context: Context): String? {
                      val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      val network = cm.activeNetwork ?: return "192.168.43.1"
                      val linkProps: LinkProperties = cm.getLinkProperties(network) ?: return "192.168.43.1"
                      for (route in linkProps.routes) {
                          if (route.isDefaultRoute && route.gateway != null) {
                              val ip = route.gateway?.hostAddress
                              if (!ip.isNullOrEmpty() && ip != "0.0.0.0") return ip
                          }
                      }
                      return "192.168.43.1"
                  }
              }
          """)

