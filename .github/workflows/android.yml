name: Auto-Generate and Build RemotePhone APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generate Project & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Full Android Project Structure via Python
        shell: python3 {0}
        run: |
          import os, textwrap

          def write_file(path, content):
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(content).lstrip())

          write_file("settings.gradle.kts", r"""
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              rootProject.name = "RemotePhone"
              include(":app")
          """)

          write_file("build.gradle.kts", r"""
              plugins {
                  id("com.android.application") version "8.5.2" apply false
                  id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              }
          """)

          write_file("gradle.properties", r"""
              org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
              android.useAndroidX=true
              kotlin.code.style=official
              android.nonTransitiveRClass=true
          """)

          write_file("app/build.gradle.kts", r"""
              plugins {
                  id("com.android.application")
                  id("org.jetbrains.kotlin.android")
              }

              android {
                  namespace = "com.example.remotephone"
                  compileSdk = 34

                  defaultConfig {
                      applicationId = "com.example.remotephone"
                      minSdk = 26
                      targetSdk = 34
                      versionCode = 12
                      versionName = "2.6.1"
                  }

                  buildTypes {
                      release {
                          isMinifyEnabled = false
                      }
                  }

                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }
                  kotlinOptions {
                      jvmTarget = "17"
                  }
              }

              dependencies {
                  implementation("androidx.core:core-ktx:1.13.1")
                  implementation("androidx.appcompat:appcompat:1.7.0")
                  implementation("com.google.android.material:material:1.12.0")
                  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              }
          """)

          write_file("app/src/main/AndroidManifest.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">

                  <uses-permission android:name="android.permission.READ_PHONE_STATE" />
                  <uses-permission android:name="android.permission.CALL_PHONE" />
                  <uses-permission android:name="android.permission.ANSWER_PHONE_CALLS" />
                  <uses-permission android:name="android.permission.MANAGE_OWN_CALLS" />
                  <uses-permission android:name="android.permission.READ_CONTACTS" />
                  <uses-permission android:name="android.permission.RECORD_AUDIO" />
                  <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                  <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />

                  <uses-permission android:name="android.permission.WAKE_LOCK" />
                  <uses-permission android:name="android.permission.VIBRATE" />
                  <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
                  <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
                  <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

                  <application
                      android:allowBackup="true"
                      android:label="Telefon"
                      android:supportsRtl="true"
                      android:theme="@style/Theme.Material3.Dark.NoActionBar">

                      <activity
                          android:name=".MainActivity"
                          android:exported="true"
                          android:windowSoftInputMode="stateAlwaysHidden">
                          <intent-filter>
                              <action android:name="android.intent.action.MAIN" />
                              <category android:name="android.intent.category.LAUNCHER" />
                          </intent-filter>
                          <intent-filter>
                              <action android:name="android.intent.action.DIAL" />
                              <category android:name="android.intent.category.DEFAULT" />
                          </intent-filter>
                          <intent-filter>
                              <action android:name="android.intent.action.DIAL" />
                              <category android:name="android.intent.category.DEFAULT" />
