name: Auto-Generate and Build RemotePhone APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generate Project & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Full Android Project Structure via Python
        shell: python3 {0}
        run: |
          import os, textwrap

          def write_file(path, content):
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(content).lstrip())

          write_file("settings.gradle.kts", r"""
              pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
              rootProject.name = "RemotePhone"
              include(":app")
          """)

          write_file("build.gradle.kts", r"""
              plugins {
                  id("com.android.application") version "8.5.2" apply false
                  id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              }
          """)

          write_file("gradle.properties", r"""
              org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
              android.useAndroidX=true
              kotlin.code.style=official
              android.nonTransitiveRClass=true
          """)

          write_file("app/build.gradle.kts", r"""
              plugins {
                  id("com.android.application")
                  id("org.jetbrains.kotlin.android")
              }

              android {
                  namespace = "com.example.remotephone"
                  compileSdk = 34

                  defaultConfig {
                      applicationId = "com.example.remotephone"
                      minSdk = 26
                      targetSdk = 34
                      versionCode = 20
                      versionName = "4.1.0"
                  }

                  buildTypes {
                      release {
                          isMinifyEnabled = false
                      }
                  }

                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }
                  kotlinOptions {
                      jvmTarget = "17"
                  }
              }

              dependencies {
                  implementation("androidx.core:core-ktx:1.13.1")
                  implementation("androidx.appcompat:appcompat:1.7.0")
                  implementation("com.google.android.material:material:1.12.0")
                  implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              }
          """)

          write_file("app/src/main/res/drawable/ic_launcher.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <vector xmlns:android="http://schemas.android.com/apk/res/android"
                  android:width="108dp"
                  android:height="108dp"
                  android:viewportWidth="108"
                  android:viewportHeight="108">
                  <path
                      android:fillColor="#1A73E8"
                      android:pathData="M54,54m-50,0a50,50 0,1 1,100 0a50,50 0,1 1,-100 0" />
                  <path
                      android:fillColor="#FFFFFF"
                      android:pathData="M73.5,62.8c-3.8,0 -7.5,-0.6 -10.9,-1.7c-1.1,-0.4 -2.4,-0.1 -3.2,0.7l-6.8,6.8c-8.7,-4.4 -15.8,-11.5 -20.2,-20.2l6.8,-6.8c0.9,-0.8 1.1,-2.1 0.7,-3.2c-1.1,-3.4 -1.7,-7.1 -1.7,-10.9c0,-1.7 -1.4,-3.1 -3.1,-3.1H24.5c-1.7,0 -3.1,1.4 -3.1,3.1c0,28.8 23.3,52.1 52.1,52.1c1.7,0 3.1,-1.4 3.1,-3.1V65.9C76.6,64.2 75.2,62.8 73.5,62.8z" />
              </vector>
          """)

          write_file("app/src/main/AndroidManifest.xml", r"""
              <?xml version="1.0" encoding="utf-8"?>
              <manifest xmlns:android="http://schemas.android.com/apk/res/android">

                  <uses-permission android:name="android.permission.READ_PHONE_STATE" />
                  <uses-permission android:name="android.permission.READ_PHONE_NUMBERS" />
                  <uses-permission android:name="android.permission.CALL_PHONE" />
                  <uses-permission android:name="android.permission.ANSWER_PHONE_CALLS" />
                  <uses-permission android:name="android.permission.MANAGE_OWN_CALLS" />
                  <uses-permission android:name="android.permission.READ_CONTACTS" />
                  <uses-permission android:name="android.permission.RECORD_AUDIO" />
