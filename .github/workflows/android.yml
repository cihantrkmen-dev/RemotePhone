          """)

          write_file("app/src/main/java/com/example/remotephone/ContactHelper.kt", r"""
              package com.example.remotephone

              import android.Manifest
              import android.content.Context
              import android.content.pm.PackageManager
              import android.net.Uri
              import android.provider.CallLog
              import android.provider.ContactsContract
              import androidx.core.content.ContextCompat

              data class ContactItem(val name: String, val number: String)
              data class CallLogItem(val name: String, val number: String, val type: String, val date: Long)

              object ContactHelper {
                  @Volatile
                  var syncedHostContacts: List<ContactItem> = emptyList()

                  fun getContactName(context: Context, phoneNumber: String): String? {
                      val cleanNumber = phoneNumber.trim()
                      if (cleanNumber.isEmpty()) return null
                      if (ContextCompat.checkSelfPermission(context, Manifest.permission.READ_CONTACTS)
                          == PackageManager.PERMISSION_GRANTED
                      ) {
                          try {
                              val uri = Uri.withAppendedPath(
                                  ContactsContract.PhoneLookup.CONTENT_FILTER_URI,
                                  Uri.encode(cleanNumber)
                              )
                              val projection = arrayOf(ContactsContract.PhoneLookup.DISPLAY_NAME)
                              context.contentResolver.query(uri, projection, null, null, null)?.use { cursor ->
                                  if (cursor.moveToFirst()) return cursor.getString(0)
                              }
                          } catch (_: Exception) {}
                      }
                      val normalizedTarget = cleanNumber.filter { it.isDigit() }.takeLast(10)
                      if (normalizedTarget.length >= 7) {
                          syncedHostContacts.firstOrNull {
                              it.number.filter { c -> c.isDigit() }.takeLast(10) == normalizedTarget
                          }?.let { return it.name }
                      }
                      return null
                  }

                  fun getAllContacts(context: Context): List<ContactItem> {
                      val map = linkedMapOf<String, ContactItem>()
                      if (ContextCompat.checkSelfPermission(context, Manifest.permission.READ_CONTACTS)
                          == PackageManager.PERMISSION_GRANTED
                      ) {
                          try {
                              val projection = arrayOf(
                                  ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                                  ContactsContract.CommonDataKinds.Phone.NUMBER
                              )
                              context.contentResolver.query(
                                  ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                                  projection,
                                  null,
                                  null,
                                  ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " ASC"
                              )?.use { cursor ->
                                  val nameIdx = cursor.getColumnIndex(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME)
                                  val numIdx = cursor.getColumnIndex(ContactsContract.CommonDataKinds.Phone.NUMBER)
                                  while (cursor.moveToNext()) {
                                      val name = if (nameIdx >= 0) cursor.getString(nameIdx) ?: "" else ""
                                      val rawNum = if (numIdx >= 0) cursor.getString(numIdx) ?: "" else ""
                                      val cleanNum = rawNum.replace(" ", "").replace("-", "")
                                      if (name.isNotBlank() && cleanNum.isNotBlank()) {
                                          val key = cleanNum.filter { it.isDigit() }.takeLast(10).ifEmpty { cleanNum }
                                          if (!map.containsKey(key)) {
                                              map[key] = ContactItem(name.trim(), cleanNum)
                                          }
                                      }
                                  }
                              }
                          } catch (_: Exception) {}
                      }
                      for (item in syncedHostContacts) {
                          val key = item.number.filter { it.isDigit() }.takeLast(10).ifEmpty { item.number }
                          if (!map.containsKey(key)) {
                              map[key] = item
                          }
                      }
                      return map.values.sortedBy { it.name.lowercase() }
                  }

                  fun getRecentCalls(context: Context): List<CallLogItem> {
                      val list = mutableListOf<CallLogItem>()
                      if (ContextCompat.checkSelfPermission(context, Manifest.permission.READ_CALL_LOG)
                          == PackageManager.PERMISSION_GRANTED ||
                          ContextCompat.checkSelfPermission(context, Manifest.permission.READ_CONTACTS)
                          == PackageManager.PERMISSION_GRANTED
                      ) {
                          try {
                              val projection = arrayOf(
                                  CallLog.Calls.CACHED_NAME,
                                  CallLog.Calls.NUMBER,
                                  CallLog.Calls.TYPE,
                                  CallLog.Calls.DATE
                              )
                              context.contentResolver.query(
                                  CallLog.Calls.CONTENT_URI,
                                  projection,
                                  null,
                                  null,
                                  CallLog.Calls.DATE + " DESC LIMIT 50"
                              )?.use { cursor ->
                                  val nameIdx = cursor.getColumnIndex(CallLog.Calls.CACHED_NAME)
                                  val numIdx = cursor.getColumnIndex(CallLog.Calls.NUMBER)
                                  val typeIdx = cursor.getColumnIndex(CallLog.Calls.TYPE)
                                  val dateIdx = cursor.getColumnIndex(CallLog.Calls.DATE)
                                  while (cursor.moveToNext()) {
                                      val number = if (numIdx >= 0) cursor.getString(numIdx) ?: "" else ""
                                      if (number.isBlank()) continue
                                      val resolvedName = if (nameIdx >= 0) cursor.getString(nameIdx) else null
                                      val name = resolvedName ?: getContactName(context, number) ?: number
                                      val typeInt = if (typeIdx >= 0) cursor.getInt(typeIdx) else CallLog.Calls.MISSED_TYPE
                                      val type = when (typeInt) {
                                          CallLog.Calls.INCOMING_TYPE -> "Gelen"
                                          CallLog.Calls.OUTGOING_TYPE -> "Giden"
                                          CallLog.Calls.MISSED_TYPE -> "Cevapsız"
                                          else -> "Diğer"
                                      }
                                      val date = if (dateIdx >= 0) cursor.getLong(dateIdx) else System.currentTimeMillis()
                                      list.add(CallLogItem(name, number, type, date))
                                  }
                              }
                          } catch (_: Exception) {}
                      }
                      return list
                  }

                  fun serializeContacts(context: Context): String {
                      return getAllContacts(context).take(500).joinToString(";") { item ->
                          val safeName = item.name.replace(";", " ").replace("~", " ").replace("|", " ")
                          val safeNum = item.number.replace(";", "").replace("~", "").replace("|", "")
                          "$safeName~$safeNum"
                      }
                  }

                  fun updateSyncedContacts(serialized: String) {
                      if (serialized.isBlank()) return
                      val list = mutableListOf<ContactItem>()
                      for (entry in serialized.split(";")) {
                          val parts = entry.split("~", limit = 2)
                          if (parts.size == 2 && parts[0].isNotBlank() && parts[1].isNotBlank()) {
                              list.add(ContactItem(parts[0], parts[1]))
                          }
                      }
                      if (list.isNotEmpty()) {
                          syncedHostContacts = list
                      }
                  }

                  fun resolveCallerInfo(context: Context, payload: String): Pair<String, String?> {
                      val parts = payload.split("~", limit = 2)
                      val rawNumber = parts[0].ifBlank { "Bilinmeyen Numara" }
                      val hostName = parts.getOrNull(1)?.takeIf { it.isNotBlank() }
                      val localName = getContactName(context, rawNumber)
                      return Pair(rawNumber, localName ?: hostName)
                  }
              }
          """)

          # HotspotLanBridge.kt: Ortak Wi-Fi / Hotspot Ağ Geçidini Otomatik Bulan Dinamik Bağlantı Yöneticisi
          write_file("app/src/main/java/com/example/remotephone/HotspotLanBridge.kt", r"""
              package com.example.remotephone

              import android.content.Context
              import android.net.ConnectivityManager
              import android.net.LinkProperties
              import kotlinx.coroutines.*
              import java.io.BufferedReader
              import java.io.InputStreamReader
              import java.io.PrintWriter
              import java.net.InetSocketAddress
              import java.net.ServerSocket
              import java.net.Socket
              import java.util.concurrent.CopyOnWriteArraySet

              object HotspotLanBridge {
                  private const val PORT = 8989
                  private const val SOCKET_TIMEOUT_MS = 15_000
                  private const val HEARTBEAT_INTERVAL_MS = 8_000L

                  interface Listener {
                      fun onEvent(event: String, data: String) {}
                      fun onConnectionChanged(connected: Boolean) {}
                  }

                  private val listeners = CopyOnWriteArraySet<Listener>()
                  private val scope = CoroutineScope(Dispatchers.IO + SupervisorJob())
                  private val mainScope = CoroutineScope(Dispatchers.Main + SupervisorJob())
                  private var serverSocket: ServerSocket? = null
                  private var currentSocket: Socket? = null
                  private var writer: PrintWriter? = null
                  private var activeJob: Job? = null

                  @Volatile
                  var isConnected: Boolean = false
                      private set

                  fun addListener(listener: Listener) {
                      listeners.add(listener)
                      listener.onConnectionChanged(isConnected)
                  }

                  fun removeListener(listener: Listener) {
                      listeners.remove(listener)
                  }

                  fun startHostServer() {
                      stop()
                      activeJob = scope.launch {
                          while (isActive) {
                              try {
                                  serverSocket = ServerSocket(PORT).apply { reuseAddress = true }
                                  while (isActive) {
                                      val client = serverSocket!!.accept()
                                      handleSocket(client)
                                  }
                              } catch (_: Exception) {
                                  delay(1500)
                              } finally {
                                  try { serverSocket?.close() } catch (_: Exception) {}
                              }
                          }
                      }
                  }

                  fun startClientAutoConnect(context: Context) {
                      stop()
                      val appCtx = context.applicationContext
                      activeJob = scope.launch {
                          var backoffDelay = 2000L
                          while (isActive) {
                              try {
                                  val hostIp = getActiveGatewayOrHostIp(appCtx)
                                  if (!hostIp.isNullOrEmpty()) {
                                      val socket = Socket()
                                      socket.connect(InetSocketAddress(hostIp, PORT), 3000)
                                      backoffDelay = 2000L
                                      handleSocket(socket)
                                  }
                              } catch (_: Exception) {
                                  notifyConnection(false)
                              }
                              delay(backoffDelay)
                              if (backoffDelay < 10_000L) backoffDelay += 1000L
                          }
                      }
                  }

                  fun triggerScreenWakeRefresh(context: Context) {
                      if (!isConnected) {
                          scope.launch {
                              try {
                                  val hostIp = getActiveGatewayOrHostIp(context)
                                  if (!hostIp.isNullOrEmpty()) {
                                      val socket = Socket()
                                      socket.connect(InetSocketAddress(hostIp, PORT), 2000)
                                      handleSocket(socket)
                                  }
                              } catch (_: Exception) {}
                          }
                      } else {
                          send("PING", "WAKE")
                      }
                  }

                  fun stop() {
                      activeJob?.cancel()
                      try { currentSocket?.close() } catch (_: Exception) {}
                      try { serverSocket?.close() } catch (_: Exception) {}
                      notifyConnection(false)
                  }

                  private suspend fun handleSocket(socket: Socket) {
                      try { currentSocket?.close() } catch (_: Exception) {}
                      currentSocket = socket
                      socket.keepAlive = true
                      socket.tcpNoDelay = true
                      socket.soTimeout = SOCKET_TIMEOUT_MS

                      writer = PrintWriter(socket.getOutputStream(), true)
                      val reader = BufferedReader(InputStreamReader(socket.inputStream))
                      notifyConnection(true)

                      val heartbeatJob = scope.launch {
                          while (isActive && !socket.isClosed) {
                              try {
                                  writer?.println("PING|")
                                  if (writer?.checkError() == true) {
                                      socket.close()
                                      break
                                  }
                              } catch (_: Exception) {
                                  socket.close()
                                  break
                              }
                              delay(HEARTBEAT_INTERVAL_MS)
                          }
                      }

                      try {
                          while (!socket.isClosed) {
                              val line = reader.readLine() ?: break
                              val parts = line.split("|", limit = 2)
                              val event = parts[0]
                              val data = parts.getOrElse(1) { "" }

                              when (event) {
                                  "PING" -> writer?.println("PONG|$data")
                                  "PONG" -> {}
                                  else -> notifyEvent(event, data)
                              }
                          }
                      } catch (_: Exception) {
                      } finally {
                          heartbeatJob.cancel()
                          writer = null
                          try { socket.close() } catch (_: Exception) {}
                          notifyConnection(false)
                      }
                  }

                  fun send(event: String, data: String = "") {
                      scope.launch {
                          try {
                              writer?.println("$event|$data")
                          } catch (_: Exception) {}
                      }
                  }

                  private fun notifyEvent(event: String, data: String) {
                      mainScope.launch {
                          for (listener in listeners) listener.onEvent(event, data)
                      }
                  }

                  private fun notifyConnection(connected: Boolean) {
                      isConnected = connected
                      mainScope.launch {
                          for (listener in listeners) listener.onConnectionChanged(connected)
                      }
                  }

                  // Hem Hotspot ağ geçidini hem de ortak Wi-Fi router IP'sini dinamik olarak tespit eder
                  private fun getActiveGatewayOrHostIp(context: Context): String? {
                      val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      val network = cm.activeNetwork ?: return "192.168.43.1"
                      val linkProps: LinkProperties = cm.getLinkProperties(network) ?: return "192.168.43.1"
                      for (route in linkProps.routes) {
                          if (route.isDefaultRoute && route.gateway != null) {
                              val ip = route.gateway?.hostAddress
                              if (!ip.isNullOrEmpty() && ip != "0.0.0.0") return ip
                          }
                      }
                      return "192.168.43.1"
                  }
              }
          """)

          # HostInCallService.kt: Note 10 Lite Ana Hat Servisi + Bluetooth Kulaklık Yönlendirme + Telemetri
          write_file("app/src/main/java/com/example/remotephone/HostInCallService.kt", r"""
              package com.example.remotephone

              import android.annotation.SuppressLint
              import android.bluetooth.BluetoothAdapter
              import android.content.Context
              import android.content.Intent
              import android.media.AudioManager
              import android.net.Uri
              import android.os.BatteryManager
              import android.os.Bundle
              import android.os.Handler
              import android.os.Looper
              import android.telecom.Call
              import android.telecom.CallAudioState
              import android.telecom.InCallService
              import android.telecom.TelecomManager
              import android.telecom.VideoProfile

              class HostInCallService : InCallService(), HotspotLanBridge.Listener {

                  companion object {
                      var instance: HostInCallService? = null

                      @SuppressLint("MissingPermission")
                      fun placeSystemCall(context: Context, rawNumber: String) {
                          val clean = rawNumber.trim()
                          if (clean.isEmpty()) return
                          val uri = Uri.parse("tel:" + Uri.encode(clean))
                          try {
                              val tm = context.getSystemService(Context.TELECOM_SERVICE) as TelecomManager
                              tm.placeCall(uri, Bundle())
                          } catch (_: Exception) {
                              try {
                                  val callIntent = Intent(Intent.ACTION_CALL, uri).apply {
                                      flags = Intent.FLAG_ACTIVITY_NEW_TASK
                                  }
                                  context.startActivity(callIntent)
                              } catch (_: Exception) {}
                          }
                      }
                  }

                  private val handler = Handler(Looper.getMainLooper())
                  private var activeCall: Call? = null

                  override fun onCreate() {
                      super.onCreate()
                      instance = this
                      HotspotLanBridge.addListener(this)

                      handler.post(object : Runnable {
                          override fun run() {
                              if (HotspotLanBridge.isConnected) {
                                  val batteryManager = getSystemService(Context.BATTERY_SERVICE) as? BatteryManager
                                  val batteryPct = batteryManager?.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY) ?: 100
                                  val btStatus = if (BluetoothAdapter.getDefaultAdapter()?.isEnabled == true) "BT: Açık" else "BT: Kapalı"
                                  HotspotLanBridge.send("TELEMETRY", "Pil: %$batteryPct | $btStatus")
                              }
                              handler.postDelayed(this, 15_000L)
                          }
                      })
                  }

                  override fun onDestroy() {
                      HotspotLanBridge.removeListener(this)
                      handler.removeCallbacksAndMessages(null)
                      instance = null
                      super.onDestroy()
                  }

                  @SuppressLint("MissingPermission")
                  private fun routeAudioToBluetooth() {
                      try {
                          val am = getSystemService(Context.AUDIO_SERVICE) as? AudioManager
                          am?.mode = AudioManager.MODE_IN_COMMUNICATION
                          am?.isBluetoothScoOn = true
                          am?.startBluetoothSco()
                          setAudioRoute(CallAudioState.ROUTE_BLUETOOTH)
                      } catch (_: Exception) {
                          try {
                              setAudioRoute(CallAudioState.ROUTE_EARPIECE)
                          } catch (_: Exception) {}
                      }
                  }

                  @SuppressLint("MissingPermission")
                  override fun onEvent(event: String, data: String) {
                      when (event) {
                          "ANSWER" -> {
                              val ringing = calls.firstOrNull { it.state == Call.STATE_RINGING } ?: activeCall
                              ringing?.answer(VideoProfile.STATE_AUDIO_ONLY)
                              routeAudioToBluetooth()
                          }
                          "REJECT", "HANGUP" -> {
                              calls.forEach {
                                  try {
                                      if (it.state == Call.STATE_RINGING) it.reject(false, null) else it.disconnect()
                                  } catch (_: Exception) {}
                              }
                              HotspotLanBridge.send("ENDED")
                          }
                          "DIAL" -> {
                              if (data.isNotEmpty()) {
                                  placeSystemCall(this, data)
                              }
                          }
                          "DTMF" -> {
                              if (data.isNotEmpty()) {
                                  activeCall?.playDtmfTone(data[0])
                                  handler.postDelayed({
                                      try { activeCall?.stopDtmfTone() } catch (_: Exception) {}
                                  }, 150)
                              }
                          }
                          "MUTE" -> {
                              setMuted(data == "true")
                          }
                          "SPEAKER" -> {
                              setAudioRoute(if (data == "true") CallAudioState.ROUTE_SPEAKER else CallAudioState.ROUTE_BLUETOOTH)
                          }
                      }
                  }

                  override fun onCallAdded(call: Call) {
                      super.onCallAdded(call)
                      activeCall = call
                      val number = call.details?.handle?.schemeSpecificPart ?: "Bilinmeyen Numara"

                      call.registerCallback(object : Call.Callback() {
                          override fun onStateChanged(call: Call, state: Int) {
                              when (state) {
                                  Call.STATE_ACTIVE -> {
                                      routeAudioToBluetooth()
                                      HotspotLanBridge.send("CONNECTED", number)
                                  }
                                  Call.STATE_DISCONNECTED -> {
                                      HotspotLanBridge.send("ENDED")
                                      activeCall = null
                                  }
                              }
                          }
                      })

                      if (call.state == Call.STATE_ACTIVE) {
                          routeAudioToBluetooth()
                      }

                      if (call.state == Call.STATE_RINGING) {
                          try {
                              val tm = getSystemService(Context.TELECOM_SERVICE) as TelecomManager
                              tm.silenceRinger()
                          } catch (_: Exception) {}

                          val hostContactName = ContactHelper.getContactName(this, number) ?: ""
                          val callerPayload = "$number~$hostContactName"

                          if (HotspotLanBridge.isConnected) {
                              HotspotLanBridge.send("INCOMING", callerPayload)
                          } else {
                              val intent = Intent(this, RemoteCallActivity::class.java).apply {
                                  flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                                  putExtra("CALLER_NUMBER", callerPayload)
                                  putExtra("IS_OUTGOING", false)
                                  putExtra("IS_LOCAL_FALLBACK", true)
                              }
                              startActivity(intent)
                          }
                      }
                  }
              }
          """)

          write_file("app/src/main/java/com/example/remotephone/RemoteCallActivity.kt", r"""
              package com.example.remotephone

              import android.app.NotificationManager
              import android.content.Context
              import android.graphics.Color
              import android.media.AudioManager
              import android.media.Ringtone
              import android.media.RingtoneManager
              import android.os.Bundle
              import android.os.PowerManager
              import android.os.SystemClock
              import android.view.View
              import android.widget.Chronometer
              import android.widget.LinearLayout
              import android.widget.Space
              import android.widget.TextView
              import androidx.appcompat.app.AppCompatActivity
              import com.google.android.material.button.MaterialButton

              class RemoteCallActivity : AppCompatActivity(), HotspotLanBridge.Listener {

                  private var ringtone: Ringtone? = null
                  private var proximityWakeLock: PowerManager.WakeLock? = null
                  private var isMuted = false
                  private var isSpeakerOn = false
                  private var isLocalFallback = false
                  private var isOutgoingCall = false
                  private var rawPhoneNumber: String = ""
                  private var resolvedContactName: String? = null

                  private lateinit var tvCallerNumber: TextView
                  private lateinit var tvCallStatus: TextView
                  private lateinit var chronometer: Chronometer
                  private lateinit var layoutInCallControls: LinearLayout
                  private lateinit var btnAnswer: MaterialButton
                  private lateinit var btnReject: MaterialButton
                  private lateinit var spaceBetween: Space

                  override fun onCreate(savedInstanceState: Bundle?) {
                      super.onCreate(savedInstanceState)
                      setContentView(R.layout.activity_remote_call)

                      isOutgoingCall = intent.getBooleanExtra("IS_OUTGOING", false)
                      isLocalFallback = intent.getBooleanExtra("IS_LOCAL_FALLBACK", false)
                      val callerPayload = intent.getStringExtra("CALLER_NUMBER") ?: "Bilinmeyen Numara"

                      val (number, name) = ContactHelper.resolveCallerInfo(this, callerPayload)
                      rawPhoneNumber = number
                      resolvedContactName = name

                      tvCallerNumber = findViewById(R.id.tvCallerNumber)
                      tvCallStatus = findViewById(R.id.tvCallStatus)
                      chronometer = findViewById(R.id.chronometerCallTimer)
                      layoutInCallControls = findViewById(R.id.layoutInCallControls)
                      btnAnswer = findViewById(R.id.btnAnswer)
                      btnReject = findViewById(R.id.btnReject)
                      spaceBetween = findViewById(R.id.spaceBetweenCallButtons)
                      val btnMute = findViewById<MaterialButton>(R.id.btnMute)
                      val btnSpeaker = findViewById<MaterialButton>(R.id.btnSpeaker)

                      if (!resolvedContactName.isNullOrEmpty()) {
                          tvCallerNumber.text = resolvedContactName
                      } else {
                          tvCallerNumber.text = rawPhoneNumber
                      }

                      acquireProximitySensorLock()
                      HotspotLanBridge.addListener(this)

                      if (isOutgoingCall) {
                          updateStatusText("Aranıyor (Bluetooth Kulaklığa Yönlendiriliyor)...")
                          btnAnswer.visibility = View.GONE
                          spaceBetween.visibility = View.GONE
                      } else {
                          updateStatusText("Gelen arama...")
                          val ringtoneUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                          ringtone = RingtoneManager.getRingtone(applicationContext, ringtoneUri)?.apply { play() }
                      }

                      btnMute.setOnClickListener {
                          isMuted = !isMuted
                          if (isLocalFallback) {
                              HostInCallService.instance?.setLocalMute(isMuted)
                          } else {
                              HotspotLanBridge.send("MUTE", isMuted.toString())
                          }
                          btnMute.setBackgroundColor(if (isMuted) Color.parseColor("#8AB4F8") else Color.parseColor("#282C34"))
                          btnMute.setTextColor(if (isMuted) Color.parseColor("#0F1115") else Color.parseColor("#FFFFFF"))
                      }

                      btnSpeaker.setOnClickListener {
                          isSpeakerOn = !isSpeakerOn
                          if (isLocalFallback) {
                              HostInCallService.instance?.setLocalSpeaker(isSpeakerOn)
                          } else {
                              HotspotLanBridge.send("SPEAKER", isSpeakerOn.toString())
                          }
                          btnSpeaker.setBackgroundColor(if (isSpeakerOn) Color.parseColor("#8AB4F8") else Color.parseColor("#282C34"))
                          btnSpeaker.setTextColor(if (isSpeakerOn) Color.parseColor("#0F1115") else Color.parseColor("#FFFFFF"))
                      }

                      btnAnswer.setOnClickListener {
                          ringtone?.stop()
                          btnAnswer.isEnabled = false
                          requestAutoPauseMedia()

                          if (isLocalFallback) {
                              HostInCallService.instance?.answerLocalCall()
                              switchToActiveCallUi()
                          } else {
                              updateStatusText("Bağlanıyor (Bluetooth Aktif)...")
                              HotspotLanBridge.send("ANSWER")
                          }
                      }

                      btnReject.setOnClickListener {
                          ringtone?.stop()
                          btnReject.isEnabled = false
                          btnAnswer.isEnabled = false

                          if (isLocalFallback) {
                              HostInCallService.instance?.hangupAllCalls()
                          } else {
                              HotspotLanBridge.send("HANGUP")
                          }
                          cleanupAndFinish()
                      }
                  }

                  private fun requestAutoPauseMedia() {
                      try {
                          val am = getSystemService(Context.AUDIO_SERVICE) as? AudioManager
                          am?.requestAudioFocus(
                              { },
                              AudioManager.STREAM_MUSIC,
                              AudioManager.AUDIOFOCUS_GAIN_TRANSIENT
                          )
                      } catch (_: Exception) {}
                  }

                  private fun updateStatusText(status: String) {
                      tvCallStatus.text = if (!resolvedContactName.isNullOrEmpty()) {
                          "$rawPhoneNumber • $status"
                      } else {
                          status
                      }
                  }

                  override fun onEvent(event: String, data: String) {
                      when (event) {
                          "CONNECTED" -> switchToActiveCallUi()
                          "ENDED" -> cleanupAndFinish()
                      }
                  }

                  private fun switchToActiveCallUi() {
                      updateStatusText("Görüşme Aktif (Bluetooth)")
                      btnAnswer.visibility = View.GONE
                      spaceBetween.visibility = View.GONE
                      layoutInCallControls.visibility = View.VISIBLE
                      if (chronometer.visibility != View.VISIBLE) {
                          chronometer.visibility = View.VISIBLE
                          chronometer.base = SystemClock.elapsedRealtime()
                          chronometer.start()
                      }
                  }

                  private fun acquireProximitySensorLock() {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (pm.isWakeLockLevelSupported(PowerManager.PROXIMITY_SCREEN_OFF_WAKE_LOCK)) {
                          proximityWakeLock = pm.newWakeLock(
                              PowerManager.PROXIMITY_SCREEN_OFF_WAKE_LOCK,
                              "RemotePhone::ProximityWakeLock"
                          ).apply { acquire(60 * 60 * 1000L) }
                      }
                  }

                  private fun cleanupAndFinish() {
                      ringtone?.stop()
                      chronometer.stop()
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.cancel(BridgeKeepAliveService.CALL_NOTIFICATION_ID)
                      finish()
                  }

                  override fun onDestroy() {
                      HotspotLanBridge.removeListener(this)
                      ringtone?.stop()
                      try {
                          if (proximityWakeLock?.isHeld == true) proximityWakeLock?.release()
                      } catch (_: Exception) {}
                      super.onDestroy()
                  }
              }
          """)

          write_file("app/src/main/java/com/example/remotephone/MainActivity.kt", r"""
              package com.example.remotephone

              import android.Manifest
              import android.annotation.SuppressLint
              import android.app.Activity
              import android.app.NotificationManager
              import android.app.role.RoleManager
              import android.content.Context
              import android.content.Intent
              import android.content.pm.PackageManager
              import android.media.AudioManager
              import android.media.ToneGenerator
              import android.net.Uri
              import android.os.Build
              import android.os.Bundle
              import android.os.PowerManager
              import android.os.VibrationEffect
              import android.os.Vibrator
              import android.provider.Settings
              import android.text.Editable
              import android.text.TextWatcher
              import android.view.HapticFeedbackConstants
              import android.view.View
              import android.widget.ArrayAdapter
              import android.widget.Button
              import android.widget.EditText
              import android.widget.LinearLayout
              import android.widget.ListView
              import android.widget.TextView
              import android.widget.Toast
              import androidx.activity.result.contract.ActivityResultContracts
              import androidx.appcompat.app.AlertDialog
              import androidx.appcompat.app.AppCompatActivity
              import androidx.core.content.ContextCompat
              import com.google.android.material.card.MaterialCardView

              class MainActivity : AppCompatActivity(), HotspotLanBridge.Listener {

                  private var toneGenerator: ToneGenerator? = null
                  private lateinit var tvConnectionStatus: TextView
                  private lateinit var etDialNumber: EditText
                  private val NL = Char(10)

                  private val roleLauncher = registerForActivityResult(
                      ActivityResultContracts.StartActivityForResult()
                  ) { result ->
                      if (result.resultCode == Activity.RESULT_OK) {
                          Toast.makeText(this, "Varsayılan Telefon Uygulaması Ayarlandı", Toast.LENGTH_SHORT).show()
                      }
                  }

                  private val permissionLauncher = registerForActivityResult(
                      ActivityResultContracts.RequestMultiplePermissions()
                  ) { }

                  @SuppressLint("MissingPermission")
                  override fun onCreate(savedInstanceState: Bundle?) {
                      super.onCreate(savedInstanceState)
                      setContentView(R.layout.activity_main)

                      try {
                          toneGenerator = ToneGenerator(AudioManager.STREAM_MUSIC, ToneGenerator.MAX_VOLUME)
                      } catch (_: Exception) {
                          try {
                              toneGenerator = ToneGenerator(AudioManager.STREAM_DTMF, ToneGenerator.MAX_VOLUME)
                          } catch (_: Exception) {}
                      }

                      requestRuntimePermissions()
                      requestBatteryOptimizationExemption()
                      checkFullScreenIntentPermission()

                      val prefs = getSharedPreferences("RemotePhonePrefs", Context.MODE_PRIVATE)
                      tvConnectionStatus = findViewById(R.id.tvConnectionStatus)
                      val cardSetupPanel = findViewById<MaterialCardView>(R.id.cardSetupPanel)
                      val btnToggleSettings = findViewById<Button>(R.id.btnToggleSettings)
                      etDialNumber = findViewById(R.id.etDialNumber)

                      if (intent?.action == Intent.ACTION_DIAL || intent?.action == Intent.ACTION_VIEW) {
                          intent?.data?.schemeSpecificPart?.let { etDialNumber.setText(it) }
                      }

                      val savedMode = prefs.getString("saved_mode", "NONE") ?: "NONE"
                      if (savedMode != "NONE") {
                          cardSetupPanel.visibility = View.GONE
                          startKeepAliveService(savedMode)
                      }

                      btnToggleSettings.setOnClickListener {
                          cardSetupPanel.visibility =
                              if (cardSetupPanel.visibility == View.VISIBLE) View.GONE else View.VISIBLE
                      }

                      findViewById<Button>(R.id.btnContacts).setOnClickListener {
                          if (HotspotLanBridge.isConnected) {
                              HotspotLanBridge.send("REQ_CONTACTS")
                          }
                          showContactsDialog()
                      }

                      setupGoogleDialpad(etDialNumber)
                      HotspotLanBridge.addListener(this)

                      findViewById<Button>(R.id.btnStartHost).setOnClickListener {
                          prefs.edit().putString("saved_mode", "HOST").apply()
                          requestDefaultDialerRole()
                          startKeepAliveService("HOST")
                          cardSetupPanel.visibility = View.GONE
                          tvConnectionStatus.text = "● Note 10 Lite (Ana Hat) Aktif"
                      }

                      findViewById<Button>(R.id.btnStartClient).setOnClickListener {
                          prefs.edit().putString("saved_mode", "CLIENT").apply()
                          checkFullScreenIntentPermission()
                          startKeepAliveService("CLIENT")
                          cardSetupPanel.visibility = View.GONE
                          tvConnectionStatus.text = "● S25 Ultra (Uzak Kontrolcü) Aktif"
                      }

                      findViewById<Button>(R.id.btnMakeCall).setOnClickListener {
                          val targetNumber = etDialNumber.text.toString().trim()
                          if (targetNumber.isEmpty()) {
                              Toast.makeText(this, "Lütfen numara çevirin veya rehberden seçin", Toast.LENGTH_SHORT).show()
                              return@setOnClickListener
                          }

                          val currentMode = prefs.getString("saved_mode", "CLIENT")
                          if (currentMode == "HOST" && !HotspotLanBridge.isConnected) {
                              HostInCallService.placeSystemCall(this, targetNumber)
                              val callIntent = Intent(this, RemoteCallActivity::class.java).apply {
                                  putExtra("CALLER_NUMBER", targetNumber)
                                  putExtra("IS_OUTGOING", true)
                                  putExtra("IS_LOCAL_FALLBACK", true)
                              }
                              startActivity(callIntent)
                          } else {
                              HotspotLanBridge.send("DIAL", targetNumber)
                              val callIntent = Intent(this, RemoteCallActivity::class.java).apply {
                                  putExtra("CALLER_NUMBER", targetNumber)
                                  putExtra("IS_OUTGOING", true)
                                  putExtra("IS_LOCAL_FALLBACK", false)
                              }
                              startActivity(callIntent)
                          }
                      }
                  }

                  override fun onResume() {
                      super.onResume()
                      HotspotLanBridge.triggerScreenWakeRefresh(this)
                  }

                  private fun playStrongKeyFeedback(view: View, dtmfTone: Int) {
                      try {
                          toneGenerator?.stopTone()
                          toneGenerator?.startTone(dtmfTone, 160)
                      } catch (_: Exception) {}

                      view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                      try {
                          val vibrator = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              vibrator?.vibrate(VibrationEffect.createOneShot(25, VibrationEffect.DEFAULT_AMPLITUDE))
                          } else {
                              @Suppress("DEPRECATION")
                              vibrator?.vibrate(25)
                          }
                      } catch (_: Exception) {}
                  }

                  private fun formatContactRow(item: ContactItem): String {
                      return item.name + NL + item.number
                  }

                  private fun showContactsDialog() {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CONTACTS)
                          != PackageManager.PERMISSION_GRANTED
                      ) {
                          permissionLauncher.launch(
                              arrayOf(Manifest.permission.READ_CONTACTS, Manifest.permission.READ_CALL_LOG)
                          )
                          Toast.makeText(this, "İzin verdikten sonra tekrar dokunun", Toast.LENGTH_SHORT).show()
                          return
                      }

                      val allContacts = ContactHelper.getAllContacts(this)
                      val container = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(36, 24, 36, 12)
                      }

                      val searchInput = EditText(this).apply {
                          hint = "Kişi veya numara ara..."
                          isSingleLine = true
                      }

                      val listView = ListView(this)
                      val displayedContacts = allContacts.toMutableList()
                      val adapter = ArrayAdapter(
                          this,
                          android.R.layout.simple_list_item_1,
                          displayedContacts.map { formatContactRow(it) }.toMutableList()
                      )
                      listView.adapter = adapter

                      container.addView(searchInput)
                      container.addView(listView)

                      val dialog = AlertDialog.Builder(this)
                          .setTitle("Kişiler ve Son Aramalar")
                          .setView(container)
                          .setNegativeButton("Kapat", null)
                          .create()

                      searchInput.addTextChangedListener(object : TextWatcher {
                          override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                          override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {
                              val q = s?.toString()?.trim()?.lowercase() ?: ""
                              displayedContacts.clear()
                              if (q.isEmpty()) {
                                  displayedContacts.addAll(allContacts)
                              } else {
                                  displayedContacts.addAll(
                                      allContacts.filter {
                                          it.name.lowercase().contains(q) || it.number.contains(q)
                                      }
                                  )
                              }
                              adapter.clear()
                              adapter.addAll(displayedContacts.map { formatContactRow(it) })
                              adapter.notifyDataSetChanged()
                          }
                          override fun afterTextChanged(s: Editable?) {}
                      })

                      listView.setOnItemClickListener { _, _, position, _ ->
                          val selected = displayedContacts.getOrNull(position)
                          if (selected != null) {
                              etDialNumber.setText(selected.number)
                              Toast.makeText(this@MainActivity, "${selected.name} seçildi", Toast.LENGTH_SHORT).show()
                              dialog.dismiss()
                          }
                      }

                      dialog.show()
                  }

                  override fun onEvent(event: String, data: String) {
                      if (event == "TELEMETRY") {
                          runOnUiThread {
                              val current = tvConnectionStatus.text.toString().substringBefore(" | ")
                              tvConnectionStatus.text = "$current | $data"
                          }
                      }
                  }

                  override fun onConnectionChanged(connected: Boolean) {
                      tvConnectionStatus.text = if (connected) {
                          "● Cihazlar Bağlı (Ortak Wi-Fi / Hotspot)"
                      } else {
                          "● Bağlantı Bekleniyor..."
                      }
                  }

                  private fun setupGoogleDialpad(etDialNumber: EditText) {
                      val keys = listOf(
                          R.id.key1 to Pair("1", ToneGenerator.TONE_DTMF_1),
                          R.id.key2 to Pair("2", ToneGenerator.TONE_DTMF_2),
                          R.id.key3 to Pair("3", ToneGenerator.TONE_DTMF_3),
                          R.id.key4 to Pair("4", ToneGenerator.TONE_DTMF_4),
                          R.id.key5 to Pair("5", ToneGenerator.TONE_DTMF_5),
                          R.id.key6 to Pair("6", ToneGenerator.TONE_DTMF_6),
                          R.id.key7 to Pair("7", ToneGenerator.TONE_DTMF_7),
                          R.id.key8 to Pair("8", ToneGenerator.TONE_DTMF_8),
                          R.id.key9 to Pair("9", ToneGenerator.TONE_DTMF_9),
                          R.id.keyStar to Pair("*", ToneGenerator.TONE_DTMF_S),
                          R.id.key0 to Pair("0", ToneGenerator.TONE_DTMF_0),
                          R.id.keyHash to Pair("#", ToneGenerator.TONE_DTMF_P)
                      )

                      for ((id, info) in keys) {
                          val btn = findViewById<Button>(id)
                          btn.setOnClickListener {
                              playStrongKeyFeedback(it, info.second)
                              etDialNumber.append(info.first)
                              HotspotLanBridge.send("DTMF", info.first)
                          }
                          if (id == R.id.key0) {
                              btn.setOnLongClickListener {
                                  playStrongKeyFeedback(it, ToneGenerator.TONE_DTMF_0)
                                  etDialNumber.append("+")
                                  true
                              }
                          }
                      }

                      val btnBackspace = findViewById<Button>(R.id.btnBackspace)
                      btnBackspace.setOnClickListener {
                          it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                          val text = etDialNumber.text.toString()
                          if (text.isNotEmpty()) {
                              etDialNumber.setText(text.dropLast(1))
                          }
                      }
                      btnBackspace.setOnLongClickListener {
                          it.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                          etDialNumber.setText("")
                          true
                      }
                  }

                  @SuppressLint("BatteryLife")
                  private fun requestBatteryOptimizationExemption() {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          try {
                              val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                                  data = Uri.parse("package:$packageName")
                              }
                              startActivity(intent)
                          } catch (_: Exception) {}
                      }
                  }

                  private fun checkFullScreenIntentPermission() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                          val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                          if (!nm.canUseFullScreenIntent()) {
                              try {
                                  val intent = Intent(
                                      Settings.ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT,
                                      Uri.parse("package:$packageName")
                                  )
                                  startActivity(intent)
                              } catch (_: Exception) {}
                          }
                      }
                  }

                  private fun startKeepAliveService(mode: String) {
                      val serviceIntent = Intent(this, BridgeKeepAliveService::class.java).apply {
                          putExtra("MODE", mode)
                      }
                      ContextCompat.startForegroundService(this, serviceIntent)
                  }

                  private fun requestDefaultDialerRole() {
                      val roleManager = getSystemService(Context.ROLE_SERVICE) as RoleManager
                      if (roleManager.isRoleAvailable(RoleManager.ROLE_DIALER) &&
                          !roleManager.isRoleHeld(RoleManager.ROLE_DIALER)
                      ) {
                        roleLauncher.launch(roleManager.createRequestRoleIntent(RoleManager.ROLE_DIALER))
                      }
                  }

                  private fun requestRuntimePermissions() {
                      val permissions = mutableListOf(
                          Manifest.permission.READ_PHONE_STATE,
                          Manifest.permission.READ_PHONE_NUMBERS,
                          Manifest.permission.CALL_PHONE,
                          Manifest.permission.ANSWER_PHONE_CALLS,
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.READ_CONTACTS,
                          Manifest.permission.READ_CALL_LOG
                      )
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          permissions.add(Manifest.permission.POST_NOTIFICATIONS)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          permissions.add(Manifest.permission.BLUETOOTH_CONNECT)
                      }
                      val missing = permissions.filter {
                          ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                      }
                      if (missing.isNotEmpty()) {
                          permissionLauncher.launch(missing.toTypedArray())
                      }
                  }

                  override fun onDestroy() {
                      HotspotLanBridge.removeListener(this)
                      toneGenerator?.release()
                      super.onDestroy()
                  }
              }
          """)

