          cat << 'EOF' | sed 's/^          //' > app/src/main/java/com/example/remotephone/MainActivity.kt
          package com.example.remotephone

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.app.NotificationManager
          import android.app.role.RoleManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.Settings
          import android.telecom.TelecomManager
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import com.google.android.material.card.MaterialCardView

          class MainActivity : AppCompatActivity(), HotspotLanBridge.Listener {

              private var toneGenerator: ToneGenerator? = null
              private lateinit var tvConnectionStatus: TextView

              private val roleLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  if (result.resultCode == Activity.RESULT_OK) {
                      Toast.makeText(this, "Varsayılan Telefon Uygulaması Ayarlandı", Toast.LENGTH_SHORT).show()
                  }
              }

              private val permissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  try {
                      toneGenerator = ToneGenerator(AudioManager.STREAM_DTMF, 80)
                  } catch (_: Exception) {}

                  requestRuntimePermissions()
                  requestBatteryOptimizationExemption()
                  checkFullScreenIntentPermission()

                  val prefs = getSharedPreferences("RemotePhonePrefs", Context.MODE_PRIVATE)
                  tvConnectionStatus = findViewById(R.id.tvConnectionStatus)
                  val cardSetupPanel = findViewById<MaterialCardView>(R.id.cardSetupPanel)
                  val btnToggleSettings = findViewById<Button>(R.id.btnToggleSettings)

                  val etSipNumber = findViewById<EditText>(R.id.etSipNumber)
                  val etSipUser = findViewById<EditText>(R.id.etSipUser)
                  val etSipPass = findViewById<EditText>(R.id.etSipPass)
                  val etSipDomain = findViewById<EditText>(R.id.etSipDomain)
                  val etDialNumber = findViewById<EditText>(R.id.etDialNumber)

                  etSipNumber.setText(prefs.getString("sip_number", ""))
                  etSipUser.setText(prefs.getString("sip_user", ""))
                  etSipPass.setText(prefs.getString("sip_pass", ""))
                  etSipDomain.setText(prefs.getString("sip_domain", ""))

                  if (intent?.action == Intent.ACTION_DIAL || intent?.action == Intent.ACTION_VIEW) {
                      intent?.data?.schemeSpecificPart?.let { etDialNumber.setText(it) }
                  }

                  val savedMode = prefs.getString("saved_mode", "NONE") ?: "NONE"
                  if (savedMode != "NONE") {
                      cardSetupPanel.visibility = View.GONE
                      startKeepAliveService(savedMode)
                  }

                  btnToggleSettings.setOnClickListener {
                      cardSetupPanel.visibility =
                          if (cardSetupPanel.visibility == View.VISIBLE) View.GONE else View.VISIBLE
                  }

                  setupGoogleDialpad(etDialNumber)
                  HotspotLanBridge.addListener(this)

                  findViewById<Button>(R.id.btnStartHost).setOnClickListener {
                      val sipDid = etSipNumber.text.toString().trim()
                      prefs.edit()
                          .putString("sip_number", sipDid)
                          .putString("saved_mode", "HOST")
                          .apply()

                      requestDefaultDialerRole()
                      if (sipDid.isNotEmpty()) {
                          HostInCallService().configureForwarding(this, sipDid, true)
                      }
                      startKeepAliveService("HOST")
                      cardSetupPanel.visibility = View.GONE
                      tvConnectionStatus.text = "● Note 10 Lite (Ana Hat) Aktif - Hotspot Açık Olmalı"
                  }

                  findViewById<Button>(R.id.btnStartClient).setOnClickListener {
                      val user = etSipUser.text.toString().trim()
                      val pass = etSipPass.text.toString().trim()
                      val domain = etSipDomain.text.toString().trim()

                      prefs.edit()
                          .putString("sip_user", user)
                          .putString("sip_pass", pass)
                          .putString("sip_domain", domain)
                          .putString("saved_mode", "CLIENT")
                          .apply()

                      checkFullScreenIntentPermission()
                      startKeepAliveService("CLIENT")
                      cardSetupPanel.visibility = View.GONE
                      tvConnectionStatus.text = "● S25 Ultra (Uzak Ahize) - Bağlanıyor..."
                  }

                  @SuppressLint("MissingPermission")
                  findViewById<Button>(R.id.btnMakeCall).setOnClickListener {
                      val targetNumber = etDialNumber.text.toString().trim()
                      if (targetNumber.isEmpty()) {
                          Toast.makeText(this, "Lütfen numara çevirin", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }

                      val currentMode = prefs.getString("saved_mode", "CLIENT")
                      if (currentMode == "HOST" && !HotspotLanBridge.isConnected) {
                          val tm = getSystemService(Context.TELECOM_SERVICE) as TelecomManager
                          tm.placeCall(Uri.parse("tel:" + Uri.encode(targetNumber)), Bundle())
                          val callIntent = Intent(this, RemoteCallActivity::class.java).apply {
                              putExtra("CALLER_NUMBER", targetNumber)
                              putExtra("IS_OUTGOING", true)
                              putExtra("IS_LOCAL_FALLBACK", true)
                          }
                          startActivity(callIntent)
                      } else {
                          SipAudioEngine.prepareForIncomingAudio()
                          HotspotLanBridge.send("DIAL", targetNumber)
                          val callIntent = Intent(this, RemoteCallActivity::class.java).apply {
                              putExtra("CALLER_NUMBER", targetNumber)
                              putExtra("IS_OUTGOING", true)
                              putExtra("IS_LOCAL_FALLBACK", false)
                          }
                          startActivity(callIntent)
                      }
                  }
              }

              override fun onConnectionChanged(connected: Boolean) {
                  tvConnectionStatus.text = if (connected) {
                      "● Note 10 Lite ⇄ S25 Ultra Bağlı (Aktif)"
                  } else {
                      "● Bağlantı Bekleniyor..."
                  }
              }

              private fun setupGoogleDialpad(etDialNumber: EditText) {
                  val keys = listOf(
                      R.id.key1 to Pair("1", ToneGenerator.TONE_DTMF_1),
                      R.id.key2 to Pair("2", ToneGenerator.TONE_DTMF_2),
                      R.id.key3 to Pair("3", ToneGenerator.TONE_DTMF_3),
                      R.id.key4 to Pair("4", ToneGenerator.TONE_DTMF_4),
                      R.id.key5 to Pair("5", ToneGenerator.TONE_DTMF_5),
                      R.id.key6 to Pair("6", ToneGenerator.TONE_DTMF_6),
                      R.id.key7 to Pair("7", ToneGenerator.TONE_DTMF_7),
                      R.id.key8 to Pair("8", ToneGenerator.TONE_DTMF_8),
                      R.id.key9 to Pair("9", ToneGenerator.TONE_DTMF_9),
                      R.id.keyStar to Pair("*", ToneGenerator.TONE_DTMF_S),
                      R.id.key0 to Pair("0", ToneGenerator.TONE_DTMF_0),
                      R.id.keyHash to Pair("#", ToneGenerator.TONE_DTMF_P)
                  )

                  for ((id, info) in keys) {
                      val btn = findViewById<Button>(id)
                      btn.setOnClickListener {
                          toneGenerator?.startTone(info.second, 120)
                          etDialNumber.append(info.first)
                          SipAudioEngine.sendDtmf(info.first[0])
                      }
                      if (id == R.id.key0) {
                          btn.setOnLongClickListener {
                              etDialNumber.append("+")
                              true
                          }
                      }
                  }

                  val btnBackspace = findViewById<Button>(R.id.btnBackspace)
                  btnBackspace.setOnClickListener {
                      val text = etDialNumber.text.toString()
                      if (text.isNotEmpty()) {
                          etDialNumber.setText(text.dropLast(1))
                      }
                  }
                  btnBackspace.setOnLongClickListener {
                      etDialNumber.setText("")
                      true
                  }
              }

              @SuppressLint("BatteryLife")
              private fun requestBatteryOptimizationExemption() {
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                      try {
                          val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                              data = Uri.parse("package:$packageName")
                          }
                          startActivity(intent)
                      } catch (_: Exception) {}
                  }
              }

              private fun checkFullScreenIntentPermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      if (!nm.canUseFullScreenIntent()) {
                          try {
                              val intent = Intent(
                                  Settings.ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT,
                                  Uri.parse("package:$packageName")
                              )
                              startActivity(intent)
                          } catch (_: Exception) {}
                      }
                  }
              }

              private fun startKeepAliveService(mode: String) {
                  val serviceIntent = Intent(this, BridgeKeepAliveService::class.java).apply {
                      putExtra("MODE", mode)
                  }
                  ContextCompat.startForegroundService(this, serviceIntent)
              }

              private fun requestDefaultDialerRole() {
                  val roleManager = getSystemService(Context.ROLE_SERVICE) as RoleManager
                  if (roleManager.isRoleAvailable(RoleManager.ROLE_DIALER) &&
                      !roleManager.isRoleHeld(RoleManager.ROLE_DIALER)
                  ) {
                      roleLauncher.launch(roleManager.createRequestRoleIntent(RoleManager.ROLE_DIALER))
                  }
              }

              private fun requestRuntimePermissions() {
                  val permissions = mutableListOf(
                      Manifest.permission.READ_PHONE_STATE,
                      Manifest.permission.CALL_PHONE,
                      Manifest.permission.ANSWER_PHONE_CALLS,
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.READ_CONTACTS
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      permissions.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  val missing = permissions.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isNotEmpty()) {
                      permissionLauncher.launch(missing.toTypedArray())
                  }
              }

              override fun onDestroy() {
                  HotspotLanBridge.removeListener(this)
                  toneGenerator?.release()
                  super.onDestroy()
              }
          }
