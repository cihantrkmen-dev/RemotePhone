              package com.example.remotephone

              import android.annotation.SuppressLint
              import android.content.Context
              import android.content.Intent
              import android.media.AudioManager
              import android.net.Uri
              import android.os.Bundle
              import android.os.Handler
              import android.os.Looper
              import android.telecom.Call
              import android.telecom.CallAudioState
              import android.telecom.InCallService
              import android.telecom.PhoneAccountHandle
              import android.telecom.TelecomManager
              import android.telecom.VideoProfile
              import java.text.SimpleDateFormat
              import java.util.Date
              import java.util.Locale

              class HostInCallService : InCallService(), HotspotLanBridge.Listener {

                  companion object {
                      var instance: HostInCallService? = null

                      @SuppressLint("MissingPermission")
                      fun placeSystemCall(context: Context, rawNumber: String) {
                          val clean = rawNumber.trim()
                          if (clean.isEmpty()) return
                          val uri = Uri.parse("tel:" + Uri.encode(clean))
                          val tm = context.getSystemService(Context.TELECOM_SERVICE) as TelecomManager
                          val extras = Bundle()
                          try {
                              val account: PhoneAccountHandle? = tm.getDefaultOutgoingPhoneAccount("tel")
                                  ?: tm.callCapablePhoneAccounts.firstOrNull()
                              if (account != null) {
                                  extras.putParcelable(TelecomManager.EXTRA_PHONE_ACCOUNT_HANDLE, account)
                              }
                              tm.placeCall(uri, extras)
                          } catch (_: Exception) {
                              try {
                                  val callIntent = Intent(Intent.ACTION_CALL, uri).apply {
                                      flags = Intent.FLAG_ACTIVITY_NEW_TASK
                                  }
                                  context.startActivity(callIntent)
                              } catch (_: Exception) {}
                          }
                      }
                  }

                  private val handler = Handler(Looper.getMainLooper())
                  private var activeCall: Call? = null

                  @Volatile
                  private var wasIncomingCall = false
                  @Volatile
                  private var wasCallAnswered = false
                  @Volatile
                  private var wasRejectedByUser = false
                  @Volatile
                  private var incomingAckReceived = false
                  private var currentCallerPayload: String = ""

                  override fun onCreate() {
                      super.onCreate()
                      instance = this
                      BluetoothMonitor.init(this)
                      HotspotLanBridge.addListener(this)

                      handler.post(object : Runnable {
                          @SuppressLint("MissingPermission")
                          override fun run() {
                              if (HotspotLanBridge.isConnected) {
                                  BridgeKeepAliveService.instance?.sendHostTelemetry()
                              }
                              handler.postDelayed(this, 12_000L)
                          }
                      })
                  }

                  override fun onDestroy() {
                      HotspotLanBridge.removeListener(this)
                      handler.removeCallbacksAndMessages(null)
                      instance = null
                      super.onDestroy()
                  }

                  fun onBluetoothHeadsetReconnected() {
                      val c = activeCall ?: return
                      if (c.state == Call.STATE_ACTIVE || c.state == Call.STATE_DIALING) {
                          val hs = BluetoothMonitor.getLocalHeadsetStatus(this)
                          if (hs.isReady) {
                              routeAudioToBluetoothOrEarpiece()
                              HotspotLanBridge.send("BT_ROUTED", hs.summaryText)
                          }
                      }
                  }

                  @SuppressLint("MissingPermission")
                  private fun routeAudioToBluetoothOrEarpiece() {
                      try {
                          val am = getSystemService(Context.AUDIO_SERVICE) as? AudioManager
                          am?.mode = AudioManager.MODE_IN_COMMUNICATION
                          val hs = BluetoothMonitor.getLocalHeadsetStatus(this)
                          if (hs.isReady) {
                              am?.isBluetoothScoOn = true
                              am?.startBluetoothSco()
                              setAudioRoute(CallAudioState.ROUTE_BLUETOOTH)
                              HotspotLanBridge.send("BT_ROUTED", hs.summaryText)
                          } else {
                              setAudioRoute(CallAudioState.ROUTE_EARPIECE)
                              HotspotLanBridge.send("BT_MISSING", "⚠️ Kulaklık Bağlı Değil! Ses Note 10 Lite üzerinde.")
                          }
                      } catch (_: Exception) {
                          try { setAudioRoute(CallAudioState.ROUTE_EARPIECE) } catch (_: Exception) {}
                      }
                  }

                  @SuppressLint("MissingPermission")
                  override fun onEvent(event: String, data: String) {
                      when (event) {
                          "INCOMING_ACK" -> {
                              incomingAckReceived = true
                          }
                          "ANSWER" -> {
                              wasCallAnswered = true
                              val ringing = calls.firstOrNull { it.state == Call.STATE_RINGING } ?: activeCall
                              ringing?.answer(VideoProfile.STATE_AUDIO_ONLY)
                              routeAudioToBluetoothOrEarpiece()
                          }
                          "REJECT", "HANGUP" -> {
                              wasRejectedByUser = true
                              hangupAllCalls()
                          }
                          "DIAL" -> {
                              if (data.isNotEmpty()) {
                                  placeSystemCall(this, data)
                              }
                          }
                          "DTMF" -> {
                              if (data.isNotEmpty()) {
                                  activeCall?.playDtmfTone(data[0])
                                  handler.postDelayed({
                                      try { activeCall?.stopDtmfTone() } catch (_: Exception) {}
                                  }, 160)
                              }
                          }
                          "MUTE" -> {
                              setLocalMute(data == "true")
                          }
                          "SPEAKER" -> {
                              setLocalSpeaker(data == "true")
                          }
                      }
                  }

                  override fun onCallAdded(call: Call) {
                      super.onCallAdded(call)
                      activeCall = call
                      val number = call.details?.handle?.schemeSpecificPart ?: "Bilinmeyen Numara"
                      val hostContactName = ContactHelper.getContactName(this, number) ?: ""
                      currentCallerPayload = "$number~$hostContactName"

                      wasIncomingCall = (call.state == Call.STATE_RINGING)
                      wasCallAnswered = false
                      wasRejectedByUser = false
                      incomingAckReceived = false

                      BridgeKeepAliveService.instance?.sendHostTelemetry()

                      call.registerCallback(object : Call.Callback() {
                          override fun onStateChanged(call: Call, state: Int) {
                              when (state) {
                                  Call.STATE_DIALING -> {
                                      routeAudioToBluetoothOrEarpiece()
                                  }
                                  Call.STATE_ACTIVE -> {
                                      wasCallAnswered = true
                                      routeAudioToBluetoothOrEarpiece()
                                      HotspotLanBridge.send("CONNECTED", number)
                                  }
                                  Call.STATE_DISCONNECTED -> {
                                      handleCallDisconnected()
                                      activeCall = null
                                  }
                              }
                          }
                      })

                      if (call.state == Call.STATE_DIALING || call.state == Call.STATE_ACTIVE) {
                          routeAudioToBluetoothOrEarpiece()
                      }

                      if (call.state == Call.STATE_RINGING) {
                          if (HotspotLanBridge.isConnected) {
                              try {
                                  val tm = getSystemService(Context.TELECOM_SERVICE) as TelecomManager
                                  tm.silenceRinger()
                              } catch (_: Exception) {}
                              HotspotLanBridge.send("INCOMING", currentCallerPayload)

                              handler.postDelayed({
                                  if (call.state == Call.STATE_RINGING && !incomingAckReceived && !HotspotLanBridge.isConnected) {
                                      launchLocalFallbackScreen(currentCallerPayload)
                                  }
                              }, 1_500L)
                          } else {
                              launchLocalFallbackScreen(currentCallerPayload)
                          }
                      }
                  }

                  private fun handleCallDisconnected() {
                      if (wasIncomingCall && !wasCallAnswered && !wasRejectedByUser) {
                          val timeStr = SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date())
                          val missedData = "$currentCallerPayload~$timeStr"
                          if (HotspotLanBridge.isConnected) {
                              HotspotLanBridge.send("MISSED", missedData)
                          } else {
                              BridgeKeepAliveService.pendingOfflineMissedCalls.add(missedData)
                          }
                          handler.postDelayed({
                              if (HotspotLanBridge.isConnected) {
                                  val logsPayload = ContactHelper.serializeCallLogs(this@HostInCallService)
                                  if (logsPayload.isNotEmpty()) {
                                      HotspotLanBridge.send("RES_CALLLOGS", logsPayload)
                                  }
                              }
                          }, 1_000L)
                      } else {
                          HotspotLanBridge.send("ENDED")
                      }
                  }

                  private fun launchLocalFallbackScreen(callerPayload: String) {
                      BridgeKeepAliveService.instance?.startRingerAndVibration()
                      val intent = Intent(this, RemoteCallActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                          putExtra("CALLER_NUMBER", callerPayload)
                          putExtra("IS_OUTGOING", false)
                          putExtra("IS_LOCAL_FALLBACK", true)
                      }
                      startActivity(intent)
                  }

                  fun answerLocalCall() {
                      wasCallAnswered = true
                      BridgeKeepAliveService.stopIncomingRinging()
                      val ringing = calls.firstOrNull { it.state == Call.STATE_RINGING } ?: activeCall
                      ringing?.answer(VideoProfile.STATE_AUDIO_ONLY)
                      routeAudioToBluetoothOrEarpiece()
                      HotspotLanBridge.send("CONNECTED")
                  }

                  fun playLocalDtmf(digit: Char) {
                      try {
                          activeCall?.playDtmfTone(digit)
                          handler.postDelayed({
                              try { activeCall?.stopDtmfTone() } catch (_: Exception) {}
                          }, 160)
                      } catch (_: Exception) {}
                  }

                  fun setLocalSpeaker(enabled: Boolean) {
                      if (enabled) {
                          setAudioRoute(CallAudioState.ROUTE_SPEAKER)
                      } else {
                          routeAudioToBluetoothOrEarpiece()
                      }
                  }

                  fun setLocalMute(muted: Boolean) {
                      setMuted(muted)
                  }

                  fun hangupAllCalls() {
                      wasRejectedByUser = true
                      BridgeKeepAliveService.stopIncomingRinging()
                      handler.removeCallbacksAndMessages(null)
                      setMuted(false)
                      calls.forEach {
                          try {
                              if (it.state == Call.STATE_RINGING) it.reject(false, null) else it.disconnect()
                          } catch (_: Exception) {}
                      }
                      activeCall = null
                      HotspotLanBridge.send("ENDED")
                  }
              }
          """)

