          cat << 'EOF' | sed 's/^          //' > app/src/main/java/com/example/remotephone/ContactHelper.kt
          package com.example.remotephone

          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.provider.ContactsContract
          import androidx.core.content.ContextCompat

          object ContactHelper {
              fun getContactName(context: Context, phoneNumber: String): String? {
                  val cleanNumber = phoneNumber.trim()
                  if (cleanNumber.isEmpty()) return null
                  if (ContextCompat.checkSelfPermission(context, Manifest.permission.READ_CONTACTS)
                      != PackageManager.PERMISSION_GRANTED
                  ) return null

                  return try {
                      val uri = Uri.withAppendedPath(
                          ContactsContract.PhoneLookup.CONTENT_FILTER_URI,
                          Uri.encode(cleanNumber)
                      )
                      val projection = arrayOf(ContactsContract.PhoneLookup.DISPLAY_NAME)
                      context.contentResolver.query(uri, projection, null, null, null)?.use { cursor ->
                          if (cursor.moveToFirst()) cursor.getString(0) else null
                      }
                  } catch (_: Exception) {
                      null
                  }
              }

              fun resolveCallerInfo(context: Context, payload: String): Pair<String, String?> {
                  val parts = payload.split("~", limit = 2)
                  val rawNumber = parts[0].ifBlank { "Bilinmeyen Numara" }
                  val hostName = parts.getOrNull(1)?.takeIf { it.isNotBlank() }
                  val localName = getContactName(context, rawNumber)
                  return Pair(rawNumber, localName ?: hostName)
              }
          }
          EOF

          cat << 'EOF' | sed 's/^          //' > app/src/main/java/com/example/remotephone/HotspotLanBridge.kt
          package com.example.remotephone

          import android.content.Context
          import android.net.ConnectivityManager
          import android.net.LinkProperties
          import kotlinx.coroutines.*
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.io.PrintWriter
          import java.net.ServerSocket
          import java.net.Socket
          import java.util.concurrent.CopyOnWriteArraySet

          object HotspotLanBridge {
              private const val PORT = 8989
              private const val SOCKET_TIMEOUT_MS = 12_000
              private const val HEARTBEAT_INTERVAL_MS = 5_000L

              interface Listener {
                  fun onEvent(event: String, data: String) {}
                  fun onConnectionChanged(connected: Boolean) {}
              }

              private val listeners = CopyOnWriteArraySet<Listener>()
              private val scope = CoroutineScope(Dispatchers.IO + SupervisorJob())
              private var serverSocket: ServerSocket? = null
              private var currentSocket: Socket? = null
              private var writer: PrintWriter? = null
              private var activeJob: Job? = null

              @Volatile
              var isConnected: Boolean = false
                  private set

              fun addListener(listener: Listener) {
                  listeners.add(listener)
                  listener.onConnectionChanged(isConnected)
              }

              fun removeListener(listener: Listener) {
                  listeners.remove(listener)
              }

              fun startHostServer() {
                  stop()
                  activeJob = scope.launch {
                      while (isActive) {
                          try {
                              serverSocket = ServerSocket(PORT).apply { reuseAddress = true }
                              while (isActive) {
                                  val client = serverSocket!!.accept()
                                  handleSocket(client)
                              }
                          } catch (_: Exception) {
                              delay(1500)
                          } finally {
                              try { serverSocket?.close() } catch (_: Exception) {}
                          }
                      }
                  }
              }

              fun startClientAutoConnect(context: Context) {
                  stop()
                  val appCtx = context.applicationContext
                  activeJob = scope.launch {
                      while (isActive) {
                          try {
                              val hostIp = getHotspotGatewayIp(appCtx)
                              if (!hostIp.isNullOrEmpty()) {
                                  val socket = Socket(hostIp, PORT)
                                  handleSocket(socket)
                              }
                          } catch (_: Exception) {
                              notifyConnection(false)
                          }
                          delay(2000)
                      }
                  }
              }

              fun stop() {
                  activeJob?.cancel()
                  try { currentSocket?.close() } catch (_: Exception) {}
                  try { serverSocket?.close() } catch (_: Exception) {}
                  notifyConnection(false)
              }

              private suspend fun handleSocket(socket: Socket) {
                  try { currentSocket?.close() } catch (_: Exception) {}
                  currentSocket = socket
                  socket.keepAlive = true
                  socket.tcpNoDelay = true
                  socket.soTimeout = SOCKET_TIMEOUT_MS

                  writer = PrintWriter(socket.getOutputStream(), true)
                  val reader = BufferedReader(InputStreamReader(socket.inputStream))
                  notifyConnection(true)

                  val heartbeatJob = scope.launch {
                      while (isActive && !socket.isClosed) {
                          try {
                              writer?.println("PING|")
                              if (writer?.checkError() == true) {
                                  socket.close()
                                  break
                              }
                          } catch (_: Exception) {
                              socket.close()
                              break
                          }
                          delay(HEARTBEAT_INTERVAL_MS)
                      }
                  }

                  try {
                      while (!socket.isClosed) {
                          val line = reader.readLine() ?: break
                          val parts = line.split("|", limit = 2)
                          val event = parts[0]
                          val data = parts.getOrElse(1) { "" }

                          when (event) {
                              "PING" -> writer?.println("PONG|")
                              "PONG" -> {}
                              else -> notifyEvent(event, data)
                          }
                      }
                  } catch (_: Exception) {
                  } finally {
                      heartbeatJob.cancel()
                      writer = null
                      try { socket.close() } catch (_: Exception) {}
                      notifyConnection(false)
                  }
              }

              fun send(event: String, data: String = "") {
                  scope.launch {
                      try {
                          writer?.println("$event|$data")
                      } catch (_: Exception) {}
                  }
              }

              private suspend fun notifyEvent(event: String, data: String) {
                  withContext(Dispatchers.Main) {
                      for (listener in listeners) listener.onEvent(event, data)
                  }
              }

              private suspend fun notifyConnection(connected: Boolean) {
                  isConnected = connected
                  withContext(Dispatchers.Main) {
                      for (listener in listeners) listener.onConnectionChanged(connected)
                  }
              }

              private fun getHotspotGatewayIp(context: Context): String? {
                  val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  val network = cm.activeNetwork ?: return "192.168.43.1"
                  val linkProps: LinkProperties = cm.getLinkProperties(network) ?: return "192.168.43.1"
                  for (route in linkProps.routes) {
                      if (route.isDefaultRoute && route.gateway != null) {
                          val ip = route.gateway?.hostAddress
                          if (!ip.isNullOrEmpty() && ip != "0.0.0.0") return ip
                      }
                  }
                  return "192.168.43.1"
              }
          }
          EOF

          cat << 'EOF' | sed 's/^          //' > app/src/main/java/com/example/remotephone/SipAudioEngine.kt
          package com.example.remotephone

          import android.content.Context
          import android.media.AudioManager
          import org.linphone.core.*

          object SipAudioEngine {
              private var core: Core? = null
              private var appContext: Context? = null

              @Volatile
              var awaitingAutoAnswer = false

              var onCallConnected: (() -> Unit)? = null
              var onCallTerminated: (() -> Unit)? = null

              private val coreListener = object : CoreListenerStub() {
                  override fun onCallStateChanged(
                      core: Core,
                      call: Call,
                      state: Call.State,
                      message: String
                  ) {
                      when (state) {
                          Call.State.IncomingReceived -> {
                              if (awaitingAutoAnswer) {
                                  awaitingAutoAnswer = false
                                  call.accept()
                                  setSpeakerphone(false)
                                  onCallConnected?.invoke()
                              }
                          }
                          Call.State.Connected, Call.State.StreamsRunning -> {
                              onCallConnected?.invoke()
                          }
                          Call.State.End, Call.State.Released, Call.State.Error -> {
                              awaitingAutoAnswer = false
                              setSpeakerphone(false)
                              onCallTerminated?.invoke()
                          }
                          else -> {}
                      }
                  }
              }

              @Synchronized
              fun initAndRegister(
                  context: Context,
                  sipUsername: String,
                  sipPassword: String,
                  sipDomain: String
              ) {
                  if (sipUsername.isEmpty() || sipDomain.isEmpty()) return
                  appContext = context.applicationContext
                  val factory = Factory.instance()
                  factory.setDebugMode(false, "RemotePhoneSIP")

                  if (core == null) {
                      core = factory.createCore(null, null, appContext!!).apply {
                          enableAdaptiveRateControl(true)
                          addListener(coreListener)
                          start()
                      }
                  } else {
                      core?.clearAccounts()
                      core?.clearAllAuthInfo()
                  }

                  val authInfo = factory.createAuthInfo(sipUsername, null, sipPassword, null, null, sipDomain)
                  val params = core!!.createAccountParams().apply {
                      identityAddress = factory.createAddress("sip:$sipUsername@$sipDomain")
                      serverAddress = factory.createAddress("sip:$sipDomain;transport=udp")
                      isRegisterEnabled = true
                  }

                  val account = core!!.createAccount(params)
                  core?.addAuthInfo(authInfo)
                  core?.addAccount(account)
                  core?.defaultAccount = account
              }

              fun prepareForIncomingAudio() {
                  awaitingAutoAnswer = true
              }

              fun terminateAudioCall() {
                  awaitingAutoAnswer = false
                  setSpeakerphone(false)
                  core?.currentCall?.terminate()
              }

              fun sendDtmf(digit: Char) {
                  core?.currentCall?.sendDtmf(digit)
              }

              fun setMuted(muted: Boolean) {
                  core?.isMicEnabled = !muted
              }

              fun setSpeakerphone(enabled: Boolean) {
                  val am = appContext?.getSystemService(Context.AUDIO_SERVICE) as? AudioManager ?: return
                  am.mode = AudioManager.MODE_IN_COMMUNICATION
                  am.isSpeakerphoneOn = enabled
              }
          }
          EOF

          cat << 'EOF' | sed 's/^          //' > app/src/main/java/com/example/remotephone/BridgeKeepAliveService.kt
          package com.example.remotephone

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import androidx.core.app.NotificationCompat
          import androidx.core.app.ServiceCompat

          class BridgeKeepAliveService : Service(), HotspotLanBridge.Listener {

              companion object {
                  private const val CHANNEL_ID = "RemotePhoneKeepAliveChannel"
                  private const val CALL_CHANNEL_ID = "IncomingRemoteCallChannel"
                  private const val NOTIFICATION_ID = 1001
                  const val CALL_NOTIFICATION_ID = 2002
              }

              private var wakeLock: PowerManager.WakeLock? = null
              private var wifiLock: WifiManager.WifiLock? = null

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannels()
                  acquireHardwareLocks()
                  HotspotLanBridge.addListener(this)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val prefs = getSharedPreferences("RemotePhonePrefs", Context.MODE_PRIVATE)
                  val mode = intent?.getStringExtra("MODE") ?: prefs.getString("saved_mode", "NONE") ?: "NONE"

                  val roleText = when (mode) {
                      "HOST" -> "1. Telefon (Note 10 Lite Ana Hat) Aktif"
                      "CLIENT" -> "2. Telefon (S25 Ultra Uzak Ahize) Aktif"
                      else -> "Servis Hazır"
                  }

                  val notification: Notification = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("Telefon Köprüsü")
                      .setContentText(roleText)
                      .setSmallIcon(android.R.drawable.sym_action_call)
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      ServiceCompat.startForeground(
                          this,
                          NOTIFICATION_ID,
                          notification,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                      )
                  } else {
                      startForeground(NOTIFICATION_ID, notification)
                  }

                  if (mode == "HOST") {
                      HostInCallService.sipBridgeDidNumber = prefs.getString("sip_number", "") ?: ""
                      HotspotLanBridge.startHostServer()
                  } else if (mode == "CLIENT") {
                      SipAudioEngine.initAndRegister(
                          this,
                          prefs.getString("sip_user", "") ?: "",
                          prefs.getString("sip_pass", "") ?: "",
                          prefs.getString("sip_domain", "") ?: ""
                      )
                      HotspotLanBridge.startClientAutoConnect(this)
                  }

                  return START_STICKY
              }

              override fun onEvent(event: String, data: String) {
                  if (event == "INCOMING") {
                      showIncomingCallNotification(data, isLocalHostFallback = false)
                  } else if (event == "ENDED") {
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.cancel(CALL_NOTIFICATION_ID)
                  }
              }

              fun showIncomingCallNotification(callerPayload: String, isLocalHostFallback: Boolean) {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val (rawNumber, resolvedName) = ContactHelper.resolveCallerInfo(this, callerPayload)
                  val displayTitle = resolvedName ?: rawNumber
                  val displaySubText = if (resolvedName != null) "$rawNumber • Gelen Arama" else "Gelen Arama"

                  val fullScreenIntent = Intent(this, RemoteCallActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      putExtra("CALLER_NUMBER", callerPayload)
                      putExtra("IS_OUTGOING", false)
                      putExtra("IS_LOCAL_FALLBACK", isLocalHostFallback)
                  }
                  val fullScreenPendingIntent = PendingIntent.getActivity(
                      this, 0, fullScreenIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val notification = NotificationCompat.Builder(this, CALL_CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.sym_call_incoming)
                      .setContentTitle(displayTitle)
                      .setContentText(displaySubText)
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_CALL)
                      .setFullScreenIntent(fullScreenPendingIntent, true)
                      .setOngoing(true)
                      .setAutoCancel(true)
                      .build()

                  nm.notify(CALL_NOTIFICATION_ID, notification)
                  try {
                      startActivity(fullScreenIntent)
                  } catch (_: Exception) {}
              }

              private fun acquireHardwareLocks() {
                  val powerManager = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = powerManager.newWakeLock(
                      PowerManager.PARTIAL_WAKE_LOCK,
                      "RemotePhone::BridgeWakeLock"
                  ).apply {
                      setReferenceCounted(false)
                      acquire()
                  }

                  val wifiManager = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                  val lockMode = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      WifiManager.WIFI_MODE_FULL_LOW_LATENCY
                  } else {
                      @Suppress("DEPRECATION")
                      WifiManager.WIFI_MODE_FULL_HIGH_PERF
                  }
                  wifiLock = wifiManager.createWifiLock(lockMode, "RemotePhone::BridgeWifiLock").apply {
                      setReferenceCounted(false)
                      acquire()
                  }
              }

              override fun onDestroy() {
                  HotspotLanBridge.removeListener(this)
                  try {
                      if (wakeLock?.isHeld == true) wakeLock?.release()
                      if (wifiLock?.isHeld == true) wifiLock?.release()
                  } catch (_: Exception) {}
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              private fun createNotificationChannels() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(
                          NotificationChannel(
                              CHANNEL_ID,
                              "Arka Plan Bağlantı Servisi",
                              NotificationManager.IMPORTANCE_LOW
                          )
                      )
                      nm.createNotificationChannel(
                          NotificationChannel(
                              CALL_CHANNEL_ID,
                              "Gelen Çağrı Uyarıları",
                              NotificationManager.IMPORTANCE_HIGH
                          ).apply {
                              lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                          }
                      )
                  }
              }
          }
          EOF

          cat << 'EOF' | sed 's/^          //' > app/src/main/java/com/example/remotephone/HostInCallService.kt
          package com.example.remotephone

          import android.annotation.SuppressLint
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.telecom.Call
          import android.telecom.CallAudioState
          import android.telecom.InCallService
          import android.telecom.TelecomManager
          import android.telecom.VideoProfile

          class HostInCallService : InCallService(), HotspotLanBridge.Listener {

              companion object {
                  var instance: HostInCallService? = null
                  var sipBridgeDidNumber: String = ""
              }

              private var isOutgoingBridgeMode = false
              private var targetExternalCall: Call? = null
              private var sipBridgeCall: Call? = null

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  val prefs = getSharedPreferences("RemotePhonePrefs", Context.MODE_PRIVATE)
                  if (sipBridgeDidNumber.isEmpty()) {
                      sipBridgeDidNumber = prefs.getString("sip_number", "") ?: ""
                  }
                  HotspotLanBridge.addListener(this)
              }

              override fun onDestroy() {
                  HotspotLanBridge.removeListener(this)
                  instance = null
                  super.onDestroy()
              }

              override fun onEvent(event: String, data: String) {
                  when (event) {
                      "ANSWER" -> {
                          calls.firstOrNull { it.state == Call.STATE_RINGING }?.reject(false, null)
                      }
                      "REJECT" -> {
                          if (isOutgoingBridgeMode) {
                              hangupAllCalls()
                          } else {
                              silenceRinger()
                          }
                      }
                      "DIAL" -> {
                          if (data.isNotEmpty() && sipBridgeDidNumber.isNotEmpty()) {
                              startOutgoingConferenceBridge(data)
                          }
                      }
                  }
              }

              @SuppressLint("MissingPermission")
              private fun startOutgoingConferenceBridge(targetNumber: String) {
                  isOutgoingBridgeMode = true
                  targetExternalCall = null
                  sipBridgeCall = null

                  val tm = getSystemService(Context.TELECOM_SERVICE) as TelecomManager
                  tm.placeCall(Uri.parse("tel:" + Uri.encode(targetNumber)), Bundle())
              }

              @SuppressLint("MissingPermission")
              private fun dialSipBridgeNumber() {
                  val tm = getSystemService(Context.TELECOM_SERVICE) as TelecomManager
                  tm.placeCall(Uri.parse("tel:" + Uri.encode(sipBridgeDidNumber)), Bundle())
              }

              override fun onCallAdded(call: Call) {
                  super.onCallAdded(call)
                  val number = call.details?.handle?.schemeSpecificPart ?: "Bilinmeyen Numara"

                  if (isOutgoingBridgeMode) {
                      if (targetExternalCall == null) {
                          targetExternalCall = call
                      } else if (sipBridgeCall == null) {
                          sipBridgeCall = call
                      }
                  }

                  call.registerCallback(object : Call.Callback() {
                      override fun onStateChanged(call: Call, state: Int) {
                          when (state) {
                              Call.STATE_ACTIVE -> {
                                  if (isOutgoingBridgeMode) {
                                      if (call == targetExternalCall && sipBridgeCall == null) {
                                          HotspotLanBridge.send("OUTGOING_RINGING_SIP")
                                          dialSipBridgeNumber()
                                      } else if (call == sipBridgeCall && targetExternalCall != null) {
                                          targetExternalCall?.conference(sipBridgeCall)
                                          setMuted(true)
                                          HotspotLanBridge.send("OUTGOING_CONNECTED")
                                      }
                                  }
                              }
                              Call.STATE_DISCONNECTED -> {
                                  if (isOutgoingBridgeMode) {
                                      hangupAllCalls()
                                  } else {
                                      HotspotLanBridge.send("ENDED")
                                  }
                              }
                          }
                      }
                  })

                  if (!isOutgoingBridgeMode && call.state == Call.STATE_RINGING) {
                      val hostContactName = ContactHelper.getContactName(this, number) ?: ""
                      val callerPayload = "$number~$hostContactName"

                      if (HotspotLanBridge.isConnected) {
                          HotspotLanBridge.send("INCOMING", callerPayload)
                      } else {
                          val intent = Intent(this, RemoteCallActivity::class.java).apply {
                              flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                              putExtra("CALLER_NUMBER", callerPayload)
                              putExtra("IS_OUTGOING", false)
                              putExtra("IS_LOCAL_FALLBACK", true)
                          }
                          startActivity(intent)
                      }
                  }
              }

              fun answerLocalCall() {
                  calls.firstOrNull { it.state == Call.STATE_RINGING }
                      ?.answer(VideoProfile.STATE_AUDIO_ONLY)
              }

              fun setLocalSpeaker(enabled: Boolean) {
                  setAudioRoute(if (enabled) CallAudioState.ROUTE_SPEAKER else CallAudioState.ROUTE_EARPIECE)
              }

              fun setLocalMute(muted: Boolean) {
                  setMuted(muted)
              }

              fun hangupAllCalls() {
                  isOutgoingBridgeMode = false
                  setMuted(false)
                  calls.forEach {
                      if (it.state == Call.STATE_RINGING) it.reject(false, null) else it.disconnect()
                  }
                  targetExternalCall = null
                  sipBridgeCall = null
                  HotspotLanBridge.send("ENDED")
              }

              @SuppressLint("MissingPermission")
              fun configureForwarding(context: Context, sipNumber: String, enable: Boolean) {
                  sipBridgeDidNumber = sipNumber
                  val tm = context.getSystemService(Context.TELECOM_SERVICE) as TelecomManager
                  val ussd = if (enable) "*67*$sipNumber#" else "#67#"
                  tm.placeCall(Uri.parse("tel:" + Uri.encode(ussd)), Bundle())
              }
          }
