                                  Toast.makeText(this, "Lütfen alıcı numarası ve mesaj metni girin", Toast.LENGTH_SHORT).show()
                              } else {
                                  sendSmsViaBridgeOrLocal(target, msg)
                              }
                          }
                          .setNeutralButton("Rehberden Seç") { _, _ ->
