              package com.example.remotephone

              import android.annotation.SuppressLint
              import android.app.Notification
              import android.app.NotificationChannel
              import android.app.NotificationManager
              import android.app.PendingIntent
              import android.app.Service
              import android.bluetooth.BluetoothAdapter
              import android.content.BroadcastReceiver
              import android.content.Context
              import android.content.Intent
              import android.content.IntentFilter
              import android.content.pm.ServiceInfo
              import android.media.Ringtone
              import android.media.RingtoneManager
              import android.net.ConnectivityManager
              import android.net.Network
              import android.net.NetworkCapabilities
              import android.net.NetworkRequest
              import android.net.wifi.WifiManager
              import android.os.BatteryManager
              import android.os.Build
              import android.os.IBinder
              import android.os.PowerManager
              import android.os.VibrationEffect
              import android.os.Vibrator
              import androidx.core.app.NotificationCompat
              import androidx.core.app.ServiceCompat
              import java.util.concurrent.CopyOnWriteArrayList

              class BridgeKeepAliveService : Service(), HotspotLanBridge.Listener {

                  companion object {
                      private const val CHANNEL_ID = "RemotePhoneKeepAliveChannel"
                      private const val CALL_CHANNEL_ID = "IncomingRemoteCallChannel"
                      private const val MISSED_CALL_CHANNEL_ID = "MissedRemoteCallChannel"
                      private const val MISSED_CALL_GROUP = "GROUP_MISSED_REMOTE_CALLS"
                      private const val NOTIFICATION_ID = 1001
                      const val CALL_NOTIFICATION_ID = 2002

                      var instance: BridgeKeepAliveService? = null
                      val pendingOfflineMissedCalls = CopyOnWriteArrayList<String>()

                      fun stopIncomingRinging() {
                          instance?.stopRingerAndVibration()
                      }
                  }

                  private var wakeLock: PowerManager.WakeLock? = null
                  private var wifiLock: WifiManager.WifiLock? = null
                  private var multicastLock: WifiManager.MulticastLock? = null
                  private var networkCallback: ConnectivityManager.NetworkCallback? = null
                  private var activeRingtone: Ringtone? = null
                  private var vibrator: Vibrator? = null

                  private val screenWakeReceiver = object : BroadcastReceiver() {
                      override fun onReceive(context: Context?, intent: Intent?) {
                          when (intent?.action) {
                              Intent.ACTION_SCREEN_ON,
                              Intent.ACTION_USER_PRESENT,
                              WifiManager.NETWORK_STATE_CHANGED_ACTION -> {
                                  HotspotLanBridge.triggerScreenWakeRefresh(this@BridgeKeepAliveService)
                              }
                          }
                      }
                  }

                  override fun onCreate() {
                      super.onCreate()
                      instance = this
                      vibrator = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                      createNotificationChannels()
                      acquireHardwareLocks()
                      HotspotLanBridge.addListener(this)

                      val filter = IntentFilter().apply {
                          addAction(Intent.ACTION_SCREEN_ON)
                          addAction(Intent.ACTION_USER_PRESENT)
                          addAction(WifiManager.NETWORK_STATE_CHANGED_ACTION)
                      }
                      registerReceiver(screenWakeReceiver, filter)
                      registerInternetlessWifiWatcher()
                  }

                  // KRİTİK: registerDefaultNetworkCallback yerine İNTERNET ŞARTI ARAMAYAN (removeCapability) Wi-Fi izleyicisi!
                  // Note 10 Lite'ta mobil veri kapalı olsa bile Hotspot bağlandığı milisaniyede tetiklenir.
                  private fun registerInternetlessWifiWatcher() {
                      try {
                          val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                          val req = NetworkRequest.Builder()
                              .addTransportType(NetworkCapabilities.TRANSPORT_WIFI)
                              .removeCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                              .build()

                          val cb = object : ConnectivityManager.NetworkCallback() {
                              override fun onAvailable(network: Network) {
                                  HotspotLanBridge.triggerScreenWakeRefresh(this@BridgeKeepAliveService)
                              }
                              override fun onLost(network: Network) {
                                  HotspotLanBridge.triggerScreenWakeRefresh(this@BridgeKeepAliveService)
                              }
                          }
                          networkCallback = cb
                          cm.registerNetworkCallback(req, cb)
                      } catch (_: Exception) {}
                  }

                  override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                      val prefs = getSharedPreferences("RemotePhonePrefs", Context.MODE_PRIVATE)
                      val mode = intent?.getStringExtra("MODE") ?: prefs.getString("saved_mode", "NONE") ?: "NONE"

                      val roleText = when (mode) {
                          "HOST" -> "1. Telefon (Note 10 Lite Ana Hat) Aktif"
                          "CLIENT" -> "2. Telefon (S25 Ultra Uzak Kontrolcü) Aktif"
                          else -> "Servis Hazır"
                      }

                      val notification: Notification = NotificationCompat.Builder(this, CHANNEL_ID)
                          .setContentTitle("Telefon Köprüsü")
                          .setContentText(roleText)
                          .setSmallIcon(R.drawable.ic_launcher)
                          .setOngoing(true)
                          .setPriority(NotificationCompat.PRIORITY_LOW)
                          .build()

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                          ServiceCompat.startForeground(
                              this,
                              NOTIFICATION_ID,
                              notification,
                              ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                          )
                      } else {
                          startForeground(NOTIFICATION_ID, notification)
                      }

                      if (mode == "HOST") {
                          HotspotLanBridge.startHostServer()
                      } else if (mode == "CLIENT") {
                          HotspotLanBridge.startClientAutoConnect(this)
                      }

                      return START_STICKY
                  }

                  override fun onConnectionChanged(connected: Boolean) {
                      if (connected) {
                          val prefs = getSharedPreferences("RemotePhonePrefs", Context.MODE_PRIVATE)
                          val mode = prefs.getString("saved_mode", "")
                          if (mode == "CLIENT") {
                              HotspotLanBridge.send("REQ_CONTACTS")
                          } else if (mode == "HOST") {
                              sendHostTelemetry()
                              flushPendingOfflineMissedCalls()
                          }
                      }
                  }

                  private fun flushPendingOfflineMissedCalls() {
                      if (pendingOfflineMissedCalls.isNotEmpty() && HotspotLanBridge.isConnected) {
                          val copy = pendingOfflineMissedCalls.toList()
                          pendingOfflineMissedCalls.clear()
                          for (missedPayload in copy) {
                              HotspotLanBridge.send("MISSED", missedPayload)
                          }
                      }
                  }

                  @SuppressLint("MissingPermission")
                  private fun sendHostTelemetry() {
                      try {
                          val bm = getSystemService(Context.BATTERY_SERVICE) as? BatteryManager
                          val pct = bm?.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY) ?: 100
                          val btOn = BluetoothAdapter.getDefaultAdapter()?.isEnabled == true
                          val btText = if (btOn) "Kulaklık: Hazır" else "BT: Kapalı"
                          HotspotLanBridge.send("TELEMETRY", "Note 10 Lite Pil: %$pct | $btText")
                      } catch (_: Exception) {}
                  }

                  fun startRingerAndVibration() {
                      stopRingerAndVibration()
                      try {
                          val uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                          activeRingtone = RingtoneManager.getRingtone(applicationContext, uri)?.apply { play() }
                      } catch (_: Exception) {}
                      try {
                          val pattern = longArrayOf(0, 1000, 1000)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              vibrator?.vibrate(VibrationEffect.createWaveform(pattern, 0))
                          } else {
                              @Suppress("DEPRECATION")
                              vibrator?.vibrate(pattern, 0)
                          }
                      } catch (_: Exception) {}
                  }

                  fun stopRingerAndVibration() {
                      try { activeRingtone?.stop() } catch (_: Exception) {}
                      activeRingtone = null
                      try { vibrator?.cancel() } catch (_: Exception) {}
                  }

                  @SuppressLint("MissingPermission")
                  override fun onEvent(event: String, data: String) {
                      val prefs = getSharedPreferences("RemotePhonePrefs", Context.MODE_PRIVATE)
                      val mode = prefs.getString("saved_mode", "")

                      when (event) {
                          "INCOMING" -> {
                              if (mode == "CLIENT") {
                                  HotspotLanBridge.send("INCOMING_ACK")
                                  startRingerAndVibration()
                                  showIncomingCallNotification(data, isLocalHostFallback = false)
                              }
                          }
                          "CONNECTED" -> {
                              stopRingerAndVibration()
                          }
                          "ENDED" -> {
                              stopRingerAndVibration()
                              val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                              nm.cancel(CALL_NOTIFICATION_ID)
                          }
                          "MISSED" -> {
                              stopRingerAndVibration()
                              val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                              nm.cancel(CALL_NOTIFICATION_ID)
                              if (mode == "CLIENT") {
                                  showMissedCallNotificationOnClient(data)
                              }
                          }
                          "DIAL" -> {
                              if (mode == "HOST" && HostInCallService.instance == null && data.isNotEmpty()) {
                                  HostInCallService.placeSystemCall(this, data)
                              }
                          }
                          "REQ_CONTACTS" -> {
                              if (mode == "HOST") {
                                  val contactsPayload = ContactHelper.serializeContacts(this)
                                  if (contactsPayload.isNotEmpty()) {
                                      HotspotLanBridge.send("RES_CONTACTS", contactsPayload)
                                  }
                                  val logsPayload = ContactHelper.serializeCallLogs(this)
                                  if (logsPayload.isNotEmpty()) {
                                      HotspotLanBridge.send("RES_CALLLOGS", logsPayload)
                                  }
                                  sendHostTelemetry()
                                  flushPendingOfflineMissedCalls()
                              }
                          }
                          "RES_CONTACTS" -> {
                              ContactHelper.updateSyncedContacts(data)
                          }
                          "RES_CALLLOGS" -> {
                              ContactHelper.updateSyncedCallLogs(data)
                          }
                      }
                  }

                  fun showIncomingCallNotification(callerPayload: String, isLocalHostFallback: Boolean) {
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      val (rawNumber, resolvedName) = ContactHelper.resolveCallerInfo(this, callerPayload)
                      val displayTitle = resolvedName ?: rawNumber
                      val displaySubText = if (resolvedName != null) "$rawNumber • Gelen Arama" else "Gelen Arama"

                      val fullScreenIntent = Intent(this, RemoteCallActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                          putExtra("CALLER_NUMBER", callerPayload)
                          putExtra("IS_OUTGOING", false)
                          putExtra("IS_LOCAL_FALLBACK", isLocalHostFallback)
                      }
                      val fullScreenPendingIntent = PendingIntent.getActivity(
                          this, 0, fullScreenIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )

                      val notification = NotificationCompat.Builder(this, CALL_CHANNEL_ID)
                          .setSmallIcon(R.drawable.ic_launcher)
                          .setContentTitle(displayTitle)
                          .setContentText(displaySubText)
                          .setPriority(NotificationCompat.PRIORITY_MAX)
                          .setCategory(NotificationCompat.CATEGORY_CALL)
                          .setFullScreenIntent(fullScreenPendingIntent, true)
                          .setOngoing(true)
                          .setAutoCancel(true)
                          .build()

                      nm.notify(CALL_NOTIFICATION_ID, notification)
                      try {
                          startActivity(fullScreenIntent)
                      } catch (_: Exception) {}
                  }

                  private fun showMissedCallNotificationOnClient(missedPayload: String) {
                      val parts = missedPayload.split("~", limit = 3)
                      val rawNumber = parts.getOrNull(0)?.ifBlank { "Bilinmeyen Numara" } ?: "Bilinmeyen Numara"
                      val hostName = parts.getOrNull(1)?.takeIf { it.isNotBlank() }
                      val timeStr = parts.getOrNull(2)?.takeIf { it.isNotBlank() } ?: ""

                      val localName = ContactHelper.getContactName(this, rawNumber)
                      val finalName = localName ?: hostName
                      val title = if (!finalName.isNullOrBlank()) "Cevapsız Arama: $finalName" else "Cevapsız Arama: $rawNumber"
                      val body = if (!finalName.isNullOrBlank()) {
                          "$rawNumber • Saat: $timeStr"
                      } else {
                          "Numara: $rawNumber • Saat: $timeStr"
                      }

                      ContactHelper.prependLocalMissedCallLog(rawNumber, finalName, timeStr)

                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      val uniqueNotifId = (System.currentTimeMillis() and 0xFFFFFFF).toInt()

                      val openDialerIntent = Intent(this, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                          putExtra("PREFILL_NUMBER", rawNumber)
                      }
                      val contentPendingIntent = PendingIntent.getActivity(
                          this,
                          uniqueNotifId,
                          openDialerIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )

                      val callBackIntent = Intent(this, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                          putExtra("PREFILL_NUMBER", rawNumber)
                          putExtra("AUTO_CALL_FROM_NOTIFICATION", true)
                      }
                      val callBackPendingIntent = PendingIntent.getActivity(
                          this,
                          uniqueNotifId + 1,
                          callBackIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )

                      val missedNotification = NotificationCompat.Builder(this, MISSED_CALL_CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.sym_call_missed)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setStyle(NotificationCompat.BigTextStyle().bigText("$body\nNumarayı geri aramak için dokunun."))
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setCategory(NotificationCompat.CATEGORY_MISSED_CALL)
                          .setContentIntent(contentPendingIntent)
                          .setAutoCancel(true)
                          .setGroup(MISSED_CALL_GROUP)
                          .addAction(android.R.drawable.sym_action_call, "Geri Ara", callBackPendingIntent)
                          .build()

                      nm.notify(uniqueNotifId, missedNotification)
                  }

                  private fun acquireHardwareLocks() {
                      val powerManager = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wakeLock = powerManager.newWakeLock(
                          PowerManager.PARTIAL_WAKE_LOCK,
                          "RemotePhone::BridgeWakeLock"
                      ).apply {
                          setReferenceCounted(false)
                          acquire()
                      }

                      val wifiManager = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                      val lockMode = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          WifiManager.WIFI_MODE_FULL_LOW_LATENCY
                      } else {
                          @Suppress("DEPRECATION")
                          WifiManager.WIFI_MODE_FULL_HIGH_PERF
                      }
                      wifiLock = wifiManager.createWifiLock(lockMode, "RemotePhone::BridgeWifiLock").apply {
                          setReferenceCounted(false)
                          acquire()
                      }

                      // İnternetsiz Hotspot / Wi-Fi ağlarında UDP Broadcast keşfinin engellenmemesi için MulticastLock
                      try {
                          multicastLock = wifiManager.createMulticastLock("RemotePhone::MulticastLock").apply {
                              setReferenceCounted(false)
                              acquire()
                          }
                      } catch (_: Exception) {}
                  }

                  override fun onDestroy() {
                      stopRingerAndVibration()
                      HotspotLanBridge.removeListener(this)
                      try { unregisterReceiver(screenWakeReceiver) } catch (_: Exception) {}
                      try {
                          val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                          networkCallback?.let { cm.unregisterNetworkCallback(it) }
                      } catch (_: Exception) {}
                      try {
                          if (wakeLock?.isHeld == true) wakeLock?.release()
                          if (wifiLock?.isHeld == true) wifiLock?.release()
                          if (multicastLock?.isHeld == true) multicastLock?.release()
                      } catch (_: Exception) {}
                      instance = null
                      super.onDestroy()
                  }

                  override fun onBind(intent: Intent?): IBinder? = null

                  private fun createNotificationChannels() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val nm = getSystemService(NotificationManager::class.java)
                          nm.createNotificationChannel(
                              NotificationChannel(
                                  CHANNEL_ID,
                                  "Arka Plan Bağlantı Servisi",
                                  NotificationManager.IMPORTANCE_LOW
                              )
                          )
                          nm.createNotificationChannel(
                              NotificationChannel(
                                  CALL_CHANNEL_ID,
                                  "Gelen Çağrı Uyarıları",
                                  NotificationManager.IMPORTANCE_HIGH
                              ).apply {
                                  lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                              }
                          )
                          nm.createNotificationChannel(
                              NotificationChannel(
                                  MISSED_CALL_CHANNEL_ID,
                                  "Cevapsız Çağrı Bildirimleri",
                                  NotificationManager.IMPORTANCE_HIGH
                              ).apply {
                                  description = "Cevaplanmayan çağrıları bildirim kutusunda gösterir"
                                  lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                              }
                          )
                      }
                  }
              }
          """)

