                          "$title • ${item.timeText}" + NL + item.body
                      }
                      listView.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, displayRows)

                      listView.setOnItemClickListener { _, _, position, _ ->
                          val selected = smsItems.getOrNull(position) ?: return@setOnItemClickListener
                          etRecipient.setText(selected.senderNumber)
                          etDialNumber.setText(selected.senderNumber)
                          val name = selected.senderName ?: ContactHelper.getContactName(this, selected.senderNumber)
                          tvResolvedRecipient.text = if (!name.isNullOrBlank()) "Kişi: $name" else "Numara: ${selected.senderNumber}"
                      }

                      container.addView(etRecipient)
                      container.addView(tvResolvedRecipient)
                      container.addView(etMessageBody)
                      container.addView(tvHistoryHeader)
                      container.addView(listView)

                      AlertDialog.Builder(this)
                          .setTitle("💬 SMS Gönder & Gelen Kutusu")
                          .setView(container)
                          .setPositiveButton("Gönder") { _, _ ->
                              val target = etRecipient.text.toString().trim()
                              val msg = etMessageBody.text.toString().trim()
