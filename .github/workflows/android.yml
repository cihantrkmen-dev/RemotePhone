          write_file("app/src/main/java/com/example/remotephone/ContactHelper.kt", r"""
              package com.example.remotephone

              import android.Manifest
              import android.content.Context
              import android.content.pm.PackageManager
              import android.net.Uri
              import android.provider.ContactsContract
              import androidx.core.content.ContextCompat

              data class ContactItem(val name: String, val number: String)

              object ContactHelper {
                  @Volatile
                  var syncedHostContacts: List<ContactItem> = emptyList()

                  fun getContactName(context: Context, phoneNumber: String): String? {
                      val cleanNumber = phoneNumber.trim()
                      if (cleanNumber.isEmpty()) return null
                      if (ContextCompat.checkSelfPermission(context, Manifest.permission.READ_CONTACTS)
                          == PackageManager.PERMISSION_GRANTED
                      ) {
                          try {
                              val uri = Uri.withAppendedPath(
                                  ContactsContract.PhoneLookup.CONTENT_FILTER_URI,
                                  Uri.encode(cleanNumber)
                              )
                              val projection = arrayOf(ContactsContract.PhoneLookup.DISPLAY_NAME)
                              context.contentResolver.query(uri, projection, null, null, null)?.use { cursor ->
                                  if (cursor.moveToFirst()) return cursor.getString(0)
                              }
                          } catch (_: Exception) {}
                      }
                      val normalizedTarget = cleanNumber.filter { it.isDigit() }.takeLast(10)
                      if (normalizedTarget.length >= 7) {
                          syncedHostContacts.firstOrNull {
                              it.number.filter { c -> c.isDigit() }.takeLast(10) == normalizedTarget
                          }?.let { return it.name }
                      }
                      return null
                  }

                  fun getAllContacts(context: Context): List<ContactItem> {
                      val map = linkedMapOf<String, ContactItem>()
                      if (ContextCompat.checkSelfPermission(context, Manifest.permission.READ_CONTACTS)
                          == PackageManager.PERMISSION_GRANTED
                      ) {
                          try {
                              val projection = arrayOf(
                                  ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                                  ContactsContract.CommonDataKinds.Phone.NUMBER
                              )
                              context.contentResolver.query(
                                  ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                                  projection,
                                  null,
                                  null,
                                  ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " ASC"
                              )?.use { cursor ->
                                  val nameIdx = cursor.getColumnIndex(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME)
                                  val numIdx = cursor.getColumnIndex(ContactsContract.CommonDataKinds.Phone.NUMBER)
                                  while (cursor.moveToNext()) {
                                      val name = if (nameIdx >= 0) cursor.getString(nameIdx) ?: "" else ""
                                      val rawNum = if (numIdx >= 0) cursor.getString(numIdx) ?: "" else ""
                                      val cleanNum = rawNum.replace(" ", "").replace("-", "")
                                      if (name.isNotBlank() && cleanNum.isNotBlank()) {
                                          val key = cleanNum.filter { it.isDigit() }.takeLast(10).ifEmpty { cleanNum }
                                          if (!map.containsKey(key)) {
                                              map[key] = ContactItem(name.trim(), cleanNum)
                                          }
                                      }
                                  }
                              }
                          } catch (_: Exception) {}
                      }
                      for (item in syncedHostContacts) {
                          val key = item.number.filter { it.isDigit() }.takeLast(10).ifEmpty { item.number }
                          if (!map.containsKey(key)) {
                              map[key] = item
                          }
                      }
                      return map.values.sortedBy { it.name.lowercase() }
                  }

                  fun serializeContacts(context: Context): String {
                      return getAllContacts(context).take(500).joinToString(";") { item ->
                          val safeName = item.name.replace(";", " ").replace("~", " ").replace("|", " ")
                          val safeNum = item.number.replace(";", "").replace("~", "").replace("|", "")
                          "$safeName~$safeNum"
                      }
                  }

                  fun updateSyncedContacts(serialized: String) {
                      if (serialized.isBlank()) return
                      val list = mutableListOf<ContactItem>()
                      for (entry in serialized.split(";")) {
                          val parts = entry.split("~", limit = 2)
                          if (parts.size == 2 && parts[0].isNotBlank() && parts[1].isNotBlank()) {
                              list.add(ContactItem(parts[0], parts[1]))
                          }
                      }
                      if (list.isNotEmpty()) {
                          syncedHostContacts = list
                      }
                  }

                  fun resolveCallerInfo(context: Context, payload: String): Pair<String, String?> {
                      val parts = payload.split("~", limit = 2)
                      val rawNumber = parts[0].ifBlank { "Bilinmeyen Numara" }
                      val hostName = parts.getOrNull(1)?.takeIf { it.isNotBlank() }
                      val localName = getContactName(context, rawNumber)
                      return Pair(rawNumber, localName ?: hostName)
                  }
              }
          """)

          write_file("app/src/main/java/com/example/remotephone/HotspotLanBridge.kt", r"""
              package com.example.remotephone

              import android.content.Context
              import android.net.ConnectivityManager
              import android.net.LinkProperties
              import kotlinx.coroutines.*
              import java.io.BufferedReader
              import java.io.InputStreamReader
              import java.io.PrintWriter
              import java.net.ServerSocket
              import java.net.Socket
              import java.util.concurrent.CopyOnWriteArraySet

              object HotspotLanBridge {
                  private const val PORT = 8989
                  private const val SOCKET_TIMEOUT_MS = 12_000
                  private const val HEARTBEAT_INTERVAL_MS = 5_000L

                  interface Listener {
                      fun onEvent(event: String, data: String) {}
                      fun onConnectionChanged(connected: Boolean) {}
                  }

                  private val listeners = CopyOnWriteArraySet<Listener>()
                  private val scope = CoroutineScope(Dispatchers.IO + SupervisorJob())
                  private val mainScope = CoroutineScope(Dispatchers.Main + SupervisorJob())
                  private var serverSocket: ServerSocket? = null
                  private var currentSocket: Socket? = null
                  private var writer: PrintWriter? = null
                  private var activeJob: Job? = null

                  @Volatile
                  var isConnected: Boolean = false
                      private set

                  fun addListener(listener: Listener) {
                      listeners.add(listener)
                      listener.onConnectionChanged(isConnected)
                  }

                  fun removeListener(listener: Listener) {
                      listeners.remove(listener)
                  }

                  fun startHostServer() {
                      stop()
                      activeJob = scope.launch {
                          while (isActive) {
                              try {
                                  serverSocket = ServerSocket(PORT).apply { reuseAddress = true }
                                  while (isActive) {
                                      val client = serverSocket!!.accept()
                                      handleSocket(client)
                                  }
                              } catch (_: Exception) {
                                  delay(1500)
                              } finally {
                                  try { serverSocket?.close() } catch (_: Exception) {}
                              }
                          }
                      }
                  }

                  fun startClientAutoConnect(context: Context) {
                      stop()
                      val appCtx = context.applicationContext
                      activeJob = scope.launch {
                          while (isActive) {
                              try {
                                  val hostIp = getHotspotGatewayIp(appCtx)
                                  if (!hostIp.isNullOrEmpty()) {
                                      val socket = Socket(hostIp, PORT)
                                      handleSocket(socket)
                                  }
                              } catch (_: Exception) {
                                  notifyConnection(false)
                              }
                              delay(2000)
                          }
                      }
                  }

                  fun stop() {
                      activeJob?.cancel()
                      try { currentSocket?.close() } catch (_: Exception) {}
                      try { serverSocket?.close() } catch (_: Exception) {}
                      notifyConnection(false)
                  }

                  private suspend fun handleSocket(socket: Socket) {
                      try { currentSocket?.close() } catch (_: Exception) {}
                      currentSocket = socket
                      socket.keepAlive = true
                      socket.tcpNoDelay = true
                      socket.soTimeout = SOCKET_TIMEOUT_MS

                      writer = PrintWriter(socket.getOutputStream(), true)
                      val reader = BufferedReader(InputStreamReader(socket.inputStream))
                      notifyConnection(true)

                      val heartbeatJob = scope.launch {
                          while (isActive && !socket.isClosed) {
                              try {
                                  writer?.println("PING|")
                                  if (writer?.checkError() == true) {
                                      socket.close()
                                      break
                                  }
                              } catch (_: Exception) {
                                  socket.close()
                                  break
                              }
                              delay(HEARTBEAT_INTERVAL_MS)
                          }
                      }

                      try {
                          while (!socket.isClosed) {
                              val line = reader.readLine() ?: break
                              val parts = line.split("|", limit = 2)
                              val event = parts[0]
                              val data = parts.getOrElse(1) { "" }

                              when (event) {
                                  "PING" -> writer?.println("PONG|")
                                  "PONG" -> {}
                                  else -> notifyEvent(event, data)
                              }
                          }
                      } catch (_: Exception) {
                      } finally {
                          heartbeatJob.cancel()
                          writer = null
                          try { socket.close() } catch (_: Exception) {}
                          notifyConnection(false)
                      }
                  }

                  fun send(event: String, data: String = "") {
                      scope.launch {
                          try {
                              writer?.println("$event|$data")
                          } catch (_: Exception) {}
                      }
                  }

                  private fun notifyEvent(event: String, data: String) {
                      mainScope.launch {
                          for (listener in listeners) listener.onEvent(event, data)
                      }
                  }

                  private fun notifyConnection(connected: Boolean) {
                      isConnected = connected
                      mainScope.launch {
                          for (listener in listeners) listener.onConnectionChanged(connected)
                      }
                  }

                  private fun getHotspotGatewayIp(context: Context): String? {
                      val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      val network = cm.activeNetwork ?: return "192.168.43.1"
                      val linkProps: LinkProperties = cm.getLinkProperties(network) ?: return "192.168.43.1"
                      for (route in linkProps.routes) {
                          if (route.isDefaultRoute && route.gateway != null) {
                              val ip = route.gateway?.hostAddress
                              if (!ip.isNullOrEmpty() && ip != "0.0.0.0") return ip
                          }
                      }
                      return "192.168.43.1"
                  }
              }
          """)

          write_file("app/src/main/java/com/example/remotephone/SipAudioEngine.kt", r"""
              package com.example.remotephone

              import android.annotation.SuppressLint
              import android.content.Context
              import android.media.*
              import kotlinx.coroutines.*
              import java.net.DatagramPacket
              import java.net.DatagramSocket
              import java.net.InetAddress
              import java.security.MessageDigest
              import java.util.UUID

              object SipAudioEngine {
                  private var appContext: Context? = null
                  private val scope = CoroutineScope(Dispatchers.IO + SupervisorJob())
                  private var sipJob: Job? = null
                  private var rtpJob: Job? = null
                  private var sipSocket: DatagramSocket? = null
                  private var rtpSocket: DatagramSocket? = null

                  private val CRLF = "" + Char(13) + Char(10)
                  private val Q = Char(34)

                  @Volatile
                  var awaitingAutoAnswer = false
                  @Volatile
                  private var isCallActive = false
                  @Volatile
                  private var isMicMuted = false

                  var onCallConnected: (() -> Unit)? = null
                  var onCallTerminated: (() -> Unit)? = null

                  private fun extractQuoted(text: String, key: String): String? {
                      val prefix = "$key=$Q"
                      val start = text.indexOf(prefix)
                      if (start == -1) return null
                      val valStart = start + prefix.length
                      val end = text.indexOf(Q, valStart)
                      return if (end != -1) text.substring(valStart, end) else null
                  }

                  @Synchronized
                  fun initAndRegister(
                      context: Context,
                      sipUsername: String,
                      sipPassword: String,
                      sipDomain: String
                  ) {
                      if (sipUsername.isEmpty() || sipDomain.isEmpty()) return
                      appContext = context.applicationContext
                      sipJob?.cancel()

                      sipJob = scope.launch {
                          try {
                              sipSocket?.close()
                              val socket = DatagramSocket()
                              sipSocket = socket
                              val serverIp = InetAddress.getByName(sipDomain.substringBefore(":"))
                              val serverPort = sipDomain.substringAfter(":", "5060").toIntOrNull() ?: 5060
                              val callId = UUID.randomUUID().toString()
                              var cseq = 1

                              fun sendSip(msg: String) {
                                  val bytes = msg.toByteArray()
                                  socket.send(DatagramPacket(bytes, bytes.size, serverIp, serverPort))
                              }

                              fun buildRegister(authHeader: String = ""): String {
                                  val branch = "z9hG4bK" + UUID.randomUUID().toString().take(8)
                                  return "REGISTER sip:$sipDomain SIP/2.0" + CRLF +
                                      "Via: SIP/2.0/UDP 0.0.0.0:${socket.localPort};rport;branch=$branch" + CRLF +
                                      "Max-Forwards: 70" + CRLF +
                                      "From: <sip:$sipUsername@$sipDomain>;tag=remphone" + CRLF +
                                      "To: <sip:$sipUsername@$sipDomain>" + CRLF +
                                      "Call-ID: $callId" + CRLF +
                                      "CSeq: ${cseq++} REGISTER" + CRLF +
                                      "Contact: <sip:$sipUsername@0.0.0.0:${socket.localPort}>" + CRLF +
                                      "Expires: 300" + CRLF +
                                      authHeader +
                                      "Content-Length: 0" + CRLF + CRLF
                              }

                              launch {
                                  while (isActive) {
                                      try { sendSip(buildRegister()) } catch (_: Exception) {}
                                      delay(45_000)
                                  }
                              }

                              val buf = ByteArray(4096)
                              while (isActive) {
                                  val packet = DatagramPacket(buf, buf.size)
                                  socket.receive(packet)
                                  val text = String(packet.data, 0, packet.length)

                                  if (text.startsWith("SIP/2.0 401") || text.startsWith("SIP/2.0 407")) {
                                      val realm = extractQuoted(text, "realm") ?: sipDomain
                                      val nonce = extractQuoted(text, "nonce") ?: ""
                                      val ha1 = md5("$sipUsername:$realm:$sipPassword")
                                      val ha2 = md5("REGISTER:sip:$sipDomain")
                                      val resp = md5("$ha1:$nonce:$ha2")
                                      val hdrName = if (text.startsWith("SIP/2.0 407")) "Proxy-Authorization" else "Authorization"
                                      val auth = "$hdrName: Digest username=${Q}$sipUsername${Q}, realm=${Q}$realm${Q}, nonce=${Q}$nonce${Q}, uri=${Q}sip:$sipDomain${Q}, response=${Q}$resp${Q}, algorithm=MD5" + CRLF
                                      sendSip(buildRegister(auth))
                                  } else if (text.startsWith("INVITE ")) {
                                      if (awaitingAutoAnswer) {
                                          awaitingAutoAnswer = false
                                          val via = text.lines().firstOrNull { it.startsWith("Via:", true) } ?: ""
                                          val from = text.lines().firstOrNull { it.startsWith("From:", true) } ?: ""
                                          val to = text.lines().firstOrNull { it.startsWith("To:", true) } ?: ""
                                          val cid = text.lines().firstOrNull { it.startsWith("Call-ID:", true) } ?: ""
                                          val cs = text.lines().firstOrNull { it.startsWith("CSeq:", true) } ?: ""

                                          val audioLine = text.lines().firstOrNull { it.startsWith("m=audio ") } ?: ""
                                          val remoteRtpPort = audioLine.split(" ").getOrNull(1)?.toIntOrNull() ?: 10000
                                          val cLine = text.lines().firstOrNull { it.startsWith("c=IN IP4 ") } ?: ""
                                          val remoteRtpIp = cLine.substringAfter("c=IN IP4 ").trim().ifEmpty { serverIp.hostAddress ?: "127.0.0.1" }

                                          rtpSocket?.close()
                                          val rtp = DatagramSocket()
                                          rtpSocket = rtp

                                          val sdp = "v=0" + CRLF +
                                              "o=- 1 1 IN IP4 0.0.0.0" + CRLF +
                                              "s=-" + CRLF +
                                              "c=IN IP4 0.0.0.0" + CRLF +
                                              "t=0 0" + CRLF +
                                              "m=audio ${rtp.localPort} RTP/AVP 8 0" + CRLF +
                                              "a=rtpmap:8 PCMA/8000" + CRLF +
                                              "a=rtpmap:0 PCMU/8000" + CRLF
                                          val ok = "SIP/2.0 200 OK" + CRLF +
                                              via + CRLF +
                                              from + CRLF +
                                              "$to;tag=srv1" + CRLF +
                                              cid + CRLF +
                                              cs + CRLF +
                                              "Content-Type: application/sdp" + CRLF +
                                              "Content-Length: ${sdp.length}" + CRLF + CRLF + sdp
                                          sendSip(ok)
                                          startRtpAudioStream(rtp, InetAddress.getByName(remoteRtpIp), remoteRtpPort)
                                          onCallConnected?.invoke()
                                      }
                                  } else if (text.startsWith("BYE ")) {
                                      terminateAudioCall()
                                      onCallTerminated?.invoke()
                                  }
                              }
                          } catch (_: Exception) {}
                      }
                  }

                  @SuppressLint("MissingPermission")
                  private fun startRtpAudioStream(socket: DatagramSocket, remoteIp: InetAddress, remotePort: Int) {
                      isCallActive = true
                      rtpJob?.cancel()
                      rtpJob = scope.launch {
                          val sampleRate = 8000
                          val minBuf = AudioRecord.getMinBufferSize(sampleRate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                          val recorder = AudioRecord(MediaRecorder.AudioSource.VOICE_COMMUNICATION, sampleRate, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT, minBuf)
                          val player = AudioTrack.Builder()
                              .setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_VOICE_COMMUNICATION).setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build())
                              .setAudioFormat(AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(sampleRate).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                              .setBufferSizeInBytes(minBuf)
                              .build()

                          recorder.startRecording()
                          player.play()

                          launch {
                              var seq = 0
                              var ts = 0
                              val pcmBuf = ShortArray(160)
                              val rtpBuf = ByteArray(172)
                              while (isActive && isCallActive) {
                                  val read = recorder.read(pcmBuf, 0, 160)
                                  if (read > 0 && !isMicMuted) {
                                      rtpBuf[0] = 0x80.toByte()
                                      rtpBuf[1] = 8.toByte()
                                      rtpBuf[2] = (seq shr 8).toByte()
                                      rtpBuf[3] = seq.toByte()
                                      rtpBuf[4] = (ts shr 24).toByte()
                                      rtpBuf[5] = (ts shr 16).toByte()
                                      rtpBuf[6] = (ts shr 8).toByte()
                                      rtpBuf[7] = ts.toByte()
                                      for (i in 0 until 160) {
                                          rtpBuf[12 + i] = linearToAlaw(pcmBuf[i])
                                      }
                                      try { socket.send(DatagramPacket(rtpBuf, rtpBuf.size, remoteIp, remotePort)) } catch (_: Exception) {}
                                      seq++
                                      ts += 160
                                  }
                              }
                          }

                          try {
                              val inBuf = ByteArray(512)
                              val outPcm = ShortArray(160)
                              while (isActive && isCallActive) {
                                  val pkt = DatagramPacket(inBuf, inBuf.size)
                                  socket.receive(pkt)
                                  if (pkt.length > 12) {
                                      val payloadLen = minOf(pkt.length - 12, 160)
                                      for (i in 0 until payloadLen) {
                                          outPcm[i] = alawToLinear(inBuf[12 + i])
                                      }
                                      player.write(outPcm, 0, payloadLen)
                                  }
                              }
                          } catch (_: Exception) {
                          } finally {
                              try { recorder.stop(); recorder.release() } catch (_: Exception) {}
                              try { player.stop(); player.release() } catch (_: Exception) {}
                          }
                      }
                  }

                  private fun linearToAlaw(pcmVal: Short): Byte {
                      var pcm = pcmVal.toInt()
                      val mask: Int
                      if (pcm >= 0) { mask = 0xD5 } else { mask = 0x55; pcm = -pcm - 1 }
                      if (pcm > 32635) pcm = 32635
                      val exp: Int
                      val mant: Int
                      if (pcm >= 256) {
                          var seg = 0
                          var v = pcm shr 8
                          while (v > 1) { v = v shr 1; seg++ }
                          exp = seg + 1
                          mant = (pcm shr (seg + 3)) and 0x0F
                      } else {
                          exp = 0
                          mant = pcm shr 4
                      }
                      return ((exp shl 4 or mant) xor mask).toByte()
                  }

                  private fun alawToLinear(alawByte: Byte): Short {
                      val a = alawByte.toInt() xor 0x55
                      var t = (a and 0x0F) shl 4
                      val seg = (a and 0x70) shr 4
                      when (seg) {
                          0 -> t += 8
                          1 -> t += 0x108
                          else -> { t += 0x108; t = t shl (seg - 1) }
                      }
                      return (if ((a and 0x80) != 0) t else -t).toShort()
                  }

                  private fun md5(input: String): String {
                      val bytes = MessageDigest.getInstance("MD5").digest(input.toByteArray())
                      return bytes.joinToString("") { "%02x".format(it) }
                  }

                  fun prepareForIncomingAudio() {
                      awaitingAutoAnswer = true
                  }

                  fun terminateAudioCall() {
                      awaitingAutoAnswer = false
                      isCallActive = false
                      setSpeakerphone(false)
                      rtpJob?.cancel()
                      try { rtpSocket?.close() } catch (_: Exception) {}
                  }

                  fun sendDtmf(digit: Char) {}

                  fun setMuted(muted: Boolean) {
                      isMicMuted = muted
                  }

                  fun setSpeakerphone(enabled: Boolean) {
                      val am = appContext?.getSystemService(Context.AUDIO_SERVICE) as? AudioManager ?: return
                      am.mode = AudioManager.MODE_IN_COMMUNICATION
                      am.isSpeakerphoneOn = enabled
                  }
              }
          """)

