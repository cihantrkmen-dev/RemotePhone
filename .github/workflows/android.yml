          write_file("app/src/main/java/com/example/remotephone/BluetoothMonitor.kt", r"""
              package com.example.remotephone

              import android.annotation.SuppressLint
              import android.bluetooth.BluetoothAdapter
              import android.bluetooth.BluetoothDevice
              import android.bluetooth.BluetoothHeadset
              import android.bluetooth.BluetoothProfile
              import android.content.BroadcastReceiver
              import android.content.Context
              import android.content.Intent
              import android.content.IntentFilter
              import android.media.AudioDeviceInfo
              import android.media.AudioManager
              import java.util.concurrent.CopyOnWriteArraySet

              data class HeadsetStatus(
                  val isReady: Boolean,
                  val batteryPercent: Int,
                  val deviceName: String?,
                  val summaryText: String
              )

              object BluetoothMonitor {
                  interface Listener {
                      fun onHeadsetStateChanged(status: HeadsetStatus)
                  }

                  private val listeners = CopyOnWriteArraySet<Listener>()

                  @Volatile
                  private var headsetProxy: BluetoothHeadset? = null
                  @Volatile
                  private var lastKnownBattery: Int = -1
                  @Volatile
                  var hostHeadsetReady: Boolean = true
                  @Volatile
                  var hostHeadsetSummary: String = "Kulaklık: Kontrol Ediliyor"

                  private var isInitialized = false

                  fun addListener(listener: Listener) {
                      listeners.add(listener)
                  }

                  fun removeListener(listener: Listener) {
                      listeners.remove(listener)
                  }

                  private fun notifyListeners(context: Context) {
                      val status = getLocalHeadsetStatus(context)
                      for (l in listeners) {
                          try {
                              l.onHeadsetStateChanged(status)
                          } catch (_: Exception) {}
                      }
                  }

                  @SuppressLint("MissingPermission")
                  fun init(context: Context) {
                      if (isInitialized) return
                      isInitialized = true
                      val appCtx = context.applicationContext

                      try {
                          val adapter = BluetoothAdapter.getDefaultAdapter()
                          adapter?.getProfileProxy(appCtx, object : BluetoothProfile.ServiceListener {
                              override fun onServiceConnected(profile: Int, proxy: BluetoothProfile?) {
                                  if (profile == BluetoothProfile.HEADSET) {
                                      headsetProxy = proxy as? BluetoothHeadset
                                      notifyListeners(appCtx)
                                  }
                              }
                              override fun onServiceDisconnected(profile: Int) {
                                  if (profile == BluetoothProfile.HEADSET) {
                                      headsetProxy = null
                                      notifyListeners(appCtx)
                                  }
                              }
                          }, BluetoothProfile.HEADSET)
                      } catch (_: Exception) {}

                      try {
                          val filter = IntentFilter().apply {
                              addAction(BluetoothHeadset.ACTION_CONNECTION_STATE_CHANGED)
                              addAction(BluetoothDevice.ACTION_ACL_CONNECTED)
                              addAction(BluetoothDevice.ACTION_ACL_DISCONNECTED)
                              addAction("android.bluetooth.device.action.BATTERY_LEVEL_CHANGED")
                          }
                          appCtx.registerReceiver(object : BroadcastReceiver() {
                              override fun onReceive(ctx: Context?, intent: Intent?) {
                                  if (intent?.action == "android.bluetooth.device.action.BATTERY_LEVEL_CHANGED") {
                                      val level = intent.getIntExtra("android.bluetooth.device.extra.BATTERY_LEVEL", -1)
                                      if (level in 0..100) {
                                          lastKnownBattery = level
                                      }
                                  }
                                  if (ctx != null) {
                                      notifyListeners(ctx)
                                  }
                              }
                          }, filter)
                      } catch (_: Exception) {}
                  }

                  @SuppressLint("MissingPermission")
                  fun getLocalHeadsetStatus(context: Context): HeadsetStatus {
                      var connected = false
                      var name: String? = null
                      var battery = lastKnownBattery

                      try {
                          val adapter = BluetoothAdapter.getDefaultAdapter()
                          if (adapter != null && adapter.isEnabled) {
                              val devices = headsetProxy?.connectedDevices.orEmpty()
                              if (devices.isNotEmpty()) {
                                  connected = true
                                  val dev = devices.first()
                                  name = dev.name
                                  val reflectedBat = readBatteryLevelViaReflection(dev)
                                  if (reflectedBat in 0..100) {
                                      battery = reflectedBat
                                      lastKnownBattery = reflectedBat
                                  }
                              }
                          }
                      } catch (_: Exception) {}

                      if (!connected) {
                          try {
                              val am = context.getSystemService(Context.AUDIO_SERVICE) as? AudioManager
                              val outDevices = am?.getDevices(AudioManager.GET_DEVICES_OUTPUTS).orEmpty()
                              val btAudio = outDevices.firstOrNull {
                                  it.type == AudioDeviceInfo.TYPE_BLUETOOTH_SCO ||
                                  it.type == AudioDeviceInfo.TYPE_BLE_HEADSET ||
                                  it.type == AudioDeviceInfo.TYPE_BLUETOOTH_A2DP
                              }
                              if (btAudio != null) {
                                  connected = true
                                  name = btAudio.productName?.toString()
                              }
                          } catch (_: Exception) {}
                      }

                      if (!connected) {
                          return HeadsetStatus(
                              isReady = false,
                              batteryPercent = -1,
                              deviceName = null,
                              summaryText = "⚠️ Kulaklık: Bağlı Değil"
                          )
                      }

                      val summary = when {
                          battery in 0..20 -> "⚠️ Kulaklık: Hazır (%$battery - Düşük)"
                          battery in 21..100 -> "Kulaklık: Hazır (%$battery)"
                          else -> "Kulaklık: Hazır"
                      }

                      return HeadsetStatus(
                          isReady = true,
                          batteryPercent = battery,
                          deviceName = name,
                          summaryText = summary
                      )
                  }

                  private fun readBatteryLevelViaReflection(device: BluetoothDevice): Int {
                      return try {
                          val method = device.javaClass.getMethod("getBatteryLevel")
                          (method.invoke(device) as? Int) ?: -1
                      } catch (_: Exception) {
                          -1
                      }
                  }

                  fun isAnyHeadsetReady(context: Context): Boolean {
                      val local = getLocalHeadsetStatus(context)
                      return local.isReady || hostHeadsetReady
                  }

                  fun getCombinedHeadsetSummary(context: Context): String {
                      val local = getLocalHeadsetStatus(context)
                      if (local.isReady && local.batteryPercent in 0..100 && !hostHeadsetSummary.contains("%")) {
                          return local.summaryText
                      }
                      if (hostHeadsetReady) {
                          return hostHeadsetSummary
                      }
                      return local.summaryText
                  }
              }
          """)

          write_file("app/src/main/java/com/example/remotephone/ContactHelper.kt", r"""
              package com.example.remotephone

              import android.Manifest
              import android.content.Context
              import android.content.pm.PackageManager
              import android.net.Uri
              import android.provider.CallLog
              import android.provider.ContactsContract
              import androidx.core.content.ContextCompat
              import java.text.SimpleDateFormat
              import java.util.Date
              import java.util.Locale

              data class ContactItem(val name: String, val number: String)
              data class CallLogItem(val name: String, val number: String, val type: String, val timeText: String)
              data class SmsLogItem(val senderNumber: String, val senderName: String?, val body: String, val timeText: String)

              object ContactHelper {
                  @Volatile
                  var syncedHostContacts: List<ContactItem> = emptyList()

                  @Volatile
                  var syncedHostCallLogs: List<CallLogItem> = emptyList()

                  @Volatile
                  var recentSmsMessages: List<SmsLogItem> = emptyList()

                  fun addRecentSms(senderNumber: String, senderName: String?, body: String, timeText: String) {
                      val item = SmsLogItem(senderNumber, senderName, body, timeText)
                      val updated = mutableListOf(item)
                      updated.addAll(recentSmsMessages.take(49))
                      recentSmsMessages = updated
                  }

                  fun getContactName(context: Context, phoneNumber: String): String? {
                      val cleanNumber = phoneNumber.trim()
                      if (cleanNumber.isEmpty()) return null
                      if (ContextCompat.checkSelfPermission(context, Manifest.permission.READ_CONTACTS)
                          == PackageManager.PERMISSION_GRANTED
                      ) {
                          try {
                              val uri = Uri.withAppendedPath(
                                  ContactsContract.PhoneLookup.CONTENT_FILTER_URI,
                                  Uri.encode(cleanNumber)
                              )
                              val projection = arrayOf(ContactsContract.PhoneLookup.DISPLAY_NAME)
                              context.contentResolver.query(uri, projection, null, null, null)?.use { cursor ->
                                  if (cursor.moveToFirst()) return cursor.getString(0)
                              }
                          } catch (_: Exception) {}
                      }
                      val normalizedTarget = cleanNumber.filter { it.isDigit() }.takeLast(10)
                      if (normalizedTarget.length >= 7) {
                          syncedHostContacts.firstOrNull {
                              it.number.filter { c -> c.isDigit() }.takeLast(10) == normalizedTarget
                          }?.let { return it.name }
                      }
                      return null
                  }

                  fun getAllContacts(context: Context): List<ContactItem> {
                      val map = linkedMapOf<String, ContactItem>()
                      if (ContextCompat.checkSelfPermission(context, Manifest.permission.READ_CONTACTS)
                          == PackageManager.PERMISSION_GRANTED
                      ) {
                          try {
                              val projection = arrayOf(
                                  ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                                  ContactsContract.CommonDataKinds.Phone.NUMBER
                              )
                              context.contentResolver.query(
                                  ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                                  projection,
                                  null,
                                  null,
                                  ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " ASC"
                              )?.use { cursor ->
                                  val nameIdx = cursor.getColumnIndex(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME)
                                  val numIdx = cursor.getColumnIndex(ContactsContract.CommonDataKinds.Phone.NUMBER)
                                  while (cursor.moveToNext()) {
                                      val name = if (nameIdx >= 0) cursor.getString(nameIdx) ?: "" else ""
                                      val rawNum = if (numIdx >= 0) cursor.getString(numIdx) ?: "" else ""
                                      val cleanNum = rawNum.replace(" ", "").replace("-", "")
                                      if (name.isNotBlank() && cleanNum.isNotBlank()) {
                                          val key = cleanNum.filter { it.isDigit() }.takeLast(10).ifEmpty { cleanNum }
                                          if (!map.containsKey(key)) {
                                              map[key] = ContactItem(name.trim(), cleanNum)
                                          }
                                      }
                                  }
                              }
                          } catch (_: Exception) {}
                      }
                      for (item in syncedHostContacts) {
                          val key = item.number.filter { it.isDigit() }.takeLast(10).ifEmpty { item.number }
                          if (!map.containsKey(key)) {
                              map[key] = item
                          }
                      }
                      return map.values.sortedBy { it.name.lowercase() }
                  }

                  fun getRecentCalls(context: Context): List<CallLogItem> {
                      val list = mutableListOf<CallLogItem>()
                      if (ContextCompat.checkSelfPermission(context, Manifest.permission.READ_CALL_LOG)
                          == PackageManager.PERMISSION_GRANTED
                      ) {
                          try {
                              val sdf = SimpleDateFormat("dd/MM HH:mm", Locale.getDefault())
                              val projection = arrayOf(
                                  CallLog.Calls.CACHED_NAME,
                                  CallLog.Calls.NUMBER,
                                  CallLog.Calls.TYPE,
                                  CallLog.Calls.DATE
                              )
                              context.contentResolver.query(
                                  CallLog.Calls.CONTENT_URI,
                                  projection,
                                  null,
                                  null,
                                  CallLog.Calls.DATE + " DESC"
                              )?.use { cursor ->
                                  val nameIdx = cursor.getColumnIndex(CallLog.Calls.CACHED_NAME)
                                  val numIdx = cursor.getColumnIndex(CallLog.Calls.NUMBER)
                                  val typeIdx = cursor.getColumnIndex(CallLog.Calls.TYPE)
                                  val dateIdx = cursor.getColumnIndex(CallLog.Calls.DATE)
                                  var count = 0
                                  while (cursor.moveToNext() && count < 40) {
                                      val number = if (numIdx >= 0) cursor.getString(numIdx) ?: "" else ""
                                      if (number.isBlank()) continue
                                      val resolvedName = if (nameIdx >= 0) cursor.getString(nameIdx) else null
                                      val name = if (!resolvedName.isNullOrBlank()) resolvedName else (getContactName(context, number) ?: number)
                                      val typeInt = if (typeIdx >= 0) cursor.getInt(typeIdx) else CallLog.Calls.MISSED_TYPE
                                      val type = when (typeInt) {
                                          CallLog.Calls.INCOMING_TYPE -> "↙ Gelen"
                                          CallLog.Calls.OUTGOING_TYPE -> "↗ Giden"
                                          CallLog.Calls.MISSED_TYPE -> "✖ Cevapsız"
                                          CallLog.Calls.REJECTED_TYPE -> "✖ Reddedilen"
                                          else -> "• Arama"
                                      }
                                      val dateMs = if (dateIdx >= 0) cursor.getLong(dateIdx) else System.currentTimeMillis()
                                      list.add(CallLogItem(name, number, type, sdf.format(Date(dateMs))))
                                      count++
                                  }
                              }
                          } catch (_: Exception) {}
                      }
                      if (list.isEmpty() && syncedHostCallLogs.isNotEmpty()) {
                          return syncedHostCallLogs
                      }
                      return list
                  }

                  fun prependLocalMissedCallLog(rawNumber: String, name: String?, timeStr: String) {
                      val displayName = if (!name.isNullOrBlank()) name else rawNumber
                      val newItem = CallLogItem(displayName, rawNumber, "✖ Cevapsız", timeStr)
                      val updated = mutableListOf(newItem)
                      updated.addAll(syncedHostCallLogs.take(39))
                      syncedHostCallLogs = updated
                  }

                  fun serializeContacts(context: Context): String {
                      return getAllContacts(context).take(500).joinToString(";") { item ->
                          val safeName = item.name.replace(";", " ").replace("~", " ").replace("|", " ")
                          val safeNum = item.number.replace(";", "").replace("~", "").replace("|", "")
                          "$safeName~$safeNum"
                      }
                  }

                  fun updateSyncedContacts(serialized: String) {
                      if (serialized.isBlank()) return
                      val list = mutableListOf<ContactItem>()
                      for (entry in serialized.split(";")) {
                          val parts = entry.split("~", limit = 2)
                          if (parts.size == 2 && parts[0].isNotBlank() && parts[1].isNotBlank()) {
                              list.add(ContactItem(parts[0], parts[1]))
                          }
                      }
                      if (list.isNotEmpty()) {
                          syncedHostContacts = list
                      }
                  }

                  fun serializeCallLogs(context: Context): String {
                      return getRecentCalls(context).take(35).joinToString(";") { item ->
                          val safeName = item.name.replace(";", " ").replace("~", " ").replace("|", " ")
                          val safeNum = item.number.replace(";", "").replace("~", "").replace("|", "")
                          val safeType = item.type.replace(";", "").replace("~", "").replace("|", "")
                          val safeTime = item.timeText.replace(";", "").replace("~", "").replace("|", "")
                          "$safeName~$safeNum~$safeType~$safeTime"
                      }
                  }

                  fun updateSyncedCallLogs(serialized: String) {
                      if (serialized.isBlank()) return
                      val list = mutableListOf<CallLogItem>()
                      for (entry in serialized.split(";")) {
                          val parts = entry.split("~", limit = 4)
                          if (parts.size == 4) {
                              list.add(CallLogItem(parts[0], parts[1], parts[2], parts[3]))
                          }
                      }
                      if (list.isNotEmpty()) {
                          syncedHostCallLogs = list
                      }
                  }

                  fun resolveCallerInfo(context: Context, payload: String): Pair<String, String?> {
                      val parts = payload.split("~", limit = 3)
                      val rawNumber = parts[0].ifBlank { "Bilinmeyen Numara" }
                      val hostName = parts.getOrNull(1)?.takeIf { it.isNotBlank() }
                      val localName = getContactName(context, rawNumber)
                      return Pair(rawNumber, localName ?: hostName)
                  }
              }
          """)

          write_file("app/src/main/java/com/example/remotephone/SmsBridgeReceiver.kt", r"""
              package com.example.remotephone

              import android.content.BroadcastReceiver
              import android.content.Context
              import android.content.Intent
              import android.provider.Telephony
              import android.util.Base64
              import java.text.SimpleDateFormat
              import java.util.Date
              import java.util.Locale

              class SmsBridgeReceiver : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      if (intent.action != Telephony.Sms.Intents.SMS_RECEIVED_ACTION) return

                      val prefs = context.getSharedPreferences("RemotePhonePrefs", Context.MODE_PRIVATE)
                      if (prefs.getString("saved_mode", "NONE") != "HOST") return

                      val messages = Telephony.Sms.Intents.getMessagesFromIntent(intent)
                      if (messages.isNullOrEmpty()) return

                      val senderNumber = messages[0].originatingAddress ?: "Bilinmeyen"
                      val fullBody = StringBuilder()
                      for (msg in messages) {
                          msg.messageBody?.let { fullBody.append(it) }
                      }
                      val bodyText = fullBody.toString().trim()
                      if (bodyText.isEmpty()) return

                      val senderName = ContactHelper.getContactName(context, senderNumber) ?: ""
                      val timeStr = SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date())

                      ContactHelper.addRecentSms(senderNumber, senderName.ifBlank { null }, bodyText, timeStr)

                      val encodedBody = Base64.encodeToString(bodyText.toByteArray(Charsets.UTF_8), Base64.NO_WRAP)
                      val safeSender = senderNumber.replace("~", "")
                      val safeName = senderName.replace("~", " ").replace("|", " ")
                      val payload = "$safeSender~$safeName~$timeStr~$encodedBody"

                      if (HotspotLanBridge.isConnected) {
                          HotspotLanBridge.send("SMS_IN", payload)
                      } else {
                          BridgeKeepAliveService.pendingOfflineSms.add(payload)
                      }
                  }
              }
          """)

