                  private fun sendSmsViaBridgeOrLocal(targetNumber: String, messageText: String) {
                      val prefs = getSharedPreferences("RemotePhonePrefs", Context.MODE_PRIVATE)
                      val mode = prefs.getString("saved_mode", "NONE")
                      val timeStr = SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date())
                      val resolvedName = ContactHelper.getContactName(this, targetNumber)

                      if (mode == "CLIENT") {
                          if (!HotspotLanBridge.isConnected) {
                              playErrorAlertFeedback()
                              Toast.makeText(this, "⚠️ Note 10 Lite bağlantısı kopuk! SMS gönderilemedi.", Toast.LENGTH_LONG).show()
                              return
                          }
                          val encoded = Base64.encodeToString(messageText.toByteArray(Charsets.UTF_8), Base64.NO_WRAP)
                          val safeTarget = targetNumber.replace("~", "")
                          HotspotLanBridge.send("SEND_SMS", "$safeTarget~$encoded")
                          ContactHelper.addRecentSms(targetNumber, resolvedName, "↗ Siz: $messageText", timeStr)
                          Toast.makeText(this, "📤 SMS Note 10 Lite üzerinden gönderiliyor...", Toast.LENGTH_SHORT).show()
                      } else if (mode == "HOST") {
                          try {
                              val smsManager: SmsManager = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                                  getSystemService(SmsManager::class.java)
                              } else {
                                  @Suppress("DEPRECATION")
                                  SmsManager.getDefault()
                              }
                              val parts = smsManager.divideMessage(messageText)
                              if (parts.size > 1) {
                                  smsManager.sendMultipartTextMessage(targetNumber, null, parts, null, null)
                              } else {
                                  smsManager.sendTextMessage(targetNumber, null, messageText, null, null)
                              }
                              ContactHelper.addRecentSms(targetNumber, resolvedName, "↗ Siz: $messageText", timeStr)
                              Toast.makeText(this, "✅ SMS Gönderildi", Toast.LENGTH_SHORT).show()
                          } catch (e: Exception) {
                              Toast.makeText(this, "❌ SMS Hatası: ${e.localizedMessage}", Toast.LENGTH_LONG).show()
                          }
                      } else {
                          Toast.makeText(this, "Önce Kurulum menüsünden telefon modunu aktif edin", Toast.LENGTH_SHORT).show()
                      }
                  }

                  private fun playErrorAlertFeedback() {
                      try {
                          toneGenerator?.stopTone()
                          toneGenerator?.startTone(ToneGenerator.TONE_SUP_ERROR, 300)
                      } catch (_: Exception) {}
                      try {
                          val vibrator = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              vibrator?.vibrate(VibrationEffect.createWaveform(longArrayOf(0, 180, 100, 180), -1))
                          }
                      } catch (_: Exception) {}
                  }

                  private fun initiateCallAccordingToConnectionRule(targetNumber: String) {
                      val prefs = getSharedPreferences("RemotePhonePrefs", Context.MODE_PRIVATE)
                      val currentMode = prefs.getString("saved_mode", "NONE")

                      if (currentMode == "NONE") {
                          try {
                              val dialIntent = Intent(Intent.ACTION_DIAL, Uri.parse("tel:" + Uri.encode(targetNumber)))
                              startActivity(dialIntent)
                          } catch (_: Exception) {
                              Toast.makeText(this, "Önce Kurulum menüsünden mod seçin", Toast.LENGTH_SHORT).show()
                          }
                          return
                      }

                      if (currentMode == "HOST") {
                          if (!HotspotLanBridge.isConnected) {
                              HostInCallService.placeSystemCall(this, targetNumber)
                              val callIntent = Intent(this, RemoteCallActivity::class.java).apply {
                                  putExtra("CALLER_NUMBER", targetNumber)
                                  putExtra("IS_OUTGOING", true)
                                  putExtra("IS_LOCAL_FALLBACK", true)
                              }
                              startActivity(callIntent)
                          } else {
                              Toast.makeText(
                                  this,
                                  "S25 Ultra bağlı! Görüşmeler S25 Ultra ve Bluetooth kulaklık üzerinden yürütülüyor.",
                                  Toast.LENGTH_LONG
                              ).show()
                          }
                          return
                      }

                      if (!HotspotLanBridge.isConnected) {
                          playErrorAlertFeedback()
                          HotspotLanBridge.triggerScreenWakeRefresh(this)
                          AlertDialog.Builder(this)
                              .setTitle("⚠️ Note 10 Lite Bağlantısı Kopuk!")
                              .setMessage(
                                  "1. Telefon (Note 10 Lite) ile yerel Wi-Fi / Hotspot bağlantısı şu an kurulu değil.\n\n" +
                                  "Arama başlatılamadı. Lütfen Wi-Fi veya Hotspot bağlantınızı kontrol edin (arka planda yeniden bağlanma tetiklendi)."
                              )
                              .setPositiveButton("Tekrar Bağlan") { _, _ ->
                                  HotspotLanBridge.triggerScreenWakeRefresh(this)
                              }
                              .setNegativeButton("Tamam", null)
                              .show()
                          return
                      }

                      if (!BluetoothMonitor.isAnyHeadsetReady(this)) {
                          playErrorAlertFeedback()
                          AlertDialog.Builder(this)
                              .setTitle("⚠️ Bluetooth Kulaklık Hazır Değil!")
                              .setMessage(
                                  "Bluetooth kulaklığınız şu an bağlı görünmüyor.\n\n" +
                                  "Aramayı şimdi başlatırsanız ses Note 10 Lite üzerinde açılacaktır (kulaklığı sonradan açarsanız ses otomatik kulaklığa geçer).\n\n" +
                                  "Yine de aramayı başlatmak istiyor musunuz?"
                              )
                              .setPositiveButton("Yine de Ara") { _, _ ->
                                  startRemoteOutgoingCall(targetNumber)
                              }
                              .setNegativeButton("İptal (Kulaklığı Aç)", null)
                              .show()
                          return
                      }

                      startRemoteOutgoingCall(targetNumber)
                  }

                  private fun startRemoteOutgoingCall(targetNumber: String) {
                      HotspotLanBridge.send("DIAL", targetNumber)
                      val callIntent = Intent(this, RemoteCallActivity::class.java).apply {
                          putExtra("CALLER_NUMBER", targetNumber)
                          putExtra("IS_OUTGOING", true)
                          putExtra("IS_LOCAL_FALLBACK", false)
                      }
                      startActivity(callIntent)
                  }

                  override fun onResume() {
                      super.onResume()
                      val prefs = getSharedPreferences("RemotePhonePrefs", Context.MODE_PRIVATE)
                      val savedMode = prefs.getString("saved_mode", "NONE") ?: "NONE"
                      if (savedMode != "NONE") {
                          if (BridgeKeepAliveService.instance == null) {
                              startKeepAliveService(savedMode)
                          }
                          HotspotLanBridge.triggerScreenWakeRefresh(this)
                      }
                      updateConnectionBanner(HotspotLanBridge.isConnected)
                  }

                  private fun playStrongKeyFeedback(view: View, dtmfTone: Int) {
                      try {
                          toneGenerator?.stopTone()
                          toneGenerator?.startTone(dtmfTone, 160)
                      } catch (_: Exception) {}

                      view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                      try {
                          val vibrator = getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              vibrator?.vibrate(VibrationEffect.createOneShot(25, VibrationEffect.DEFAULT_AMPLITUDE))
                          } else {
                              @Suppress("DEPRECATION")
                              vibrator?.vibrate(25)
                          }
                      } catch (_: Exception) {}
                  }

                  private fun formatContactRow(item: ContactItem): String {
                      return item.name + NL + item.number
                  }

                  private fun formatCallLogRow(item: CallLogItem): String {
                      return "${item.name} (${item.type})" + NL + "${item.number} • ${item.timeText}"
                  }

                  private fun showContactsAndLogsDialog() {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CONTACTS)
                          != PackageManager.PERMISSION_GRANTED
                      ) {
                          permissionLauncher.launch(
                              arrayOf(Manifest.permission.READ_CONTACTS, Manifest.permission.READ_CALL_LOG)
                          )
                          Toast.makeText(this, "Rehber izni verdikten sonra tekrar dokunun", Toast.LENGTH_SHORT).show()
                          return
                      }

                      val allContacts = ContactHelper.getAllContacts(this)
                      val recentCalls = ContactHelper.getRecentCalls(this)
                      var showingRecentCalls = false

                      val container = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(36, 20, 36, 12)
                      }

                      val tabRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                      }

                      val btnTabContacts = Button(this).apply {
                          text = "👥 Rehber (${allContacts.size})"
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      }

                      val btnTabRecents = Button(this).apply {
                          text = "🕒 Son Aramalar (${recentCalls.size})"
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      }

                      tabRow.addView(btnTabContacts)
                      tabRow.addView(btnTabRecents)

                      val searchInput = EditText(this).apply {
                          hint = "Kişi veya numara ara..."
                          isSingleLine = true
                      }

                      val listView = ListView(this)
                      val displayedNumbers = mutableListOf<Pair<String, String>>()
                      val adapter = ArrayAdapter(
                          this,
                          android.R.layout.simple_list_item_1,
                          mutableListOf<String>()
                      )
                      listView.adapter = adapter

                      fun refreshList(query: String) {
                          val q = query.trim().lowercase()
                          displayedNumbers.clear()
                          adapter.clear()
                          if (!showingRecentCalls) {
                              val filtered = if (q.isEmpty()) allContacts else allContacts.filter {
                                  it.name.lowercase().contains(q) || it.number.contains(q)
                              }
                              for (c in filtered) {
                                  displayedNumbers.add(Pair(c.name, c.number))
                                  adapter.add(formatContactRow(c))
                              }
                          } else {
                              val filtered = if (q.isEmpty()) recentCalls else recentCalls.filter {
                                  it.name.lowercase().contains(q) || it.number.contains(q)
                              }
                              for (r in filtered) {
                                  displayedNumbers.add(Pair(r.name, r.number))
                                  adapter.add(formatCallLogRow(r))
                              }
                          }
                          adapter.notifyDataSetChanged()
                      }

                      btnTabContacts.setOnClickListener {
                          showingRecentCalls = false
                          refreshList(searchInput.text?.toString() ?: "")
                      }

                      btnTabRecents.setOnClickListener {
                          showingRecentCalls = true
                          refreshList(searchInput.text?.toString() ?: "")
                      }

                      refreshList("")

                      container.addView(tabRow)
                      container.addView(searchInput)
                      container.addView(listView)

                      val dialog = AlertDialog.Builder(this)
                          .setTitle("Rehber & Son Aramalar")
                          .setView(container)
                          .setNegativeButton("Kapat", null)
                          .create()

                      searchInput.addTextChangedListener(object : TextWatcher {
                          override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                          override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {
                              refreshList(s?.toString() ?: "")
                          }
                          override fun afterTextChanged(s: Editable?) {}
                      })

                      listView.setOnItemClickListener { _, _, position, _ ->
                          val selected = displayedNumbers.getOrNull(position)
                          if (selected != null) {
                              etDialNumber.setText(selected.second)
                              Toast.makeText(this@MainActivity, "${selected.first} seçildi", Toast.LENGTH_SHORT).show()
                              dialog.dismiss()
                          }
                      }

                      dialog.show()
                  }

                  private fun updateConnectionBanner(connected: Boolean) {
                      val prefs = getSharedPreferences("RemotePhonePrefs", Context.MODE_PRIVATE)
                      val mode = prefs.getString("saved_mode", "NONE")
                      val hsSummary = BluetoothMonitor.getCombinedHeadsetSummary(this)

                      if (mode == "NONE") {
                          tvConnectionStatus.text = "⏸ Köprü Devre Dışı (Pil Tasarrufu Modu)"
                          return
                      }

                      if (connected) {
                          tvConnectionStatus.text = if (mode == "HOST") {
                              "● S25 Ultra Bağlı (Çağrı & SMS Köprüsü) | $hsSummary"
                          } else {
                              val batInfo = if (hostBatteryPart.isNotEmpty()) " | $hostBatteryPart" else ""
                              "● Bağlı$batInfo | $hsSummary"
                          }
                      } else {
                          tvConnectionStatus.text = if (mode == "HOST") {
                              "● Bağımsız Telefon Modu (S25 Ultra Bağlı Değil)"
                          } else {
                              "⚠️ Note 10 Lite Bağlantısı Kopuk! ($hsSummary)"
                          }
                      }
                  }

                  override fun onEvent(event: String, data: String) {
                      if (event == "TELEMETRY") {
                          val rawText = data.substringAfter("~", data)
                          hostBatteryPart = rawText.substringBefore(" | ").trim()
                          updateConnectionBanner(HotspotLanBridge.isConnected)
                      }
                  }

                  override fun onConnectionChanged(connected: Boolean) {
                      updateConnectionBanner(connected)
                  }

                  private fun setupGoogleDialpad(etDialNumber: EditText) {
                      val keys = listOf(
                          R.id.key1 to Pair("1", ToneGenerator.TONE_DTMF_1),
                          R.id.key2 to Pair("2", ToneGenerator.TONE_DTMF_2),
                          R.id.key3 to Pair("3", ToneGenerator.TONE_DTMF_3),
                          R.id.key4 to Pair("4", ToneGenerator.TONE_DTMF_4),
                          R.id.key5 to Pair("5", ToneGenerator.TONE_DTMF_5),
                          R.id.key6 to Pair("6", ToneGenerator.TONE_DTMF_6),
                          R.id.key7 to Pair("7", ToneGenerator.TONE_DTMF_7),
                          R.id.key8 to Pair("8", ToneGenerator.TONE_DTMF_8),
                          R.id.key9 to Pair("9", ToneGenerator.TONE_DTMF_9),
                          R.id.keyStar to Pair("*", ToneGenerator.TONE_DTMF_S),
                          R.id.key0 to Pair("0", ToneGenerator.TONE_DTMF_0),
                          R.id.keyHash to Pair("#", ToneGenerator.TONE_DTMF_P)
                      )

                      for ((id, info) in keys) {
                          val btn = findViewById<Button>(id)
                          btn.setOnClickListener {
                              playStrongKeyFeedback(it, info.second)
                              etDialNumber.append(info.first)
                              HotspotLanBridge.send("DTMF", info.first)
                          }
                          if (id == R.id.key0) {
                              btn.setOnLongClickListener {
                                  playStrongKeyFeedback(it, ToneGenerator.TONE_DTMF_0)
                                  etDialNumber.append("+")
                                  true
                              }
                          }
                      }

                      val btnBackspace = findViewById<Button>(R.id.btnBackspace)
                      btnBackspace.setOnClickListener {
                          it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                          val text = etDialNumber.text.toString()
                          if (text.isNotEmpty()) {
                              etDialNumber.setText(text.dropLast(1))
                          }
                      }
                      btnBackspace.setOnLongClickListener {
                          it.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                          etDialNumber.setText("")
                          true
                      }
                  }

                  @SuppressLint("BatteryLife")
                  private fun requestBatteryOptimizationExemption() {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          try {
                              val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                                  data = Uri.parse("package:$packageName")
                              }
                              startActivity(intent)
                          } catch (_: Exception) {}
                      }
                  }

                  private fun checkFullScreenIntentPermission() {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                          val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                          if (!nm.canUseFullScreenIntent()) {
                              try {
                                  val intent = Intent(
                                      Settings.ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT,
                                      Uri.parse("package:$packageName")
                                  )
                                  startActivity(intent)
                              } catch (_: Exception) {}
                          }
                      }
                  }

                  private fun startKeepAliveService(mode: String) {
                      val serviceIntent = Intent(this, BridgeKeepAliveService::class.java).apply {
                          putExtra("MODE", mode)
                      }
                      ContextCompat.startForegroundService(this, serviceIntent)
                  }

                  private fun requestRuntimePermissions() {
                      val permissions = mutableListOf(
                          Manifest.permission.READ_PHONE_STATE,
                          Manifest.permission.READ_PHONE_NUMBERS,
                          Manifest.permission.CALL_PHONE,
                          Manifest.permission.ANSWER_PHONE_CALLS,
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.READ_CONTACTS,
                          Manifest.permission.READ_CALL_LOG,
                          Manifest.permission.RECEIVE_SMS,
                          Manifest.permission.SEND_SMS,
                          Manifest.permission.READ_SMS
                      )
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          permissions.add(Manifest.permission.POST_NOTIFICATIONS)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          permissions.add(Manifest.permission.BLUETOOTH_CONNECT)
                      }
                      val missing = permissions.filter {
                          ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                      }
                      if (missing.isNotEmpty()) {
                          permissionLauncher.launch(missing.toTypedArray())
                      }
                  }

                  override fun onDestroy() {
                      HotspotLanBridge.removeListener(this)
                      BluetoothMonitor.removeListener(this)
                      toneGenerator?.release()
                      super.onDestroy()
                  }
              }
          """)

