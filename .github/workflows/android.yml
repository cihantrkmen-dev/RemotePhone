                  override fun onNewIntent(intent: Intent) {
                      super.onNewIntent(intent)
                      setIntent(intent)
                      handleIncomingIntent(intent)
                  }

                  private fun handleIncomingIntent(intent: Intent?) {
                      if (intent == null) return
                      if (intent.action == Intent.ACTION_DIAL || intent.action == Intent.ACTION_VIEW) {
                          intent.data?.schemeSpecificPart?.let { etDialNumber.setText(it) }
                      }
                      val prefill = intent.getStringExtra("PREFILL_NUMBER")
                      if (!prefill.isNullOrBlank()) {
                          etDialNumber.setText(prefill)
                          if (intent.getBooleanExtra("AUTO_CALL_FROM_NOTIFICATION", false)) {
                              intent.removeExtra("AUTO_CALL_FROM_NOTIFICATION")
